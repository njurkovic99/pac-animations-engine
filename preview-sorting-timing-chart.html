<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sorting-timing-chart — preview</title>
<style>/* pac-animations — design system
   15 tokens replacing the 188 distinct color values found across the
   original 25 animation files. */

:root {
  /* surfaces */
  --bg:            #0f1117;
  --panel:         #171a23;
  --panel-header:  #1e222d;
  --border:        #2b3040;

  /* text */
  --text:          #d8dce6;
  --text-dim:      #8b93a7;

  /* accents — one blue, not four */
  --accent:        #4a90e2;
  --accent-soft:   rgba(74, 144, 226, 0.18);

  /* semantic state */
  --ok:            #4caf82;
  --ok-soft:       rgba(76, 175, 130, 0.22);   /* green FILL: a value in its final sorted position */
  --warn:          #e0a33a;
  --error:         #e2564a;
  --highlight:     #d4a13c;

  /* structural */
  --radius:        6px;
  --gap:           14px;
  --mono:          "SF Mono", "Cascadia Code", Consolas, monospace;

  /* ---- layout metrics (see AUTHORING.md "Panels flow across both columns") ----
   * The engine (layoutStage) resolves every panel's size ONCE from the viewport
   * and from the maximum content each panel holds across the whole trace -- the
   * CODE panel to as many whole lines as fit (floored at 15), each other panel to
   * its measured content. These are the base metrics it reads. Design target: a
   * 1920x1080 window at 100%. */
  --code-line-h:   21px;     /* code line height -- an INTEGER px (see .pac-code) */
  --code-lines:    15;       /* code lines FLOOR before the CODE panel scrolls */
  --body-pad:      22px;     /* a panel body's vertical padding (both edges) */

  /* ---- fixed footer heights (see AUTHORING.md "Stable layout") ----
   * The narration bar and note box are RESERVED at a constant height so their
   * content changing step-to-step (longer narration, a note appearing or
   * disappearing) never changes the height of anything below the controls. The
   * stage stays the viewport absorber -- it shrinks on a short viewport so the
   * note is never pushed off the fold -- but because the footer below it is now
   * a constant height, the stage no longer resizes step-to-step, so the
   * controls / narration / note never move as steps advance. Longer content
   * scrolls internally within these fixed boxes. Sized to the measured maxima
   * (~2-line narration, ~4-line note) with headroom; tunable. */
  --narrate-h:     72px;
  --note-h:        104px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* The whole animation is a full-viewport flex column: the stage flexes to fill
 * the space that is left after the pinned chrome (title, controls, narration,
 * note), and the stage — never the page — is what shrinks on a short viewport.
 * This is the safety net that keeps the note on screen at any viewport height. */
.pac-root {
  padding: var(--gap);
  max-width: 1200px;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow: hidden;            /* the page itself never scrolls; panels do */
}
/* Everything except the stage keeps its natural height and is always visible;
 * only the stage (below) flexes and yields space on a short viewport. */
.pac-root > *:not(.pac-stage) { flex: 0 0 auto; }

.pac-title { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
.pac-sub   { color: var(--text-dim); font-size: 13px; margin: 0 0 var(--gap); }

/* ---- open-in-own-window link (see AUTHORING.md "Open-in-own-window link") ----
 * The escape hatch every animation carries: a self-link (target="_blank") that
 * opens the page full-window, where there's no Canvas chrome. SAME wording, SAME
 * style, ALWAYS visible -- identical in every context, so a preview shows the
 * exact control a student meets inside Canvas. Colour is --warn amber-orange so it
 * stands out from body text without reading as the --error danger red; styled as a
 * plain link (icon + underline on hover), never a content warning. */
.pac-openwin {
  display: inline-block;
  margin: -6px 0 var(--gap);
  color: var(--warn);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
}
.pac-openwin:hover  { text-decoration: underline; }
.pac-openwin:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
.pac-openwin[hidden] { display: none; }

/* ---- layout: panels flow across two columns ----
 * The stage is two side-by-side columns whose exact height is resolved ONCE by
 * the engine (layoutStage) and then held -- the master invariant. The code panel
 * anchors the top of the LEFT column at its 15-line floor; structure panels sit
 * side by side in a height-capped region at the top of the RIGHT column; and
 * bookkeeping panels flow down the right column, the balancing overflow
 * continuing beneath the code panel in the left. The engine sets the stage
 * height, the structure-region height, each bookkeeping body's min-height, and
 * the code body height inline, so nothing changes as steps advance. See
 * AUTHORING.md "Panels flow across both columns" / "structure region ceiling" /
 * "bookkeeping 2-row floor". */
.pac-stage {
  display: flex;
  flex-direction: row;
  align-items: stretch;        /* both columns take the resolved stage height */
  gap: var(--gap);
  position: relative;          /* anchor origin for the arrow overlay */
  flex: 0 0 auto;              /* height is set by the engine, not by flex */
  min-height: 0;
  overflow: hidden;            /* the bound is hard; panels scroll, not the stage */
}
/* A column is a vertical stack of panels. Width rules (AUTHORING.md "Width
 * rules"): height is scarce, width is not. Every panel takes its NATURAL content
 * width and LEFT-aligns (align-items: flex-start), leftover width at the right
 * stays empty -- the engine pins each panel's width to its per-run maximum. The
 * RIGHT column sizes to its widest panel; the LEFT column takes the rest and the
 * code panel fills it (the one panel that genuinely benefits from extra width).
 * Overflow is visible so a panel wider than its column is never clipped. */
.pac-col {
  display: flex; flex-direction: column; gap: var(--gap);
  align-items: flex-start; min-height: 0;
}
/* The left column sizes to its CONTENT, it does not grow to fill (item "code needs
 * a width ceiling"). If it grew, the code panel -- stretched to the column -- would
 * swallow all the slack and render a wide empty band right of every line. Sized to
 * content instead, the code takes only its longest line (capped by the engine's
 * inline max-width), the structure column packs immediately to its right, and the
 * leftover width falls at the far right of the stage, empty -- the width analogue of
 * the empty space left at the foot of the shorter column. */
.pac-col[data-side="left"]  { flex: 0 1 auto; min-width: 0; }
.pac-col[data-side="right"] { flex: 0 0 auto; }
.pac-col > .pac-panel { flex: 0 0 auto; }   /* panels keep their resolved heights */
/* CODE and STREAM stretch to their COLUMN's width; the engine bounds that with an
 * inline max-width (= the code's longest line) so neither grows past it. Code so a
 * long line never wraps; STREAM because output has no predictable width and, sitting
 * beneath the code, matches its width so the two read as one column. (AUTHORING.md
 * "Width rules".) */
.pac-col > .pac-panel[data-kind="code"],
.pac-col > .pac-panel[data-type="stream"] { align-self: stretch; }

/* The structure region: structure panes side by side at their own widths, from
 * the left, SHARING the row height the engine pins (<= half the stage). Each pane
 * scrolls internally, following its active element, if its content overflows. On
 * a narrow viewport the region stacks vertically instead (resolved once on load).
 */
.pac-structure {
  display: flex; flex-direction: row; gap: var(--gap);
  align-items: stretch; min-height: 0; flex: 0 0 auto;
}
.pac-structure:empty { display: none; }
.pac-structure[data-stacked] { flex-direction: column; align-items: flex-start; }
.pac-structure > .pac-panel { flex: 0 0 auto; }

/* The ROW STACK: the wide-structure placement (a structure too wide to sit beside
 * the code). Rows flow top to bottom; within a row panels sit left to right at
 * their natural widths and SHARE the row's height (align-items: stretch -> tops and
 * bottoms aligned, the same rule the structure region uses). Leftover width at a
 * row's right stays empty. Hidden until the engine switches to this layout. */
.pac-col[data-side="rows"] { flex: 1 1 auto; align-self: stretch; }
.pac-row { display: flex; flex-direction: row; gap: var(--gap); align-items: stretch; min-width: 0; }
.pac-row > .pac-panel,
.pac-row > .pac-structure { flex: 0 0 auto; }

/* ---- panel chrome ---- */
.pac-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.pac-panel-head {
  background: var(--panel-header);
  padding: 7px 11px;
  font-size: 12px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  /* The title never wraps: a panel is sized to its NATURAL width (which includes
   * this one-line title), so wrapping would mean the title is wider than the
   * panel the engine measured -- keep it one line so the measured width holds. */
  white-space: nowrap;
}
/* flex:none by DEFAULT, not flex:1. A panel body is given an explicit height by
 * the engine (from its own content), and flex-grow would let it STRETCH to fill
 * whatever column space sits below it -- the single mechanism behind every "panel
 * grew instead of sizing to content" regression. With flex:none no body can
 * inflate past its assigned height; overflow:auto still scrolls content that
 * exceeds it (a capped callstack, a wide/tall tree). See engine SIZE_POLICY. */
.pac-panel-body { padding: 11px; overflow: auto; flex: none; min-height: 0; }

/* ---- controls ---- */
.pac-controls {
  display: flex; gap: 8px; align-items: center;
  margin: var(--gap) 0; flex-wrap: wrap;
}
.pac-btn {
  background: var(--panel-header);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 14px;
  font-size: 13px;
  cursor: pointer;
}
.pac-btn:hover:not(:disabled) { border-color: var(--accent); }
.pac-btn:disabled { opacity: .38; cursor: default; }
.pac-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.pac-progress { color: var(--text-dim); font-size: 12px; margin-left: auto; }

.pac-narrate {
  background: var(--accent-soft);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px 14px 12px 16px;
  margin-top: var(--gap);
  /* Fixed height (not min-height): longer narration scrolls internally so the
   * note below never shifts and the controls above never move. */
  height: var(--narrate-h);
  overflow: auto;
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
}
/* A brief in-scheme pulse when the step changes, so a new explanation
 * actively pulls the eye instead of being missed. Retriggered per step
 * by the engine (see render()). */
@keyframes pac-narrate-flash {
  0%   { background: var(--accent-soft); box-shadow: 0 0 0 0 rgba(74, 144, 226, 0); }
  18%  { background: rgba(74, 144, 226, 0.34); box-shadow: 0 0 0 3px var(--accent-soft); }
  100% { background: var(--accent-soft); box-shadow: 0 0 0 0 rgba(74, 144, 226, 0); }
}
.pac-narrate-flash { animation: pac-narrate-flash 0.55s ease-out; }

/* ---- teaching-note box ----
 * Non-execution commentary (setup, common-mistake asides, post-watch
 * challenge). A note attaches to a step and shows only while that step is
 * current; on steps without one the box collapses to nothing (below) so the
 * layout reflows. Amber-keyed so it reads as an aside, distinct from the blue
 * narration bar. See AUTHORING.md "Steps vs. notes". */
.pac-note {
  background: rgba(212, 161, 60, 0.10);
  border: 1px solid var(--border);
  border-left: 4px solid var(--highlight);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-top: 8px;
  /* Reserved at a constant MINIMUM height, and the ONE box allowed to grow past
   * its reservation instead of scrolling. The note is the LAST element on the
   * page -- nothing sits below it -- so growing it downward pushes nothing. Every
   * OTHER panel is capped precisely because something below it would move.
   *   - min-height keeps the reservation: an empty or short note leaves the slot
   *     exactly --note-h tall, so a note appearing or disappearing never shifts
   *     the controls above it (the whole reason the reservation exists).
   *   - a note LONGER than the reservation extends BELOW the slot, into the bottom
   *     slack the stage leaves empty -- to fit its full text, no internal scrollbar
   *     ever. The stage is sized against the RESERVED --note-h, never this grown
   *     height (see _availableStageHeight), so the growth spills into that slack
   *     and the stage / controls / narration keep their exact positions.
   * The narration bar above is deliberately NOT part of this exception: it stays a
   * fixed height (it sits above the note, and capping it keeps the two distinct). */
  min-height: var(--note-h);
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.55;
}
.pac-note::before {
  content: "note";
  display: block;
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--highlight);
  margin-bottom: 3px;
}
/* An inline cross-animation link in a note or narration (e.g. part 2's opening
 * note back to part 1). Reads as a link -- accent colour, underlined -- without
 * shouting over the note prose. */
.pac-seg-link {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.pac-seg-link:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
/* No note on this step: the box is rendered invisible (nothing painted -- no
 * border, background, or "note" label) but KEEPS its reserved --note-h height,
 * so a note appearing or disappearing never shifts the controls above it. A
 * note-less step therefore reads as blank space, not an empty amber box. On the
 * design viewport this simply fills space that was previously bottom slack, so
 * it costs nothing there; on a short viewport it trades stage height for the
 * guarantee that Back/Next never move (AUTHORING.md "Stable layout"). */
.pac-note-empty { visibility: hidden; }
@keyframes pac-note-flash {
  0%   { background: rgba(212, 161, 60, 0.10); box-shadow: 0 0 0 0 rgba(212, 161, 60, 0); }
  18%  { background: rgba(212, 161, 60, 0.26); box-shadow: 0 0 0 3px rgba(212, 161, 60, 0.16); }
  100% { background: rgba(212, 161, 60, 0.10); box-shadow: 0 0 0 0 rgba(212, 161, 60, 0); }
}
.pac-note-flash { animation: pac-note-flash 0.55s ease-out; }

/* ---- attribution footer (engine-level, every animation) ----
 * A static credit line, rendered by the engine below the note box so every
 * animation carries it automatically. Muted (--text-dim, quieter than the
 * narration's --text) and italic so it reads as a caption/footer, not content;
 * no new colour token. It sits at the very bottom, BELOW the one element that
 * grows (the note box, which expands past its reservation to fit long text), so
 * the attribution is the only thing permitted to move between steps as note
 * length varies. That is safe: it is static and carries no per-step information,
 * and nothing sits below it. Everything ABOVE the note -- controls, narration,
 * panels -- stays immovable because the stage is sized against the note's
 * RESERVED height (see _availableStageHeight), never its grown height. */
.pac-attribution {
  margin-top: 10px;
  font-style: italic;
  font-size: 11px;
  color: var(--text-dim);
  text-align: left;
}

/* ---- memory-danger marker ----
 * A red warning triangle (⚠) + --error on any narration or note segment that
 * names a memory-integrity violation. Project-wide, cross-course convention.
 * See AUTHORING.md "Memory-danger marker". */
.pac-danger { color: var(--error); font-weight: 600; }

/* ---- CODE panel ----
 * The viewport is --code-lines (15) lines as a FLOOR, not a fixed value: the
 * engine (layoutStage) grows it to as many WHOLE lines as fit the left column
 * once every other panel is placed, capped at the listing's length, resolved
 * ONCE on load and on window resize and then held constant -- it never changes
 * with steps, frames, or the language tab. The engine sets the body height and
 * the listing's whole-line max-height inline; the height below is the pre-measure
 * fallback. See AUTHORING.md "Panels flow across both columns" and code.js for
 * the follow-the-highlight scrolling. */
.pac-panel[data-type="code"] .pac-panel-body {
  height: calc(var(--code-lines) * var(--code-line-h) + var(--body-pad));
  overflow: hidden;                      /* the listing scrolls, not the body */
}                                        /* flex:none now inherited from the default */
/* The body fills the column (bottom lines up with the other column); the listing
 * inside is clipped to a WHOLE number of lines (engine fitCodePanels sets its
 * max-height), so the last visible line is never a sliver and any sub-line
 * remainder is blank space below the listing rather than a gap below the panel. */
.pac-panel[data-type="code"] .pac-code { overflow-y: auto; }

.pac-lang-tabs { display: flex; gap: 4px; }
.pac-lang-tab {
  background: none; border: 1px solid transparent; color: var(--text-dim);
  font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
}
.pac-lang-tab[aria-selected="true"] {
  color: var(--text); border-color: var(--border); background: var(--panel);
}
/* line-height is an INTEGER px, not a unitless ratio: 12.5 x 1.65 = 20.625 is a
 * sub-pixel value, and that fractional height defeats whole-line clipping --
 * scrollTop rounds to whole pixels, so a fractional line height always leaves a
 * sliver of a neighbouring line. An integer line height makes the viewport
 * (lines x height), the scroll boundaries, and the panel height all exact, so
 * every visible line is whole (AUTHORING.md "whole lines only"). */
.pac-code { font-family: var(--mono); font-size: 12.5px; line-height: 21px; }
.pac-code-line { display: flex; padding: 0 4px; border-radius: 3px; white-space: pre; }
.pac-code-line.is-active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.pac-code-line.is-active.is-danger { background: rgba(226, 86, 74, 0.16); box-shadow: inset 2px 0 0 var(--error); color: var(--error); }
/* Parked caller line: the call site of a caller still on the stack, suspended
 * while the callee runs. The same highlight as the active line, greyed with the
 * SAME opacity token the CALLSTACK uses for its inactive (caller) frames -- not a
 * new colour. One visual language across both panels: bright = running now, dim
 * = suspended, waiting to resume. See AUTHORING.md "Line highlight — active line
 * vs. parked caller lines". */
.pac-code-line.is-parked { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); opacity: .5; }
.pac-code-num { color: var(--text-dim); width: 2.2em; text-align: right; margin-right: 12px; user-select: none; }

/* ---- STREAM panel ---- */
/* The STREAM accumulates output as steps advance. As a bookkeeping panel it is
 * reserved by the engine (layoutStage) to its per-run MAXIMUM number of lines
 * (with a 2-row floor), so an empty STREAM at step 0 is already a box of that
 * final size and nothing below it shifts as lines arrive. stream.js keeps the
 * newest line scrolled into view. See AUTHORING.md "bookkeeping 2-row floor". */
.pac-stream { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; }
.pac-stream-line { white-space: pre; }
.pac-stream-line.dir-in   { color: var(--warn); }
.pac-stream-line.dir-out  { color: var(--text); }
.pac-stream-line.is-new   { background: var(--accent-soft); border-radius: 3px; }
.pac-stream-cursor { color: var(--accent); animation: pac-blink 1s steps(2) infinite; }
@keyframes pac-blink { 50% { opacity: 0; } }

/* ---- CELLS panel ---- */
/* A compact VARIABLES strip flows horizontally and WRAPS to a new row only when
 * the current row is full (AUTHORING.md "The variables strip flows horizontally")
 * -- the base wrap. An INDEXED array (a non-compact box: the list's backing
 * store) must NOT wrap: a wrapped [0][1][2] / [3][4] is the index-vs-position
 * confusion drawn as a layout, so it stays one row and SCROLLS horizontally when
 * it outgrows its column (the panel body is overflow:auto). Marked arrays already
 * nowrap (below). */
.pac-cells { display: flex; flex-wrap: wrap; gap: 6px; }
.pac-panel:not([data-compact]) .pac-cells[data-render="box"]:not([data-marked]) { flex-wrap: nowrap; }
/* The `row` render mode (a labelled `name value` cell) also flows HORIZONTALLY and
 * wraps only when full -- it is a variables strip, never a vertical list (that was
 * the old state-strip layout the horizontal-flow rule replaces). */
.pac-cells[data-render="row"] { flex-direction: row; flex-wrap: wrap; gap: 6px; }
.pac-cell {
  border: 1px solid var(--border); border-radius: 4px;
  padding: 5px 9px; font-family: var(--mono); font-size: 12.5px;
  min-width: 40px; text-align: center; background: var(--bg);
}
.pac-cell-label { display: block; font-size: 10px; color: var(--text-dim); }
/* The value always reserves one line of height, so a cell with no value (an
 * `empty` cell) keeps the SAME dimensions as a filled one -- the X then spans a
 * full box rather than a squashed strip. */
.pac-cell-value { display: block; min-height: 1.25em; }
.pac-cell[data-role="active"]   { border-color: var(--accent); background: var(--accent-soft); }
.pac-cell[data-role="compared"] { border-color: var(--highlight); }
.pac-cell[data-role="ok"]       { border-color: var(--ok); }
/* sorted: a value in its FINAL sorted position -- permanent, never released. Green
 * FILL (a distinct channel from the green OUTLINE that marks a stable structure
 * member): outline = membership, fill = state. Mutually exclusive with the blue
 * activity fill -- a settled value is not being acted on -- so a cell that becomes
 * `sorted` drops any `active` fill on the same step. A finished sort ends with every
 * cell green. (AUTHORING.md "sorted = green fill". Sorting animations only.) */
.pac-cell[data-role="sorted"]   { border-color: var(--ok); background: var(--ok-soft); }
.pac-cell[data-role="error"]    { border-color: var(--error); color: var(--error); }
/* empty: indeterminate storage -- an unwritten array cell OR an unassigned
 * standalone variable (one placeholder for both). Same box and dimensions as a
 * member, but a DASHED dimmed border and a thin, low-opacity X drawn corner to
 * corner across the interior (an SVG stretched to the cell), with NOTHING in the
 * value slot. The X alone reads as "holds no meaningful value" -- impossible to
 * mistake for a space or a rendering failure, and a different SHAPE from `stale`'s
 * greyed character. No dash sits in the slot: it could read as a value, and next
 * to the sorting animations' negatives (-1, -3) specifically as a minus sign
 * (A7 item 55). A real stored value such as the -1 sentinel is NOT empty and
 * renders normally. */
.pac-cell[data-role="empty"] {
  border-style: dashed;
  border-color: var(--border);
  color: var(--text-dim);
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20preserveAspectRatio='none'%20viewBox='0%200%20100%20100'%3E%3Cg%20stroke='%238b93a7'%20stroke-width='2'%20stroke-opacity='0.3'%3E%3Cline%20x1='9'%20y1='9'%20x2='91'%20y2='91'/%3E%3Cline%20x1='91'%20y1='9'%20x2='9'%20y2='91'/%3E%3C/g%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 100% 100%;
}
/* stale: a cell whose value is no longer a queue member. The value is STILL
 * shown, greyed (~40%), with NO member outline -- distinct from `empty` (a cell
 * that never held anything). Blanking it would wrongly imply the program can see
 * emptiness by looking at the array; the character is still in memory, only the
 * index moved. See AUTHORING.md / panel-inventory §2 and queues-count-vs-rear. */
.pac-cell[data-role="stale"]    { opacity: .4; border-color: transparent; }

.pac-cells[data-render="row"] .pac-cell {
  display: flex; align-items: baseline; gap: 8px; text-align: left;
}
.pac-cells[data-render="row"] .pac-cell-label { display: inline; }

/* ---- 2D GRID / adjacency matrix (render: 'grid', see panels/cells.js
 * renderGrid) ----
 * A rows x cols grid with a header band on the top edge (column indices) and the
 * left edge (row indices), so a cell reads as "row j, column k" -- exactly the
 * ordered-pair a boolean adjacency matrix stores. Every cell is present from step
 * 0 (the master invariant: the grid never grows), each a fixed size for every
 * state, so nothing shifts as cells fill. It is a STRUCTURE panel and never
 * scrolls: the whole n x n grid is sized once and sits at natural size.
 *
 * F vs T is carried by the LETTER, dim vs bright -- a matrix that is mostly F
 * should read as mostly quiet, with each T standing out. Blue (the `active` role)
 * is reserved for the ONE channel it means everywhere: the cell written THIS
 * step. The DIAGONAL (row == col) carries a faint wash -- not a colour with
 * meaning, just enough that the mirror line the lecture draws is visible when the
 * symmetry appears; it never competes with the blue activity fill (a written cell
 * keeps its role's styling; the wash only tints an un-roled diagonal cell). */
.pac-cells[data-render="grid"] { display: block; }
.pac-matrix { display: grid; gap: 4px; width: max-content; }
.pac-matrix-head {
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  min-width: 30px; min-height: 30px;
}
.pac-matrix-corner { min-width: 30px; min-height: 30px; }
.pac-matrix-cell {
  min-width: 30px; min-height: 30px; padding: 4px;
  display: flex; align-items: center; justify-content: center;
}
.pac-matrix-cell .pac-cell-value { min-height: auto; }
.pac-matrix-cell[data-val="F"] .pac-cell-value { color: var(--text-dim); }
.pac-matrix-cell[data-val="T"] .pac-cell-value { color: var(--text); font-weight: 600; }
.pac-matrix-cell[data-diagonal]:not([data-role]) { background: rgba(139, 147, 167, 0.09); }

/* ---- index-pointer markers (AUTHORING.md "Planned primitive — the index
 * pointer") ----
 * A labeled caret that points at an array cell and moves as its index changes --
 * the array-world analog of the linked-list pointer arrow. When a `box` CELLS
 * panel carries `markers`, each cell is rendered as a COLUMN: the box, an index
 * label beneath it, then a marker track. A marker's caret sits under the cell at
 * its index, its label below the caret; two markers on the SAME cell render side
 * by side (flex row) rather than overlapping. All markers are solid/stored --
 * there is no "derived" marker style. */
/* A marked index array never WRAPS: [0][1][2][3] is one row, always -- a wrapped
 * index array is the index-vs-position confusion rendered as a layout. If the row
 * is wider than its panel it scrolls horizontally rather than folding. This also
 * gives the panel a natural single-row width, so a structure pane holding it is
 * sized to fit all its cells side by side. */
.pac-cells[data-marked] { align-items: start; gap: 8px; flex-wrap: nowrap; }
/* A cell column is a FIXED width, sized once (--cell-col-min, set by the renderer
 * from the busiest cell in the whole trace) to hold that many markers side by side.
 * Because every column reserves that width whether or not it currently holds a
 * cluster, a second marker landing on a cell never widens it, and no cell shifts
 * between steps. Markers on one cell sit side by side, centred under the cell. */
.pac-cell-col {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  min-width: var(--cell-col-min, 56px);
}
.pac-cell-col .pac-cell { min-width: 44px; padding: 3px 9px; }
/* The row's name (e.g. "contents"), once at the left, aligned with the cell
 * boxes so it reads as the array's label. */
.pac-cells-name {
  align-self: start; margin-top: 6px; margin-right: 2px;
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
}
/* Bracketed index labels: [0] [1] … mark position as an INDEX, not a value. */
.pac-cell-index { font-size: 10.5px; color: var(--text-dim); font-family: var(--mono); }
/* The marker lane: markers side by side, centred under the cell (the column's
 * fixed width holds the busiest cell's cluster, so this never widens the column). */
.pac-cell-markers {
  display: flex; justify-content: center; gap: 6px;
  margin-top: 2px; white-space: nowrap;
}
.pac-marker { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.pac-marker-caret { color: var(--accent); font-size: 11px; }
.pac-marker-label {
  font-family: var(--mono); font-size: 10.5px; color: var(--accent); font-weight: 600;
}

/* Parked markers (index < 0): a cell column to the left of cell [0] whose box and
 * index bands are INVISIBLE (they only reserve height), so its marker track lines
 * up with every cell's marker track. The markers are dimmed so they read as
 * "pointing at nothing yet" rather than missing. Its width is reserved once
 * (--parked-min, from the trace's max simultaneously-parked markers), constant
 * across steps; 0 when nothing ever parks, so the lane then takes no space. */
.pac-cell-parked {
  margin-right: 2px;
  min-width: var(--parked-min, 0px); width: var(--parked-min, 0px);
}
.pac-cell-parked .pac-cell,
.pac-cell-parked .pac-cell-index { visibility: hidden; }
/* The invisible box + index only reserve HEIGHT (so the parked marker track lines
 * up with the cells' tracks); they must not reserve WIDTH, or the lane is padded
 * to the index label's width. Zero their width -- the line box still holds height. */
.pac-cell-parked .pac-cell,
.pac-cell-parked .pac-cell-index { width: 0; min-width: 0; overflow: hidden; }
.pac-cell-parked .pac-marker { opacity: .5; }

/* ---- vertical stack column (render: 'column') ----
 * The vertical analogue of the marked box row, for a stack (AUTHORING.md "The
 * one new capability"). Cell [0] is at the BOTTOM; the column grows UPWARD. Each
 * cell is a row of three fixed-width bands: a LEFT marker lane, the box, and a
 * RIGHT bracketed index label. Every band keeps a constant width, so the box
 * column and both label bands never shift as cells fill/empty/go stale or as the
 * marker moves -- and a marker leaving the parked lane travels purely vertically
 * (the left lane holds the same x on every row, including the parked one). */
.pac-cells[data-render="column"] {
  flex-direction: column;
  flex-wrap: nowrap;
  align-items: center;      /* centre the fixed-width rows in the panel */
  gap: 3px;
}
.pac-col-row { display: flex; flex-direction: row; align-items: center; gap: 8px; }
/* LEFT marker lane: fixed width, markers right-aligned so the caret hugs the box.
 * Wide enough for the longest label ("stack_ix ▶") without touching the box. */
.pac-col-markers {
  min-width: 68px;   /* hugs the "stack_ix ▶" label (~64px); the reserved lane must
                        be constant across rows so the boxes align, but no wider than
                        the label needs -- excess reads as dead space left of the stack */
  display: flex; flex-direction: row; justify-content: flex-end; align-items: center;
  gap: 8px; white-space: nowrap;
}
.pac-col-row .pac-cell { min-width: 46px; padding: 2px 10px; }
/* RIGHT index band: fixed width, bracketed [0].. labels mark position as an
 * INDEX, not a value -- the vertical analogue of the fixed-height index band. */
.pac-col-index {
  min-width: 34px; text-align: left;
  font-family: var(--mono); font-size: 10.5px; color: var(--text-dim);
}
/* A column marker: label left, right-pointing caret (▶) hugging the box. */
.pac-col-marker { display: flex; flex-direction: row; align-items: center; gap: 4px; }
.pac-col-marker .pac-marker-caret { color: var(--accent); font-size: 12px; line-height: 1; }
.pac-col-marker .pac-marker-label {
  font-family: var(--mono); font-size: 10.5px; color: var(--accent); font-weight: 600;
}
/* Parked lane (a negative-index sentinel): the row BELOW cell [0]. Its box and
 * index label are INVISIBLE -- they only reserve the row's height so the cells
 * above never shift -- and the marker is dimmed so it reads as "pointing at
 * nothing yet" rather than missing. */
.pac-col-parked .pac-cell,
.pac-col-parked .pac-col-index { visibility: hidden; }
.pac-col-parked .pac-col-marker { opacity: .5; }

/* Compact strip (e.g. "A stores"): a HORIZONTAL row of uniform-width labelled
 * boxes, all visible at once with no scrollbar. Two strips compared side by side
 * stay identical in width and styling; only the differing box's value changes. */
.pac-panel[data-compact] .pac-cells[data-render="box"] { gap: 8px; }
.pac-panel[data-compact] .pac-cells[data-render="box"] .pac-cell {
  min-width: 62px; padding: 6px 10px;
}

/* ---- CALLSTACK panel ----
 * A debugger's locals/stack pane. Frames push on call / pop on return; the top
 * (running) frame is emphasized and rendered first (newest on top), callers
 * below are greyed but present, and `main` is the last (bottom) frame. Stable
 * layout: the bounded stage gives the pane a fixed grid cell, so frames
 * top-align within it and the pane scrolls internally if the stack ever grows
 * past the cell -- the running frame stays visible at the top and nothing below
 * the stage shifts. See AUTHORING.md "CALLSTACK panel" and "Stable layout". */
.pac-callstack {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;    /* frames top-align; no empty void above them */
  gap: 5px;
}
/* Reserve the scrollbar gutter on the callstack body ALWAYS, whether or not the
 * stack is currently deep enough to scroll. A frame is a single nowrap line
 * stretched to the body width; if a vertical scrollbar appeared (deep recursion,
 * past the 3-frame ceiling) and stole width that the panel's measured max-content
 * did not reserve, the widest frame would overflow -- its border cutting through
 * "= 1)" and the closing paren landing outside the box. Reserving the gutter up
 * front means the measured width already includes it, so the frame's inner width
 * never loses to a scrollbar: rendered text width <= box inner width, by
 * construction, in every frame -- shallow or deep. (Fixes A7 item 51.) */
.pac-panel[data-type="callstack"] .pac-panel-body { scrollbar-gutter: stable; }
.pac-frame {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  padding: 4px 9px;
  opacity: .5;                    /* caller frames are greyed but present */
  transition: opacity .15s, border-color .15s;
}
/* The running (top) frame: full opacity + a blue outline, so "where are we
 * executing" reads at a glance and matches the highlighted code line. */
.pac-frame[data-active="true"] {
  opacity: 1;
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent-soft);
}
/* The call line: ONE line, the call itself -- fn(name = value, …), or fn() for
 * a frame with no parameters. It never wraps: the whole call stays on a single
 * line so a frame is exactly one line tall (plus any locals below), and the
 * panel's height is the frame count, not padded slots. */
.pac-frame-call {
  font-family: var(--mono); font-size: 12px; line-height: 1.35;
  white-space: nowrap;
}
.pac-frame-fn { font-weight: 600; color: var(--text); }
.pac-paren, .pac-arg-sep, .pac-arg-eq { color: var(--text-dim); }
/* One parameter: `name = value`. The blue activity fill (role active) wraps the
 * whole token so a changing argument reads the same as a changing cell/node. */
.pac-arg { border-radius: 3px; padding: 0 2px; }
.pac-arg-name { color: var(--text-dim); }
/* A parameter value is an ATOMIC token -- a string, char, or number -- and never
 * wraps: breaking "a)(b" across lines makes it unreadable and the frame taller,
 * the opposite of what the width rules are for. The frame is measured to fit the
 * value's full width. A genuinely long value truncates with an ellipsis instead
 * of driving the whole panel wide -- the cap bounds the natural width the engine
 * measures, so it never collapses narrower. */
.pac-arg-val {
  color: var(--text);
  display: inline-block;
  vertical-align: bottom;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 22ch;
}
.pac-arg[data-role="active"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.pac-arg[data-role="active"] .pac-arg-name { color: var(--text); }
.pac-arg[data-role="done"] { opacity: .45; }

/* Continuation rows -- locals only, below the call line, only when present. */
.pac-frame-locals { display: flex; flex-direction: column; gap: 2px; margin-top: 3px; }
.pac-frame-var {
  display: flex; justify-content: space-between; gap: 14px;
  font-family: var(--mono); font-size: 12px;
  padding: 1px 6px; border-radius: 3px;
  border: 1px solid transparent;
}
.pac-frame-var-name { color: var(--text-dim); white-space: nowrap; }
.pac-frame-var-val {
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 22ch;
  flex-shrink: 0;   /* never collapse below content (only max-width caps it) */
}
.pac-frame-var[data-role="active"] {
  background: var(--accent-soft); border-color: var(--accent);
}
.pac-frame-var[data-role="active"] .pac-frame-var-name { color: var(--text); }
/* A finished local (e.g. loop i after the loop) stays visible but greyed until
 * the function returns -- it does not vanish mid-frame. */
.pac-frame-var[data-role="done"] { opacity: .45; }

/* ---- NODES panel ---- */
/* The node diagram renders at its NATURAL pixel size (width + height set on the
 * SVG). The panel is pinned to that width up to its column budget (Width rules);
 * a diagram wider or taller than the panel is not scaled down or clipped -- the
 * panel body (overflow:auto) SCROLLS both axes and _followActive keeps the active
 * node, or the root at step 0, in view (AUTHORING.md "No panel may exceed the
 * viewport width"). No max-width: scaling a call tree to fit makes it an
 * unreadable smear; scrolling keeps every node full-size and reachable. */
.pac-nodes { display: block; }
.pac-node-box {
  fill: var(--bg); stroke: var(--border); stroke-width: 1;
  transition: fill .15s, stroke .15s;
}
.pac-node[data-state="pending"]  { opacity: .18; }
.pac-node[data-state="entering"] .pac-node-box { stroke: var(--accent); fill: var(--accent-soft); }
.pac-node[data-state="active"]   .pac-node-box { stroke: var(--accent); fill: var(--accent-soft); }
.pac-node[data-state="exited"]   .pac-node-box { stroke: var(--ok); }
/* Unlinked: allocated and held by a pointer but not yet a member of the
 * structure (a doubly linked node whose neighbours don't yet point back). An
 * amber OUTLINE only -- border, no background fill -- so it reads as clearly
 * present yet visibly not settled, and distinct from the dimmed `pending`
 * traversal state. It takes the normal outline once the insertion is complete.
 * See AUTHORING.md "Node membership state". */
.pac-node[data-state="unlinked"] .pac-node-box { stroke: var(--warn); fill: none; stroke-width: 1.5; }
/* Settled member of a structure: green OUTLINE, no fill -- leaving the fill
 * channel free for the activity signal below. Distinct from the tree's
 * `exited`, which shares the green but means "traversal done". */
.pac-node[data-state="member"]   .pac-node-box { stroke: var(--ok); }

/* Activity channel (FILL) -- the second, INDEPENDENT node color channel (see
 * AUTHORING.md "Node color channels"). A truthy `active` on a node means "this
 * node is being modified on THIS step": paint a blue interior, orthogonal to
 * the membership/traversal OUTLINE above. Declared last so it wins the `fill`
 * property on equal specificity -- an amber `unlinked` node (fill:none) or a
 * green `member` therefore also shows a blue activity fill in the same step
 * (amber-outline + blue-fill, or green-outline + blue-fill). */
.pac-node[data-active="true"]    .pac-node-box { fill: var(--accent-soft); }

/* Per-FIELD states on a record node (see panels/nodes.js recordNode). These are
 * declared AFTER the node-level membership strokes above so they override them
 * for a single field, at equal specificity.
 *  - `.pac-field-empty`: INDETERMINATE storage -- a freshly allocated record cell
 *    not yet written (backing value `undefined`, distinct from a nil pointer's
 *    `null`). The dashed dimmed box + a thin X, the SVG analogue of a CELLS
 *    `empty` cell; overrides the node's amber/green membership stroke so an unset
 *    field never reads as a settled member.
 *  - `.pac-field-active`: the blue activity fill on ONE field (a value copied into
 *    a single cell), the field-granular analogue of the node-level activity fill.
 *    Fill only, so the field keeps the node's outline -- both channels at once. */
.pac-node .pac-node-box.pac-field-empty  { stroke: var(--border); stroke-dasharray: 3 2; fill: var(--bg); }
.pac-node .pac-field-x                   { stroke: var(--text-dim); stroke-width: 1; stroke-opacity: .4; fill: none; }
.pac-node .pac-node-box.pac-field-active { fill: var(--accent-soft); }
.pac-node-label { fill: var(--text); font-family: var(--mono); font-size: 12px; text-anchor: middle; }
.pac-node-meta  { fill: var(--text-dim); font-family: var(--mono); font-size: 9.5px; text-anchor: middle; }
.pac-node[data-state="pending"] .pac-node-label { fill: var(--text-dim); }
.pac-edge { stroke: var(--border); stroke-width: 1.2; fill: none; }
.pac-edge[data-state="taken"] { stroke: var(--accent); }

/* ---- GRAPH edges (NODES layout 'graph', see panels/nodes.js renderGraph) ----
 * A straight line between two fixed-position nodes. A normal edge is a neutral
 * member line (--text-dim so it reads clearly on the dark ground, unlike the very
 * faint tree --border); an edge created THIS step takes the blue activity stroke
 * (state 'active') -- the same "being modified now" channel cells and nodes use.
 * A DIRECTED edge carries an arrowhead marker whose fill is context-stroke, so it
 * turns blue with the line on the active step and is neutral otherwise; an
 * UNDIRECTED edge has no marker (the lecture's own distinction). Lines stay
 * straight and may cross -- a graph is not planar in general. */
.pac-graph-edge { stroke: var(--text-dim); stroke-width: 1.6; }
.pac-edge[data-state="active"] { stroke: var(--accent); stroke-width: 2.4; }
/* A graph node at rest: a clearly outlined circle. Scoped to the neutral `idle`
 * state so a future graph that uses the membership channel (green member / amber
 * unlinked) keeps those outlines -- only the default gets the stronger stroke. */
.pac-graph-node[data-state="idle"] .pac-node-box { stroke: var(--text-dim); stroke-width: 1.4; }

/* ---- PEGS panel (see panels/pegs.js, AUTHORING.md "pegs and disks") ----
 * Three pegs with disks/bundles stacked on them. A STRUCTURE panel rendered at a
 * FIXED natural size (the SVG's width/height are constants): the engine measures
 * that once and holds it, and nothing resizes as things move -- only positions
 * change (the master invariant). It never needs to scroll at the design size.
 *
 * The real disk and the bundle share ONE resting treatment -- same fill, same
 * outline, same label styling -- and differ by SHAPE ALONE: one solid bar
 * labelled "disk n" versus several thin tapering lines labelled "n − 1 disks".
 * One difference doing one job cannot be misread; two things differing in colour
 * AND shape would leave the reader guessing which difference carries the meaning.
 * The bundle is deliberately NOT given a colour of its own -- in particular not
 * --warn, which means `unlinked` in a structure panel, and the bundle is a member
 * of the structure it sits on, so it must not wear it. The blue activity fill is
 * the panel's ONLY meaningful colour, applied identically to whichever item -- disk
 * or bundle -- moves THIS step (the same "being modified now" signal cells/nodes/
 * frames use). */
.pac-pegs { display: block; }
.pac-peg-post { fill: var(--border); }
.pac-peg-base { fill: var(--border); }
.pac-peg-name { fill: var(--text); font-family: var(--mono); font-size: 13px; font-weight: 600; text-anchor: middle; }
.pac-peg-role { fill: var(--text-dim); font-family: var(--mono); font-size: 11px; text-anchor: middle; }

/* Resting treatment, shared by the real disk (a solid bar whose WIDTH encodes its
 * size -- the "never a larger disk on a smaller one" rule made visible) and by
 * every bundle line. Identical fill, outline, and label; only the shape differs. */
.pac-disk-box, .pac-bundle-bar {
  fill: var(--panel-header); stroke: var(--text-dim); stroke-width: 1.2;
  transition: fill .15s, stroke .15s;
}
.pac-disk-label, .pac-bundle-label {
  fill: var(--text); font-family: var(--mono); font-size: 11px; text-anchor: middle;
}
/* Activity fill: the one meaningful colour, on whichever item moves this step. */
.pac-disk[data-active="true"] .pac-disk-box,
.pac-bundle[data-active="true"] .pac-bundle-bar {
  fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5;
}

/* ---- CHART panel ----
 * A STRUCTURE panel: it never scrolls, in either axis. The SVG carries a fixed
 * viewBox (chart.js) and is sized to the region the engine gives it; the plot
 * scales with the viewBox to fit. `max-width:100%` lets it shrink on a narrow
 * column (it is pinned to its natural width, so this rarely bites); it never
 * grows past its intrinsic size. The axes and their scale are fixed from step 0
 * -- see chart.js -- so nothing rescales as points appear. */
.pac-chart { display: block; max-width: 100%; height: auto; }
.pac-chart-axis { stroke: var(--border); }
.pac-chart-tick { fill: var(--text-dim); font-size: 9px; font-family: var(--mono); }
.pac-chart-axislabel { fill: var(--text-dim); font-size: 10px; }
.pac-chart-series { fill: none; stroke-width: 1.8; }
.pac-chart-point { stroke: var(--panel); stroke-width: 0.6; }
/* The slider-driven marker: a dashed vertical line at the read-off n, a filled
 * dot on each series, and each series' time called out beside it. Blue (--accent),
 * distinct from the grey axes and the series colours. */
.pac-chart-marker  { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 4 3; }
.pac-chart-dot     { stroke: var(--panel); stroke-width: 0.8; }
.pac-chart-callout { font-family: var(--mono); font-size: 10px; font-weight: 600; }
.pac-chart-name    { font-family: var(--mono); font-size: 10px; font-weight: 600; }

/* ---- SLIDER panel (see panels/slider.js) ----
 * A narrow WATCH-only exception. Present from step 0 at its final size; INERT
 * (dimmed, not interactive) until the trace reaches its last step, then live.
 * Dimming is a whole-panel opacity so the "not yet" reads at a glance without any
 * layout change when it goes live -- the master invariant holds through the
 * transition (nothing resizes, only opacity and the disabled state flip). */
.pac-slider { display: flex; flex-direction: column; gap: 8px; padding: 2px 0; }
.pac-slider[data-live="false"] { opacity: .42; }
.pac-slider-value { font-family: var(--mono); font-size: 14px; color: var(--text); font-weight: 600; }
.pac-slider-input {
  width: 260px; max-width: 100%; cursor: pointer;
  accent-color: var(--accent);   /* the range thumb + filled track in the app blue */
}
.pac-slider[data-live="false"] .pac-slider-input { cursor: not-allowed; }
.pac-slider-scale {
  display: flex; justify-content: space-between; width: 260px; max-width: 100%;
  font-family: var(--mono); font-size: 10.5px; color: var(--text-dim);
}
.pac-slider-hint { font-size: 11px; color: var(--text-dim); }

/* ---- arrow overlay ---- */
.pac-overlay { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.pac-arrow { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.pac-arrow[data-style="stale"] { stroke: var(--error); stroke-dasharray: 4 3; }

/* ---- metrics ---- */
.pac-metrics { display: flex; gap: 16px; font-size: 12px; color: var(--text-dim); }
.pac-metrics b { color: var(--text); font-weight: 600; font-family: var(--mono); }

/* ---- beginner profile: enforced, not advisory ---- */
.pac-root[data-profile="beginner"] .pac-addresses { display: none; }
</style></head>
<body><div id="pac"></div>
<script type="module">
const codePanel = (() => { /* CODE panel — listings with per-language variants.
 *
 * Step data: { line: 7 }  or  { line: {pseudo: 5, java: 7, cpp: 7} }
 *
 * Because each trace addresses its OWN listing's line numbers, the listings
 * never need to stay line-aligned with each other. That constraint would have
 * been unmaintainable across ~64 files and five years. */

function mount(body, spec, ctx, tools) {
  // The tab set is the engine's resolved language set (`?lang=` may have narrowed
  // it -- PLANNED.md "Per-course language selection"); it defaults to every listing
  // key, so a ds page is unaffected. A single entry means one listing resolved, so
  // the tab bar is not rendered at all (rule 2: a lone tab is an affordance that
  // does nothing).
  spec._langs = ctx.engine.langs?.length ? ctx.engine.langs : Object.keys(spec.listings);
  if (spec._langs.length > 1) {
    tools.innerHTML = `<span class="pac-lang-tabs">${spec._langs.map(l =>
      `<button class="pac-lang-tab" data-lang="${l}">${spec.labels?.[l] ?? l}</button>`
    ).join('')}</span>`;
    tools.addEventListener('click', e => {
      const l = e.target.dataset?.lang;
      if (l) ctx.engine.setLanguage(l);
    });
  }
  body.innerHTML = '<div class="pac-code"></div>';
}

function render(body, data, ctx, { lang }) {
  const spec = ctx.spec;
  const use = spec.listings[lang] ? lang : spec._langs[0];

  ctx.engine.root.querySelectorAll('.pac-lang-tab').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.lang === use)));

  const active = (data?.line && typeof data.line === 'object') ? data.line[use] : data?.line;
  // When the code line itself is the memory-integrity culprit, the step sets

  // both members of the pair offset to opposite sides.

    // off^2), which is exactly GR for a centred line. This is angle-independent,
    // so a diagonal edge lands as squarely as a vertical one.
    const d = Math.sqrt(Math.max(0, GR * GR - off * off));

    // undirected line runs right onto the circle.
