<html lang="en"><head><meta charset="utf-8">

<title>lists-array-insert-delete — preview</title>
<style>/* pac-animations — design system
   15 tokens replacing the 188 distinct color values found across the
   original 25 animation files. */

:root {
  /* surfaces */
  --bg:            #0f1117;
  --panel:         #171a23;
  --panel-header:  #1e222d;
  --border:        #2b3040;

  /* text */
  --text:          #d8dce6;
  --text-dim:      #8b93a7;

  /* accents — one blue, not four */
  --accent:        #4a90e2;
  --accent-soft:   rgba(74, 144, 226, 0.18);

  /* semantic state */
  --ok:            #4caf82;
  --warn:          #e0a33a;
  --error:         #e2564a;
  --highlight:     #d4a13c;

  /* structural */
  --radius:        6px;
  --gap:           14px;
  --mono:          "SF Mono", "Cascadia Code", Consolas, monospace;

  /* ---- stable layout (see AUTHORING.md "Stable layout") ----
   * The stage (panel grid) is BOUNDED: it never grows past --stage-max-h no
   * matter how much content a panel holds. Panels scroll internally within
   * their grid cell; the controls, narration bar, and note box are pinned
   * below the stage and stay on screen at any viewport height.
   *
   * The bound is derived, not hardcoded to a resolution: start from "~15 code
   * lines visible" and the current 2-row grid, and tune these values. The code
   * panel occupies one grid row, so making a row tall enough for ~15 code lines
   * fixes the whole stage height. All values below are tunable.
   * Design target: a 1920x1080 window at 100%. */
  --code-line-h:   20.6px;   /* code font-size 12.5px x line-height 1.65 */
  --code-lines:    15;       /* code lines visible before the panel scrolls */
  --panel-chrome:  54px;     /* a panel's header + body padding (non-content) */
  --stage-rows:    2;        /* grid rows in the current animations (2x2) */
  --stage-row-h:   calc(var(--code-lines) * var(--code-line-h) + var(--panel-chrome));
  --stage-max-h:   calc(var(--stage-rows) * var(--stage-row-h) + (var(--stage-rows) - 1) * var(--gap));
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* The whole animation is a full-viewport flex column: the stage flexes to fill
 * the space that is left after the pinned chrome (title, controls, narration,
 * note), and the stage — never the page — is what shrinks on a short viewport.
 * This is the safety net that keeps the note on screen at any viewport height. */
.pac-root {
  padding: var(--gap);
  max-width: 1200px;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow: hidden;            /* the page itself never scrolls; panels do */
}
/* Everything except the stage keeps its natural height and is always visible;
 * only the stage (below) flexes and yields space on a short viewport. */
.pac-root > *:not(.pac-stage) { flex: 0 0 auto; }

.pac-title { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
.pac-sub   { color: var(--text-dim); font-size: 13px; margin: 0 0 var(--gap); }

/* ---- layout: the bounded stage ----
 * A grid of panels, bounded to --stage-max-h so it never grows the page. It
 * flexes to fill the space above the pinned chrome but is capped at the bound,
 * and its rows share the height equally (minmax(0,1fr) lets them shrink so each
 * panel scrolls internally instead of overflowing). See AUTHORING.md. */
.pac-stage {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  grid-auto-rows: minmax(0, 1fr);
  gap: var(--gap);
  position: relative;          /* anchor origin for the arrow overlay */
  flex: 1 1 auto;
  min-height: 0;               /* allow the grid to shrink below content size */
  max-height: var(--stage-max-h);
  overflow: hidden;            /* the bound is hard; panels scroll, not the stage */
}
.pac-stage[data-cols="1"] { grid-template-columns: 1fr; }
.pac-stage[data-cols="2"] { grid-template-columns: 1fr 1fr; }

/* A panel that holds very little (e.g. a two-value count/capacity strip) opts
 * out of stretching to fill its tall grid cell: it top-aligns and sizes to its
 * content, so it reads as a compact strip rather than a tall box with a void.
 * See AUTHORING.md "Panels fill their grid cells; don't oversize a cell". */
.pac-panel[data-compact] { align-self: start; max-height: 100%; }

/* ---- panel chrome ---- */
.pac-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.pac-panel-head {
  background: var(--panel-header);
  padding: 7px 11px;
  font-size: 12px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.pac-panel-body { padding: 11px; overflow: auto; flex: 1; min-height: 0; }

/* ---- controls ---- */
.pac-controls {
  display: flex; gap: 8px; align-items: center;
  margin: var(--gap) 0; flex-wrap: wrap;
}
.pac-btn {
  background: var(--panel-header);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 14px;
  font-size: 13px;
  cursor: pointer;
}
.pac-btn:hover:not(:disabled) { border-color: var(--accent); }
.pac-btn:disabled { opacity: .38; cursor: default; }
.pac-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.pac-progress { color: var(--text-dim); font-size: 12px; margin-left: auto; }

.pac-narrate {
  background: var(--accent-soft);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px 14px 12px 16px;
  margin-top: var(--gap);
  min-height: 42px;
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
}
/* A brief in-scheme pulse when the step changes, so a new explanation
 * actively pulls the eye instead of being missed. Retriggered per step
 * by the engine (see render()). */
@keyframes pac-narrate-flash {
  0%   { background: var(--accent-soft); box-shadow: 0 0 0 0 rgba(74, 144, 226, 0); }
  18%  { background: rgba(74, 144, 226, 0.34); box-shadow: 0 0 0 3px var(--accent-soft); }
  100% { background: var(--accent-soft); box-shadow: 0 0 0 0 rgba(74, 144, 226, 0); }
}
.pac-narrate-flash { animation: pac-narrate-flash 0.55s ease-out; }

/* ---- teaching-note box ----
 * Non-execution commentary (setup, common-mistake asides, post-watch
 * challenge). A note attaches to a step and shows only while that step is
 * current; on steps without one the box collapses to nothing (below) so the
 * layout reflows. Amber-keyed so it reads as an aside, distinct from the blue
 * narration bar. See AUTHORING.md "Steps vs. notes". */
.pac-note {
  background: rgba(212, 161, 60, 0.10);
  border: 1px solid var(--border);
  border-left: 4px solid var(--highlight);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-top: 8px;
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.55;
}
.pac-note::before {
  content: "note";
  display: block;
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--highlight);
  margin-bottom: 3px;
}
/* Collapsed: takes no space at all on steps that carry no note. */
.pac-note-empty { display: none; }
@keyframes pac-note-flash {
  0%   { background: rgba(212, 161, 60, 0.10); box-shadow: 0 0 0 0 rgba(212, 161, 60, 0); }
  18%  { background: rgba(212, 161, 60, 0.26); box-shadow: 0 0 0 3px rgba(212, 161, 60, 0.16); }
  100% { background: rgba(212, 161, 60, 0.10); box-shadow: 0 0 0 0 rgba(212, 161, 60, 0); }
}
.pac-note-flash { animation: pac-note-flash 0.55s ease-out; }

/* ---- memory-danger marker ----
 * A red warning triangle (⚠) + --error on any narration or note segment that
 * names a memory-integrity violation. Project-wide, cross-course convention.
 * See AUTHORING.md "Memory-danger marker". */
.pac-danger { color: var(--error); font-weight: 600; }

/* ---- CODE panel ---- */
.pac-lang-tabs { display: flex; gap: 4px; }
.pac-lang-tab {
  background: none; border: 1px solid transparent; color: var(--text-dim);
  font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
}
.pac-lang-tab[aria-selected="true"] {
  color: var(--text); border-color: var(--border); background: var(--panel);
}
.pac-code { font-family: var(--mono); font-size: 12.5px; line-height: 1.65; }
.pac-code-line { display: flex; padding: 0 4px; border-radius: 3px; white-space: pre; }
.pac-code-line.is-active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.pac-code-line.is-active.is-danger { background: rgba(226, 86, 74, 0.16); box-shadow: inset 2px 0 0 var(--error); color: var(--error); }
/* Parked caller line: the call site of a caller still on the stack, suspended
 * while the callee runs. The same highlight as the active line, greyed with the
 * SAME opacity token the CALLSTACK uses for its inactive (caller) frames -- not a
 * new colour. One visual language across both panels: bright = running now, dim
 * = suspended, waiting to resume. See AUTHORING.md "Line highlight — active line
 * vs. parked caller lines". */
.pac-code-line.is-parked { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); opacity: .5; }
.pac-code-num { color: var(--text-dim); width: 2.2em; text-align: right; margin-right: 12px; user-select: none; }

/* ---- STREAM panel ---- */
/* Stable layout: the STREAM panel accumulates output as steps advance. The
 * bounded stage gives it a fixed grid cell, so it scrolls internally (stream.js
 * auto-scrolls to the newest line at the bottom) rather than growing the page
 * and pushing the controls/narration/note down. The default panel body already
 * does flex:1 + overflow:auto; nothing extra is needed. See AUTHORING.md
 * "Stable layout". Any other accumulating panel type gets the same treatment. */
.pac-stream { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; }
.pac-stream-line { white-space: pre; }
.pac-stream-line.dir-in   { color: var(--warn); }
.pac-stream-line.dir-out  { color: var(--text); }
.pac-stream-line.is-new   { background: var(--accent-soft); border-radius: 3px; }
.pac-stream-cursor { color: var(--accent); animation: pac-blink 1s steps(2) infinite; }
@keyframes pac-blink { 50% { opacity: 0; } }

/* ---- CELLS panel ---- */
.pac-cells { display: flex; flex-wrap: wrap; gap: 6px; }
.pac-cells[data-render="row"] { flex-direction: column; gap: 3px; }
.pac-cell {
  border: 1px solid var(--border); border-radius: 4px;
  padding: 5px 9px; font-family: var(--mono); font-size: 12.5px;
  min-width: 40px; text-align: center; background: var(--bg);
}
.pac-cell-label { display: block; font-size: 10px; color: var(--text-dim); }
.pac-cell[data-role="active"]   { border-color: var(--accent); background: var(--accent-soft); }
.pac-cell[data-role="compared"] { border-color: var(--highlight); }
.pac-cell[data-role="ok"]       { border-color: var(--ok); }
.pac-cell[data-role="error"]    { border-color: var(--error); color: var(--error); }
.pac-cell[data-role="empty"]    { opacity: .35; }

.pac-cells[data-render="row"] .pac-cell {
  display: flex; justify-content: space-between; text-align: left; min-width: 0;
}
.pac-cells[data-render="row"] .pac-cell-label { display: inline; }

/* ---- CALLSTACK panel ----
 * A debugger's locals/stack pane. Frames push on call / pop on return; the top
 * (running) frame is emphasized and rendered first (newest on top), callers
 * below are greyed but present, and `main` is the last (bottom) frame. Stable
 * layout: the bounded stage gives the pane a fixed grid cell, so frames
 * top-align within it and the pane scrolls internally if the stack ever grows
 * past the cell -- the running frame stays visible at the top and nothing below
 * the stage shifts. See AUTHORING.md "CALLSTACK panel" and "Stable layout". */
.pac-callstack {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;    /* frames top-align; no empty void above them */
  gap: 6px;
}
.pac-frame {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  padding: 6px 9px;
  opacity: .5;                    /* caller frames are greyed but present */
  transition: opacity .15s, border-color .15s;
}
/* The running (top) frame: full opacity + a blue outline, so "where are we
 * executing" reads at a glance and matches the highlighted code line. */
.pac-frame[data-active="true"] {
  opacity: 1;
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent-soft);
}
.pac-frame-fn {
  font-family: var(--mono); font-size: 12.5px; font-weight: 600;
  color: var(--text); margin-bottom: 5px;
}
.pac-frame-vars { display: flex; flex-direction: column; gap: 3px; }
.pac-frame-var {
  display: flex; justify-content: space-between; gap: 14px;
  font-family: var(--mono); font-size: 12px;
  padding: 2px 6px; border-radius: 3px;
  border: 1px solid transparent;
}
.pac-frame-var-name { color: var(--text-dim); }
.pac-frame-var-val  { color: var(--text); }
/* Activity channel (FILL) -- a local changing THIS step gets the blue fill, the
 * same rule as nodes/cells. */
.pac-frame-var[data-role="active"] {
  background: var(--accent-soft); border-color: var(--accent);
}
.pac-frame-var[data-role="active"] .pac-frame-var-name { color: var(--text); }
/* A finished local (e.g. loop i after the loop) stays visible but greyed until
 * the function returns -- it does not vanish mid-frame. */
.pac-frame-var[data-role="done"] { opacity: .45; }
.pac-frame-empty { color: var(--text-dim); font-family: var(--mono); font-size: 11.5px; opacity: .6; }

/* ---- NODES panel ---- */
.pac-nodes { width: 100%; display: block; }
.pac-node-box {
  fill: var(--bg); stroke: var(--border); stroke-width: 1;
  transition: fill .15s, stroke .15s;
}
.pac-node[data-state="pending"]  { opacity: .18; }
.pac-node[data-state="entering"] .pac-node-box { stroke: var(--accent); fill: var(--accent-soft); }
.pac-node[data-state="active"]   .pac-node-box { stroke: var(--accent); fill: var(--accent-soft); }
.pac-node[data-state="exited"]   .pac-node-box { stroke: var(--ok); }
/* Unlinked: allocated and held by a pointer but not yet a member of the
 * structure (a doubly linked node whose neighbours don't yet point back). An
 * amber OUTLINE only -- border, no background fill -- so it reads as clearly
 * present yet visibly not settled, and distinct from the dimmed `pending`
 * traversal state. It takes the normal outline once the insertion is complete.
 * See AUTHORING.md "Node membership state". */
.pac-node[data-state="unlinked"] .pac-node-box { stroke: var(--warn); fill: none; stroke-width: 1.5; }
/* Settled member of a structure: green OUTLINE, no fill -- leaving the fill
 * channel free for the activity signal below. Distinct from the tree's
 * `exited`, which shares the green but means "traversal done". */
.pac-node[data-state="member"]   .pac-node-box { stroke: var(--ok); }

/* Activity channel (FILL) -- the second, INDEPENDENT node color channel (see
 * AUTHORING.md "Node color channels"). A truthy `active` on a node means "this
 * node is being modified on THIS step": paint a blue interior, orthogonal to
 * the membership/traversal OUTLINE above. Declared last so it wins the `fill`
 * property on equal specificity -- an amber `unlinked` node (fill:none) or a
 * green `member` therefore also shows a blue activity fill in the same step
 * (amber-outline + blue-fill, or green-outline + blue-fill). */
.pac-node[data-active="true"]    .pac-node-box { fill: var(--accent-soft); }
.pac-node-label { fill: var(--text); font-family: var(--mono); font-size: 12px; text-anchor: middle; }
.pac-node-meta  { fill: var(--text-dim); font-family: var(--mono); font-size: 9.5px; text-anchor: middle; }
.pac-node[data-state="pending"] .pac-node-label { fill: var(--text-dim); }
.pac-edge { stroke: var(--border); stroke-width: 1.2; fill: none; }
.pac-edge[data-state="taken"] { stroke: var(--accent); }

/* ---- CHART panel ---- */
.pac-chart-axis { stroke: var(--border); }
.pac-chart-tick { fill: var(--text-dim); font-size: 9px; }
.pac-chart-series { fill: none; stroke-width: 1.8; }

/* ---- arrow overlay ---- */
.pac-overlay { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.pac-arrow { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.pac-arrow[data-style="stale"] { stroke: var(--error); stroke-dasharray: 4 3; }

/* ---- metrics ---- */
.pac-metrics { display: flex; gap: 16px; font-size: 12px; color: var(--text-dim); }
.pac-metrics b { color: var(--text); font-weight: 600; font-family: var(--mono); }

/* ---- beginner profile: enforced, not advisory ---- */
.pac-root[data-profile="beginner"] .pac-addresses { display: none; }
</style></head>
<body><div id="pac"></div>
<script type="module">
const codePanel = (() => { /* CODE panel — listings with per-language variants.
 *
 * Step data: { line: 7 }  or  { line: {pseudo: 5, java: 7, cpp: 7} }
 *
 * Because each trace addresses its OWN listing's line numbers, the listings
 * never need to stay line-aligned with each other. That constraint would have
 * been unmaintainable across ~64 files and five years. */

function mount(body, spec, ctx, tools) {
  spec._langs = Object.keys(spec.listings);
  if (spec._langs.length > 1) {
    tools.innerHTML = `<span class="pac-lang-tabs">${spec._langs.map(l =>
      `<button class="pac-lang-tab" data-lang="${l}">${spec.labels?.[l] ?? l}</button>`
    ).join('')}</span>`;
    tools.addEventListener('click', e => {
      const l = e.target.dataset?.lang;
      if (l) ctx.engine.setLanguage(l);
    });
  }
  body.innerHTML = '<div class="pac-code"></div>';
}

function render(body, data, ctx, { lang }) {
  const spec = ctx.spec;
  const use = spec.listings[lang] ? lang : spec._langs[0];

  ctx.engine.root.querySelectorAll('.pac-lang-tab').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.lang === use)));

  const active = (data?.line && typeof data.line === 'object') ? data.line[use] : data?.line;
  // When the code line itself is the memory-integrity culprit, the step sets
  // `dangerLine: true` and the active line is tinted red instead of blue.
  const danger = !!data?.dangerLine;
  // Parked caller lines: the call site of every caller still on the stack, shown
  // DIMMED so the student keeps sight of where the call came from and where it
  // returns (AUTHORING.md "Line highlight — active line vs. parked caller lines").
  // Each entry is a plain number or a per-language {pseudo,java,cpp} object;
  // resolve to THIS language. The active line always wins if they coincide
  // (bright beats dim), so drop it from the parked set.
  const parked = new Set((data?.parked ?? [])
    .map(p => (p && typeof p === 'object') ? p[use] : p)
    .filter(n => n != null && n !== active));

  body.querySelector('.pac-code').innerHTML = spec.listings[use].map((src, k) => {
    const n = k + 1;
    const cls = n === active ? (danger ? ' is-active is-danger' : ' is-active')
              : parked.has(n) ? ' is-parked' : '';
    return `<div class="pac-code-line${cls}">` +
           `<span class="pac-code-num">${n}</span><span>${esc(src)}</span></div>`;
  }).join('');

  // Stable layout: the CODE panel shows ~12–15 lines and scrolls internally, so
  // the active line must be scrolled into view as it moves (a jump into a
  // function body far down the listing would otherwise sit off-screen). Scroll
  // only THIS panel body (the overflow:auto container), never the page — centre
  // the active line in the visible area. See AUTHORING.md "Stable layout".
  const activeEl = body.querySelector('.pac-code-line.is-active');
  if (activeEl) {
    const bodyRect = body.getBoundingClientRect();
    const lineRect = activeEl.getBoundingClientRect();
    const delta = (lineRect.top - bodyRect.top) - (body.clientHeight - lineRect.height) / 2;
    body.scrollTop += delta;
  }
}

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

 return { mount, render }; })();
const cellsPanel = (() => { /* CELLS panel — 1D/2D grid. Absorbs arrays, sorting bars, hash buckets,
 * matrices, memory blocks, variable tables, stack frames, vtables.
 * Step data: { render: 'box'|'bar'|'row', cells: [{value,label,role,anchor}] } */

function mount(body) { body.innerHTML = '<div class="pac-cells"></div>'; }

function render(body, data, ctx) {
  const wrap = body.querySelector('.pac-cells');
  const mode = data?.render ?? 'box';
  wrap.dataset.render = mode;
  wrap.innerHTML = '';
  const max = Math.max(1, ...(data?.cells ?? []).map(c => +c.value || 0));

  for (const c of data?.cells ?? []) {
    const el = document.createElement('div');
    el.className = 'pac-cell';
    if (c.role) el.dataset.role = c.role;
    if (mode === 'bar') el.style.height = `${20 + 70 * (+c.value / max)}px`;
    el.innerHTML = (c.label ? `<span class="pac-cell-label">${esc(c.label)}</span>` : '') +
                   `<span class="pac-cell-value">${esc(c.value)}</span>`;
    wrap.appendChild(el);
    // Anchor the value glyph, not the whole cell: for a pointer variable that
    // value is the dot, so a cross-panel arrow starts from the dot itself --
    // matching the record-field pointers in the NODES panel.
    if (c.anchor) ctx.anchor(`${ctx.spec.id}.${c.anchor}`, el.querySelector('.pac-cell-value'));
  }
}

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

 return { mount, render }; })();
const nodesPanel = (() => { /* NODES panel — nodes with typed edges.
 *
 * One renderer for: linked lists, doubly linked lists, BSTs, heaps-as-trees,
 * recursion call trees, class hierarchies, object graphs, GC reachability,
 * UML diagrams, flowcharts, adjacency lists. They differ in node template,
 * edge template, and layout -- and in nothing else.
 *
 * Step data:
 *   { layout:   'tree' | 'linear' | 'graph',
 *     template: 'plain' | 'record',
 *     nodes: [{id, parent, label, meta[], state, active, fields[], slot, row}],
 *     edges: [{from, to, state}] }       // implied by `parent` for trees
 *
 * Two INDEPENDENT color channels (AUTHORING.md "Node color channels"):
 *   - `state`  -> the OUTLINE (membership/traversal): green member, amber
 *                 `unlinked`, dim `pending`, blue traversal frontier.
 *   - `active` -> the FILL (activity): a truthy `active` flags "this node is
 *                 being modified on THIS step" and paints a blue interior,
 *                 orthogonal to `state`. An unlinked node can be amber-outline
 *                 + blue-fill at once; a settled member, green-outline +
 *                 blue-fill. Fill never changes the outline, and vice versa.
 *
 * Snapshots include not-yet-visited nodes as state 'pending', so layout is
 * computed over the whole structure and nodes never jump between steps.
 *
 * For `record` nodes, every field publishes its own anchor:
 *     list.n25.prev   list.n25.next   list.n25
 * which is what lets the arrow overlay draw pointer links as DATA. */

const NW = 74, HGAP = 16, VGAP = 62, PAD = 20;
const RW = 112, RH = 38, RGAP = 46, RROW = 84;   // record geometry

        <button class="pac-btn pac-btn-primary" data-act="next">Next Step &rarr;</button>
        <button class="pac-btn" data-act="play">Play</button>
        <button class="pac-btn" data-act="reset">Reset</button>
        <span class="pac-metrics"></span>
        <span class="pac-progress"></span>
      </div>
      <div class="pac-narrate"></div>
      <div class="pac-note pac-note-empty" role="note"></div>`;

    this.root.querySelector('.pac-title').textContent = s.title ?? '';
    this.root.querySelector('.pac-sub').textContent = s.subtitle ?? '';
    this.stage    = this.root.querySelector('.pac-stage');
    this.narrate  = this.root.querySelector('.pac-narrate');
    this.noteBox  = this.root.querySelector('.pac-note');
    this.metricsEl= this.root.querySelector('.pac-metrics');
    this.progress = this.root.querySelector('.pac-progress');

    if (s.columns) this.stage.dataset.cols = s.columns;

    // Beginner profile is enforced here, not left to authorial restraint.
    const panels = (s.panels ?? []).slice();
    if (s.profile === 'beginner' && panels.length > 3) {
      console.warn(`beginner profile caps panels at 3; dropping ${panels.length - 3}`);
      panels.length = 3;
    }

    for (const p of panels) {
      const el = document.createElement('section');
      el.className = 'pac-panel';
      el.dataset.type = p.type;          // lets CSS give accumulating panels (STREAM) a stable, scrolling cell
      // A panel holding very little content (a two-value count/capacity strip)
      // opts out of stretching to fill its tall grid cell: `compact: true` makes
      // it top-align and size to content. See AUTHORING.md "Stable layout".
      if (p.compact) el.dataset.compact = '';
      el.innerHTML = `<div class="pac-panel-head"><span>${p.title ?? p.type}</span>
                        <span class="pac-panel-tools"></span></div>
                      <div class="pac-panel-body"></div>`;
      this.stage.appendChild(el);
      const r = RENDERERS[p.type];
      if (!r) throw new Error(`unknown panel type "${p.type}"`);
      const ctx = {
        engine: this,
        spec: p,
        anchors: new Map(),
        anchor: (name, node) => ctx.anchors.set(name, node),
      };
      r.mount?.(el.querySelector('.pac-panel-body'), p, ctx,
                el.querySelector('.pac-panel-tools'));
      this.panels.set(p.id ?? p.type, { spec: p, el, renderer: r, ctx });
    }

    this.overlay = new Overlay(this.stage);

    this.root.querySelector('.pac-controls').addEventListener('click', e => {
      const act = e.target.dataset?.act;
      if (!act) return;
      if (act === 'play') this.timer ? this.stop() : this.play();
      else this[act]();
    });

    // Back-stepping via keyboard, because beginners miss steps.
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') this.next();
      if (e.key === 'ArrowLeft')  this.prev();
    });
  }

  setLanguage(lang) { this.lang = lang; this.render(); }

  /* ---------- render ---------- */

  render() {
    const step = this.step;

    for (const [id, p] of this.panels) {
      let data = step.panels?.[id];
      // A step carries its active source line at the TOP level (`step.line`),
      // not inside `panels.<codeId>` -- one line drives every code panel and
      // every language variant. Thread it in so the highlight actually moves.
      // Supports a plain number or a per-language {pseudo, java, cpp} object;
      // a null/absent line means "highlight nothing" (intro, note, final).
      // `dangerLine` rides alongside: when set, the highlighted line is tinted
      // red instead of blue -- the code itself is the memory-integrity culprit.
      // `parked` also rides alongside: the call-site line of every caller still
      // on the stack, dimmed so the student keeps sight of where the call came
      // from (AUTHORING.md "Line highlight -- active line vs. parked caller
      // lines"). Bright = running now, dim = suspended.
      if (p.spec.type === 'code') data = { ...data, line: step.line, dangerLine: step.dangerLine, parked: step.parked };
      p.ctx.anchors.clear();
      p.renderer.render(p.el.querySelector('.pac-panel-body'),
                        data, p.ctx, { lang: this.lang, step });
    }

    this.overlay.draw(step.arrows ?? [], this.panels);

    // Narration and notes are both SEGMENTED content: a plain string, or an
    // array of segments where {danger:true, text} renders a leading red warning
    // triangle in --error. renderSegments handles both and returns whether any
    // content was written.
    renderSegments(this.narrate, step.narrate);

    // The teaching-note box holds non-execution commentary (setup, a common-
    // mistake aside, a post-watch challenge). A note attaches to a step and
    // shows only while that step is current; on steps without one the box
    // collapses to zero height (pac-note-empty -> display:none) and the layout
    // reflows. See AUTHORING.md "Steps vs. notes".
    const hasNote = renderSegments(this.noteBox, step.note);
    this.noteBox.classList.toggle('pac-note-empty', !hasNote);

    // Pulse narration (and a present note) only when the step index actually
    // changes, so a new explanation catches the eye but pausing/stopping in
    // place does not reflash. A note appearing should feel like the animation
    // saying "pay attention to this."
    if (this.i !== this._flashedAt) {
      this._flashedAt = this.i;
      flash(this.narrate, 'pac-narrate-flash');
      if (hasNote) flash(this.noteBox, 'pac-note-flash');
    }
    this.progress.textContent = `${Math.min(this.i + 1, this.steps.length)} / ${this.steps.length}`;

    // Metrics are HIDDEN BY DEFAULT (see AUTHORING.md "Metrics readout").
    // The tag-derived counter is an internal mechanism; the raw tag name
    // (`assign`) is engine jargon, not student-facing. An animation opts in
    // via `spec.metrics`, a map from tag -> plain student-facing label. Only
    // listed tags render, and always with the label, never the raw tag. No
    // opt-in -> no readout (an insertion or single walk-through shows none).
    const labels = this.spec.metrics ?? {};
    const counts = this.metrics();
    this.metricsEl.innerHTML = Object.entries(labels)
      .filter(([tag]) => counts[tag] != null)
      .map(([tag, label]) => `${label} <b>${counts[tag]}</b>`).join('');

    this.root.querySelector('[data-act="prev"]').disabled = this.i === 0;
    this.root.querySelector('[data-act="next"]').disabled = this.atEnd;
    this.root.querySelector('[data-act="play"]').textContent = this.timer ? 'Pause' : 'Play';
    this.root.querySelector('[data-act="play"]').disabled = this.atEnd;
  }
}

function take(gen, max) {
  const out = [];
  for (const v of gen) { out.push(v); if (out.length >= max) break; }
  return out;
}

/** Restart a one-shot CSS pulse: drop the class, force reflow, re-add. */
function flash(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;               // force reflow so the animation restarts
  el.classList.add(cls);
}

/* The red warning triangle for a memory-integrity violation. Project-wide,
 * cross-course convention -- red ⚠ always means "memory just went wrong". */
const DANGER_MARK = '⚠';

/**
 * Render segmented content (narration or a note) into `el`.
 *
 * `content` is either a plain string (the common case -- nearly every step),
 * or an array of segments. A segment is a string, or an object; an object with
 * `danger: true` renders a leading red ⚠ and the danger-red colour (--error),
 * naming a memory-integrity violation. Returns true iff anything was written,
 * so the caller can collapse an empty note box.
 */
function renderSegments(el, content) {
  el.textContent = '';
  if (content == null || content === '') return false;
  const segs = Array.isArray(content) ? content : [content];
  let wrote = false;
  for (const seg of segs) {
    if (seg == null || seg === '') continue;
    if (typeof seg === 'string') {
      el.appendChild(document.createTextNode(seg));
      wrote = true;
    } else if (seg.danger) {
      const span = document.createElement('span');
      span.className = 'pac-danger';
      span.textContent = `${DANGER_MARK} ${seg.text ?? ''}`;
      el.appendChild(span);
      wrote = true;
    } else if (typeof seg.text === 'string') {
      el.appendChild(document.createTextNode(seg.text));
      wrote = true;
    }
  }
  return wrote;
}

/** Mount an animation from its content module. */
function mountAnimation(spec, el = document.getElementById('pac')) {
  return new Engine(el, spec);
}

/* ds — A1 "Array-based list operations"
 *
 * The whole lesson is ONE invariant: contiguity. An array-based list packs its
 * elements from index 0 with no holes; `count` says how many are in use, and the
 * backing array has a fixed capacity MAX. Every operation must leave the list
 * contiguous, and that requirement is what makes the operations cost what they
 * cost.
 *
 * A `main` driver calls the operations in sequence — ADD(40); INSERT(1, 25);
 * INSERT(7, 99) [the invalid one]; DELETE(1); badINSERT(1, 25) [the buggy one] —
 * so every call has a visible origin. The CALLSTACK panel is a debugger's
 * locals/stack pane: frames push on call (newest on top, showing their BOUND
 * parameter values) and pop on return (the caller below is greyed but present).
 * This makes the ADD-is-INSERT lesson visible: ADD(40) calls INSERT(count,
 * value), and INSERT's frame appears already showing index = 3 (count's value)
 * and value = 40 — the parameters you could previously only infer from narration.
 *
 * Operations, in the instructor's framing:
 *   - ADD(value)          == INSERT(count, value)   -- append; no shift needed
 *   - INSERT(index, value) -- make room by shifting the tail RIGHT, then write
 *   - INSERT at a bad index -- range check fails; the write would leave holes
 *   - DELETE(index)        -- shift the tail LEFT to close the gap
 *   - badINSERT(index, value) -- the SAME insert, written with the shift going
 *     the WRONG way (front-first): it corrupts the data, and shows why the
 *     correct INSERT shifts from the far end first.
 *
 * A mid-run note bridges to linked lists: the shift cost -- up to n moves for a
 * middle insert/delete -- is the price paid for the array's simplicity, and it
 * is why linked lists exist.
 *
 * The closing section is a confusion-first demonstration (AUTHORING.md
 * "Pedagogical pattern — name the student's confusion first"): a note first
 * NAMES the nagging question — "why move the outermost item first? it seems
 * backwards" — then badINSERT runs the intuitive-but-wrong inside-out shift and
 * the student watches one value smear across the tail (each A[i+1] = A[i] reads a
 * cell the previous iteration already clobbered). A payoff note answers the
 * opening question. Because that IS data corruption (overwrite), every smear
 * step carries the red memory-danger ⚠ (AUTHORING.md "Memory-danger marker").
 *
 * WATCH only: one trace, no gates, no predict steps. Common mistakes (writing
 * before making room; inserting out of range; shifting the wrong way) are taught
 * with NARRATION and NOTES on normal steps, never a question. No arrows, no
 * STREAM, no metrics.
 *
 * The correct INSERT/DELETE section has no memory-integrity violation (an
 * out-of-range index is a logic/contract error, not corruption); only the buggy
 * badINSERT corrupts data, and only its smear steps carry the ⚠. Argument→
 * parameter flow animation and pass-by-value/reference are deferred (AUTHORING.md
 * "CALLSTACK panel"); this only shows frames appearing with bound values. */

const MAX = 5;

/* Semantic line keys -> per-language line numbers. */
const L = {

const EMPTY = '·';   // middot: a slot that exists but holds no element

/* ---- call-frame builders (immutable: a fresh frame each step, never mutated
 * in place, so earlier snapshots stay intact) ----
 * `call` is the call-site line this frame is PARKED at while a callee runs — the
 * line the code panel dims (AUTHORING.md "Line highlight — active line vs. parked
 * caller lines"). It is set only on frames acting as callers; the running (top)
 * frame's `call` is ignored, since its executing line is the bright active one. */
const vv    = (name, value, role) => (role ? { name, value, role } : { name, value });
const iVar  = (value, role) => ({ name: 'i', value, role });   // role: 'active' | 'done'
const mainF = (call)             => ({ fn: 'main',   vars: [], call });
const addF  = (value, call)      => ({ fn: 'ADD',    vars: [vv('value', value)], call });
const insF  = (index, value, i)  => ({ fn: 'INSERT', vars: [vv('index', index), vv('value', value), ...(i ? [i] : [])] });
const delF  = (index, i)         => ({ fn: 'DELETE', vars: [vv('index', index), ...(i ? [i] : [])] });
const badF  = (index, value, i)  => ({ fn: 'badINSERT', vars: [vv('index', index), vv('value', value), ...(i ? [i] : [])] });

/* One snapshot. The array is a fixed row of MAX indexed boxes; occupied cells
 * show their value, trailing free cells are dimmed (role 'empty') so capacity vs
 * count stays visible. The single cell modified THIS step gets role 'active' --
 * the blue activity fill (cells are always members here, so blue fill is the only
 * per-step signal). `phantom` appends the would-be holes / attempted write for
 * the invalid-index step, drawn in the error role beyond the real array. `frames`
 * is the call stack, bottom-to-top; the top (last) frame is the running one, and
 * every frame below it is a caller — its `call` line is dimmed in the code panel
 * as a parked caller line, mirroring the greyed CALLSTACK frames exactly. */
function snap({ line, tag, narrate, note, arr, count, active = null, countActive = false, phantom = null, frames }) {
  const cells = [];
  for (let i = 0; i < MAX; i++) {
    const val = arr[i];
    const empty = val == null;
    let role;
    if (i === active) role = 'active';          // blue fill: modified this step
    else if (empty)   role = 'empty';           // dimmed: free trailing slot
    cells.push({ label: String(i), value: empty ? EMPTY : val, role });
  }
  if (phantom) for (const p of phantom) cells.push(p);

  // Parked caller lines = the call site of every frame BELOW the running (top)
  // one. Dimmed in the code panel; the whole caller chain at once.
  const parked = frames.slice(0, -1).map(f => f.call).filter(Boolean);

  return {
    tag, narrate, line, note, parked,
    panels: {
      cells: { render: 'box', cells },
      size: {
        render: 'row',
        cells: [
          { label: 'count', value: count, role: countActive ? 'active' : undefined },
          { label: 'MAX',   value: MAX },
        ],
      },
      stack: {
        frames: frames.map((f, idx) => ({ fn: f.fn, vars: f.vars, active: idx === frames.length - 1 })),
      },
    },
  };
}

/* ---- teaching notes (AUTHORING.md "Steps vs. notes"): each attaches to one
 * step and shows only there. None describe memory corruption, so none is a
 * danger segment. ---- */
const SETUP =
  'This is an array-based list. A fixed-capacity array (MAX = 5) holds the elements, and count ' +
  'tracks how many are in use. The elements must stay contiguous — packed from index 0 with ' +
  'no holes. main calls the four operations in turn; watch the call stack at right.';

const ADD_NOTE =
  'ADD is just INSERT at the end — nothing follows it, so no shifting is needed. Notice INSERT’s ' +
  'frame binds index to count’s value (3), so ADD lands the new element at the first free slot.';

const MAKE_ROOM_NOTE =
  'Make room before writing, or you overwrite. And update the count.';

const INVALID_NOTE =
  'A list must stay contiguous, so you may insert only at an index from 0 to count — here 0 to 5. ' +
  'Index 7 is out of range: writing there would leave indices 5 and 6 empty, breaking contiguity.';

const DELETE_NOTE =
  'Delete leaves a hole — close it by shifting left so the list stays contiguous.';

const PAYOFF_NOTE =
  'Inserting or deleting in the middle of an array-based list costs shifting everything after it ' +
  '— up to n moves. That shift cost is the price we pay for the array’s simplicity, and it ' +
  'is exactly why linked lists — the next topic — exist.';

/* Confusion-first pattern (AUTHORING.md "Pedagogical pattern — name the
 * student's confusion first"): name the nagging question BEFORE showing the
 * intuitive-but-wrong version fail. */
const CONFUSION_NOTE =
  'Have you wondered why we make room by first moving the outermost item? It seems backwards. ' +
  'Watch what happens if we start from the inside instead.';

/* The payoff note that answers CONFUSION_NOTE using what the student just
 * watched smear across the tail. */
const BAD_PAYOFF_NOTE =
  'That is why we shift from the far end first — each value is copied before the next step ' +
  'overwrites it. Shift from the outside in.';

function makeTrace() {
  return function* () {
    // Mutable array model. null marks a free slot. `count` is the live count.
    const arr = [10, 20, 30, null, null];
    let count = 3;

    /* ---------- Step 0 (required): initial state, nothing executed ---------- */
    yield snap({
      line: null, tag: 'init',
      narrate: 'The array-based list before any operation. Three elements occupy indices 0–2; indices 3 and 4 are free. Only main is on the call stack.',
      note: SETUP,
      arr, count, frames: [mainF()],
    });

    /* ================= main calls ADD(40)  ==  INSERT(count, 40) ================= */
    yield snap({
      line: L.mainAdd, tag: 'call',
      narrate: 'main calls ADD(40). Control enters ADD next.',
      arr, count, frames: [mainF()],
    });
    yield snap({
      line: L.addCall, tag: 'call',
      narrate: 'Inside ADD: the parameter value is bound to 40. ADD’s whole job is to call INSERT(count, 40).',
      note: ADD_NOTE,
      arr, count, frames: [mainF(L.mainAdd), addF(40)],
    });
    // ADD calls INSERT: its frame appears with index bound to count's value (3).
    yield snap({
      line: L.insCheck, tag: 'check',
      narrate: 'Inside INSERT: index is bound to count, which is 3, and value to 40 — both now visible in the frame. Range check: 0 ≤ 3 ≤ 3, valid.',
      arr, count, frames: [mainF(L.mainAdd), addF(40, L.addCall), insF(3, 40)],
    });
    yield snap({
      line: L.insFor, tag: 'loop',
      narrate: 'The shift loop runs from count (3) down to index + 1 (4): an empty range, so it never executes and i is never set. Appending needs no room made.',
      arr, count, frames: [mainF(L.mainAdd), addF(40, L.addCall), insF(3, 40)],
    });
    arr[3] = 40;
    yield snap({
      line: L.insWrite, tag: 'write',
      narrate: 'A[3] = 40. The value is written into the first free slot, index 3.',
      arr, count, active: 3, frames: [mainF(L.mainAdd), addF(40, L.addCall), insF(3, 40)],
    });
    count = 4;
    yield snap({
      line: L.insCount, tag: 'count',
      narrate: 'count = 4. Update the count — the list now holds four elements, indices 0–3.',
      arr, count, countActive: true, frames: [mainF(L.mainAdd), addF(40, L.addCall), insF(3, 40)],
    });

    /* ================= main calls INSERT(1, 25) (shift the tail RIGHT) ================= */
    // INSERT returns to ADD, ADD returns to main: both frames pop, shown by the
    // stack collapsing back to [main] on this next call step.
    yield snap({
      line: L.mainIns25, tag: 'call',
      narrate: 'INSERT returns to ADD, and ADD — whose only job was that call — returns to main. Now main calls INSERT(1, 25).',
      arr, count, frames: [mainF()],
    });
    yield snap({
      line: L.insCheck, tag: 'check',
      narrate: 'Inside INSERT: index = 1, value = 25. Range check: is index (1) outside 0..count (0..4)? No, so it is valid.',
      arr, count, frames: [mainF(L.mainIns25), insF(1, 25)],
    });
    yield snap({
      line: L.insFor, tag: 'loop',
      narrate: 'Make room at index 1: the loop runs i from count (4) down to index + 1 (2), shifting the tail right.',
      note: MAKE_ROOM_NOTE,
      arr, count, frames: [mainF(L.mainIns25), insF(1, 25)],
    });
    arr[4] = arr[3];   // 40
    yield snap({
      line: L.insShift, tag: 'shift',
      narrate: 'i = 4. A[4] = A[3] = 40 — copy the last element into the free slot to its right.',
      arr, count, active: 4, frames: [mainF(L.mainIns25), insF(1, 25, iVar(4, 'active'))],
    });
    arr[3] = arr[2];   // 30
    yield snap({
      line: L.insShift, tag: 'shift',
      narrate: 'i = 3. A[3] = A[2] = 30.',
      arr, count, active: 3, frames: [mainF(L.mainIns25), insF(1, 25, iVar(3, 'active'))],
    });
    arr[2] = arr[1];   // 20
    yield snap({
      line: L.insShift, tag: 'shift',
      narrate: 'i = 2. A[2] = A[1] = 20. Index 1 is now safe to overwrite — its old value is already copied to index 2.',
      arr, count, active: 2, frames: [mainF(L.mainIns25), insF(1, 25, iVar(2, 'active'))],
    });
    arr[1] = 25;
    yield snap({
      line: L.insWrite, tag: 'write',
      narrate: 'The loop is finished. A[1] = 25 — write the new value into the room just made.',
      arr, count, active: 1, frames: [mainF(L.mainIns25), insF(1, 25, iVar(1, 'done'))],
    });
    count = 5;
    yield snap({
      line: L.insCount, tag: 'count',
      narrate: 'count = 5. Update the count — the list is now full: count = MAX = 5.',
      arr, count, countActive: true, frames: [mainF(L.mainIns25), insF(1, 25, iVar(1, 'done'))],
    });

    /* ================= main calls INSERT(7, 99) (INVALID; the key step) ================= */
    const holes = [
      { label: '5', value: EMPTY, role: 'error' },
      { label: '6', value: EMPTY, role: 'error' },
      { label: '7', value: 99,    role: 'error' },
    ];
    yield snap({
      line: L.mainIns99, tag: 'call',
      narrate: 'INSERT returns to main. Now main calls INSERT(7, 99) — an attempt to insert 99 at index 7.',
      arr, count, frames: [mainF()],
    });
    yield snap({
      line: L.insCheck, tag: 'check',
      narrate: 'Inside INSERT: index = 7, value = 99 — the arguments are now visible in the frame. Range check: is index (7) > count (5)? Yes. Index 7 is outside the valid range 0..5.',
      note: INVALID_NOTE,
      arr, count, phantom: holes, frames: [mainF(L.mainIns99), insF(7, 99)],
    });
    yield snap({
      line: L.insErr, tag: 'error',
      narrate: 'The index is invalid, so INSERT reports an error and returns without writing. The array is unchanged.',
      arr, count, phantom: holes, frames: [mainF(L.mainIns99), insF(7, 99)],
    });

    /* ================= main calls DELETE(1) (shift the tail LEFT) ================= */
    yield snap({
      line: L.mainDel, tag: 'call',
      narrate: 'INSERT returns to main without changing the array. Now main calls DELETE(1) — remove the element at index 1.',
      arr, count, frames: [mainF()],
    });
    yield snap({
      line: L.delCheck, tag: 'check',
      narrate: 'Inside DELETE: index = 1. Range check: is index (1) within 0..count − 1 (0..4)? Yes, so it is valid.',
      arr, count, frames: [mainF(L.mainDel), delF(1)],
    });
    yield snap({
      line: L.delFor, tag: 'loop',
      narrate: 'Removing index 1 would leave a hole there. To keep the list contiguous, the loop runs i from index (1) to count − 2 (3), shifting each later element one slot left.',
      note: DELETE_NOTE,
      arr, count, frames: [mainF(L.mainDel), delF(1)],
    });
    arr[1] = arr[2];   // 20 overwrites 25 -- the delete happens here
    yield snap({
      line: L.delShift, tag: 'shift',
      narrate: 'i = 1. A[1] = A[2] = 20. The element 25 at index 1 is overwritten — the delete happens here.',
      arr, count, active: 1, frames: [mainF(L.mainDel), delF(1, iVar(1, 'active'))],
    });
    arr[2] = arr[3];   // 30
    yield snap({
      line: L.delShift, tag: 'shift',
      narrate: 'i = 2. A[2] = A[3] = 30.',
      arr, count, active: 2, frames: [mainF(L.mainDel), delF(1, iVar(2, 'active'))],
    });
    arr[3] = arr[4];   // 40
    yield snap({
      line: L.delShift, tag: 'shift',
      narrate: 'i = 3. A[3] = A[4] = 40. The elements are packed contiguously again.',
      arr, count, active: 3, frames: [mainF(L.mainDel), delF(1, iVar(3, 'active'))],
    });
    count = 4;
    arr[4] = null;     // the trailing duplicate falls outside the list
    yield snap({
      line: L.delCount, tag: 'count',
      narrate: 'count = 4. Update the count — the duplicate left at index 4 now falls outside the list, which is contiguous again at indices 0–3.',
      note: PAYOFF_NOTE,
      arr, count, countActive: true, frames: [mainF(L.mainDel), delF(1, iVar(4, 'done'))],
    });

    /* ================= main calls badINSERT(1, 25) (WRONG shift direction) =================
     * The array is back to [10, 20, 30, 40], count 4 — the same shape the correct
     * INSERT(1, 25) faced. badINSERT is that insert with ONE thing changed: the
     * loop shifts front-first (A[i+1] = A[i], i from index up), so each iteration
     * reads a cell the previous one already overwrote. One value smears down the
     * tail. This is overwrite corruption, so every smear step carries the red ⚠
     * (AUTHORING.md "Memory-danger marker"). The confusion-first note runs first;
     * the payoff note answers it after the smear. */
    yield snap({
      line: L.mainBad, tag: 'call',
      narrate: 'main calls badINSERT(1, 25). It inserts the same way — range check, shift, write — but shifts in the opposite direction. Control enters badINSERT next.',
      note: CONFUSION_NOTE,
      arr, count, frames: [mainF()],
    });
    yield snap({
      line: L.badCheck, tag: 'check',
      narrate: 'Inside badINSERT: index = 1, value = 25. Range check: 0 ≤ 1 ≤ 4, valid — exactly as the correct INSERT checked.',
      arr, count, frames: [mainF(L.mainBad), badF(1, 25)],
    });
    yield snap({
      line: L.badFor, tag: 'loop',
      narrate: 'This loop shifts front-first: i runs from index (1) up to count − 1 (3), each iteration copying a cell into the one to its right — A[i + 1] = A[i]. Watch the tail.',
      arr, count, frames: [mainF(L.mainBad), badF(1, 25)],
    });
    arr[2] = arr[1];   // 20 overwrites 30 -- the first cell clobbered
    yield snap({
      line: L.badShift, tag: 'shift',
      narrate: [
        'i = 1. A[2] = A[1] copies 20 up into index 2. ',
        { danger: true, text: 'Index 2 held 30, but we overwrite it before it was ever copied — the 30 is destroyed.' },
      ],
      arr, count, active: 2, frames: [mainF(L.mainBad), badF(1, 25, iVar(1, 'active'))],
    });
    arr[3] = arr[2];   // 20 again -- reads the cell just clobbered
    yield snap({
      line: L.badShift, tag: 'shift',
      narrate: [
        'i = 2. A[3] = A[2], but A[2] was just overwritten with 20, so 20 copies again — index 3 becomes 20 and the 40 there is destroyed. ',
        { danger: true, text: 'Each step reads a cell we already clobbered, so one value smears down the tail.' },
      ],
      arr, count, active: 3, frames: [mainF(L.mainBad), badF(1, 25, iVar(2, 'active'))],
    });
    arr[4] = arr[3];   // 20 propagates once more
    yield snap({
      line: L.badShift, tag: 'shift',
      narrate: [
        'i = 3. A[4] = A[3] = 20 — the same 20 propagates once more, into index 4. ',
        { danger: true, text: 'The whole tail is now the single value 20; every element after index 1 has been clobbered.' },
      ],
      arr, count, active: 4, frames: [mainF(L.mainBad), badF(1, 25, iVar(3, 'active'))],
    });
    arr[1] = 25;
    yield snap({
      line: L.badWrite, tag: 'write',
      narrate: [
        'The loop is finished. A[1] = 25 writes the new value. ',
        { danger: true, text: 'But 30 and 40 are already gone — the list is [10, 25, 20, 20, 20], not [10, 25, 20, 30, 40]. The data is corrupted.' },
      ],
      arr, count, active: 1, frames: [mainF(L.mainBad), badF(1, 25, iVar(3, 'done'))],
    });
    count = 5;
    yield snap({
      line: L.badCount, tag: 'count',
      narrate: 'count = 5. The count claims five elements, but three of them are the smeared 20 — the shift direction, not the count, is what corrupted the data.',
      note: BAD_PAYOFF_NOTE,
      arr, count, countActive: true, frames: [mainF(L.mainBad), badF(1, 25, iVar(3, 'done'))],
    });
  };
}

const SPEC = {
  title: 'Array-based list: keeping it contiguous through insert and delete',

  profile: 'standard',
  columns: 2,

  panels: [
    { type: 'code',      id: 'code',  title: 'list operations',
      listings: LISTINGS, labels: { pseudo: 'pseudocode', java: 'Java', cpp: 'C++' } },
