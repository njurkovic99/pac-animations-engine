<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stacks-paren-scanner — preview</title>
<style>/* pac-animations — design system
   15 tokens replacing the 188 distinct color values found across the
   original 25 animation files. */

:root {
  /* surfaces */
  --bg:            #0f1117;
  --panel:         #171a23;
  --panel-header:  #1e222d;
  --border:        #2b3040;

  /* text */
  --text:          #d8dce6;
  --text-dim:      #8b93a7;

  /* accents — one blue, not four */
  --accent:        #4a90e2;
  --accent-soft:   rgba(74, 144, 226, 0.18);

  /* semantic state */
  --ok:            #4caf82;
  --warn:          #e0a33a;
  --error:         #e2564a;
  --highlight:     #d4a13c;

  /* structural */
  --radius:        6px;
  --gap:           14px;
  --mono:          "SF Mono", "Cascadia Code", Consolas, monospace;

  /* ---- layout metrics (see AUTHORING.md "Panels flow across both columns") ----
   * The engine (layoutStage) resolves every panel's size ONCE from the viewport
   * and from the maximum content each panel holds across the whole trace -- the
   * CODE panel to as many whole lines as fit (floored at 15), each other panel to
   * its measured content. These are the base metrics it reads. Design target: a
   * 1920x1080 window at 100%. */
  --code-line-h:   21px;     /* code line height -- an INTEGER px (see .pac-code) */
  --code-lines:    15;       /* code lines FLOOR before the CODE panel scrolls */
  --body-pad:      22px;     /* a panel body's vertical padding (both edges) */

  /* ---- fixed footer heights (see AUTHORING.md "Stable layout") ----
   * The narration bar and note box are RESERVED at a constant height so their
   * content changing step-to-step (longer narration, a note appearing or
   * disappearing) never changes the height of anything below the controls. The
   * stage stays the viewport absorber -- it shrinks on a short viewport so the
   * note is never pushed off the fold -- but because the footer below it is now
   * a constant height, the stage no longer resizes step-to-step, so the
   * controls / narration / note never move as steps advance. Longer content
   * scrolls internally within these fixed boxes. Sized to the measured maxima
   * (~2-line narration, ~4-line note) with headroom; tunable. */
  --narrate-h:     72px;
  --note-h:        104px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* The whole animation is a full-viewport flex column: the stage flexes to fill
 * the space that is left after the pinned chrome (title, controls, narration,
 * note), and the stage — never the page — is what shrinks on a short viewport.
 * This is the safety net that keeps the note on screen at any viewport height. */
.pac-root {
  padding: var(--gap);
  max-width: 1200px;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow: hidden;            /* the page itself never scrolls; panels do */
}
/* Everything except the stage keeps its natural height and is always visible;
 * only the stage (below) flexes and yields space on a short viewport. */
.pac-root > *:not(.pac-stage) { flex: 0 0 auto; }

.pac-title { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
.pac-sub   { color: var(--text-dim); font-size: 13px; margin: 0 0 var(--gap); }

/* ---- open-in-own-window link (see AUTHORING.md "Open-in-own-window link") ----
 * The escape hatch every animation carries: a self-link (target="_blank") that
 * opens the page full-window, where there's no Canvas chrome. The engine shows
 * it prominently only when embedded (window.self !== window.top) and hides it
 * standalone. Colour is --warn amber-orange so it stands out from body text
 * without reading as the --error danger red; styled as a plain link (icon +
 * underline on hover) so it reads as a helpful hint, not a content warning. */
.pac-openwin {
  display: inline-block;
  margin: -6px 0 var(--gap);
  color: var(--warn);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
}
.pac-openwin:hover  { text-decoration: underline; }
.pac-openwin:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
.pac-openwin[hidden] { display: none; }

/* ---- layout: panels flow across two columns ----
 * The stage is two side-by-side columns whose exact height is resolved ONCE by
 * the engine (layoutStage) and then held -- the master invariant. The code panel
 * anchors the top of the LEFT column at its 15-line floor; structure panels sit
 * side by side in a height-capped region at the top of the RIGHT column; and
 * bookkeeping panels flow down the right column, the balancing overflow
 * continuing beneath the code panel in the left. The engine sets the stage
 * height, the structure-region height, each bookkeeping body's min-height, and
 * the code body height inline, so nothing changes as steps advance. See
 * AUTHORING.md "Panels flow across both columns" / "structure region ceiling" /
 * "bookkeeping 2-row floor". */
.pac-stage {
  display: flex;
  flex-direction: row;
  align-items: stretch;        /* both columns take the resolved stage height */
  gap: var(--gap);
  position: relative;          /* anchor origin for the arrow overlay */
  flex: 0 0 auto;              /* height is set by the engine, not by flex */
  min-height: 0;
  overflow: hidden;            /* the bound is hard; panels scroll, not the stage */
}
/* A column is a vertical stack of panels. Width rules (AUTHORING.md "Width
 * rules"): height is scarce, width is not. Every panel takes its NATURAL content
 * width and LEFT-aligns (align-items: flex-start), leftover width at the right
 * stays empty -- the engine pins each panel's width to its per-run maximum. The
 * RIGHT column sizes to its widest panel; the LEFT column takes the rest and the
 * code panel fills it (the one panel that genuinely benefits from extra width).
 * Overflow is visible so a panel wider than its column is never clipped. */
.pac-col {
  display: flex; flex-direction: column; gap: var(--gap);
  align-items: flex-start; min-height: 0;
}
.pac-col[data-side="left"]  { flex: 1 1 auto; min-width: 0; }
.pac-col[data-side="right"] { flex: 0 0 auto; }
.pac-col > .pac-panel { flex: 0 0 auto; }   /* panels keep their resolved heights */
/* CODE and STREAM are the exceptions -- they take ALL the width their column has.
 * Code so a long line never wraps or scrolls (rule 4); STREAM because output has
 * no predictable width, so a narrow box would wrap or truncate text the student
 * must read. Beneath the code panel, STREAM matches its width and the two read as
 * one column. (AUTHORING.md "Width rules".) */
.pac-col > .pac-panel[data-kind="code"],
.pac-col > .pac-panel[data-type="stream"] { align-self: stretch; }

/* The structure region: structure panes side by side at their own widths, from
 * the left, SHARING the row height the engine pins (<= half the stage). Each pane
 * scrolls internally, following its active element, if its content overflows. On
 * a narrow viewport the region stacks vertically instead (resolved once on load).
 */
.pac-structure {
  display: flex; flex-direction: row; gap: var(--gap);
  align-items: stretch; min-height: 0; flex: 0 0 auto;
}
.pac-structure:empty { display: none; }
.pac-structure[data-stacked] { flex-direction: column; align-items: flex-start; }
.pac-structure > .pac-panel { flex: 0 0 auto; }

/* ---- panel chrome ---- */
.pac-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.pac-panel-head {
  background: var(--panel-header);
  padding: 7px 11px;
  font-size: 12px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  /* The title never wraps: a panel is sized to its NATURAL width (which includes
   * this one-line title), so wrapping would mean the title is wider than the
   * panel the engine measured -- keep it one line so the measured width holds. */
  white-space: nowrap;
}
.pac-panel-body { padding: 11px; overflow: auto; flex: 1; min-height: 0; }

/* ---- controls ---- */
.pac-controls {
  display: flex; gap: 8px; align-items: center;
  margin: var(--gap) 0; flex-wrap: wrap;
}
.pac-btn {
  background: var(--panel-header);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 14px;
  font-size: 13px;
  cursor: pointer;
}
.pac-btn:hover:not(:disabled) { border-color: var(--accent); }
.pac-btn:disabled { opacity: .38; cursor: default; }
.pac-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.pac-progress { color: var(--text-dim); font-size: 12px; margin-left: auto; }

.pac-narrate {
  background: var(--accent-soft);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px 14px 12px 16px;
  margin-top: var(--gap);
  /* Fixed height (not min-height): longer narration scrolls internally so the
   * note below never shifts and the controls above never move. */
  height: var(--narrate-h);
  overflow: auto;
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
}
/* A brief in-scheme pulse when the step changes, so a new explanation
 * actively pulls the eye instead of being missed. Retriggered per step
 * by the engine (see render()). */
@keyframes pac-narrate-flash {
  0%   { background: var(--accent-soft); box-shadow: 0 0 0 0 rgba(74, 144, 226, 0); }
  18%  { background: rgba(74, 144, 226, 0.34); box-shadow: 0 0 0 3px var(--accent-soft); }
  100% { background: var(--accent-soft); box-shadow: 0 0 0 0 rgba(74, 144, 226, 0); }
}
.pac-narrate-flash { animation: pac-narrate-flash 0.55s ease-out; }

/* ---- teaching-note box ----
 * Non-execution commentary (setup, common-mistake asides, post-watch
 * challenge). A note attaches to a step and shows only while that step is
 * current; on steps without one the box collapses to nothing (below) so the
 * layout reflows. Amber-keyed so it reads as an aside, distinct from the blue
 * narration bar. See AUTHORING.md "Steps vs. notes". */
.pac-note {
  background: rgba(212, 161, 60, 0.10);
  border: 1px solid var(--border);
  border-left: 4px solid var(--highlight);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-top: 8px;
  /* Reserved at a constant height so a note appearing or disappearing never
   * moves anything above it (the controls) -- see the footer note in :root. A
   * longer note scrolls internally rather than growing the box. */
  height: var(--note-h);
  overflow: auto;
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.55;
}
.pac-note::before {
  content: "note";
  display: block;
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--highlight);
  margin-bottom: 3px;
}
/* No note on this step: the box is rendered invisible (nothing painted -- no
 * border, background, or "note" label) but KEEPS its reserved --note-h height,
 * so a note appearing or disappearing never shifts the controls above it. A
 * note-less step therefore reads as blank space, not an empty amber box. On the
 * design viewport this simply fills space that was previously bottom slack, so
 * it costs nothing there; on a short viewport it trades stage height for the
 * guarantee that Back/Next never move (AUTHORING.md "Stable layout"). */
.pac-note-empty { visibility: hidden; }
@keyframes pac-note-flash {
  0%   { background: rgba(212, 161, 60, 0.10); box-shadow: 0 0 0 0 rgba(212, 161, 60, 0); }
  18%  { background: rgba(212, 161, 60, 0.26); box-shadow: 0 0 0 3px rgba(212, 161, 60, 0.16); }
  100% { background: rgba(212, 161, 60, 0.10); box-shadow: 0 0 0 0 rgba(212, 161, 60, 0); }
}
.pac-note-flash { animation: pac-note-flash 0.55s ease-out; }

/* ---- memory-danger marker ----
 * A red warning triangle (⚠) + --error on any narration or note segment that
 * names a memory-integrity violation. Project-wide, cross-course convention.
 * See AUTHORING.md "Memory-danger marker". */
.pac-danger { color: var(--error); font-weight: 600; }

/* ---- CODE panel ----
 * The viewport is --code-lines (15) lines as a FLOOR, not a fixed value: the
 * engine (layoutStage) grows it to as many WHOLE lines as fit the left column
 * once every other panel is placed, capped at the listing's length, resolved
 * ONCE on load and on window resize and then held constant -- it never changes
 * with steps, frames, or the language tab. The engine sets the body height and
 * the listing's whole-line max-height inline; the height below is the pre-measure
 * fallback. See AUTHORING.md "Panels flow across both columns" and code.js for
 * the follow-the-highlight scrolling. */
.pac-panel[data-type="code"] .pac-panel-body {
  height: calc(var(--code-lines) * var(--code-line-h) + var(--body-pad));
  flex: none;
  overflow: hidden;                      /* the listing scrolls, not the body */
}
/* The body fills the column (bottom lines up with the other column); the listing
 * inside is clipped to a WHOLE number of lines (engine fitCodePanels sets its
 * max-height), so the last visible line is never a sliver and any sub-line
 * remainder is blank space below the listing rather than a gap below the panel. */
.pac-panel[data-type="code"] .pac-code { overflow-y: auto; }

.pac-lang-tabs { display: flex; gap: 4px; }
.pac-lang-tab {
  background: none; border: 1px solid transparent; color: var(--text-dim);
  font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
}
.pac-lang-tab[aria-selected="true"] {
  color: var(--text); border-color: var(--border); background: var(--panel);
}
/* line-height is an INTEGER px, not a unitless ratio: 12.5 x 1.65 = 20.625 is a
 * sub-pixel value, and that fractional height defeats whole-line clipping --
 * scrollTop rounds to whole pixels, so a fractional line height always leaves a
 * sliver of a neighbouring line. An integer line height makes the viewport
 * (lines x height), the scroll boundaries, and the panel height all exact, so
 * every visible line is whole (AUTHORING.md "whole lines only"). */
.pac-code { font-family: var(--mono); font-size: 12.5px; line-height: 21px; }
.pac-code-line { display: flex; padding: 0 4px; border-radius: 3px; white-space: pre; }
.pac-code-line.is-active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.pac-code-line.is-active.is-danger { background: rgba(226, 86, 74, 0.16); box-shadow: inset 2px 0 0 var(--error); color: var(--error); }
/* Parked caller line: the call site of a caller still on the stack, suspended
 * while the callee runs. The same highlight as the active line, greyed with the
 * SAME opacity token the CALLSTACK uses for its inactive (caller) frames -- not a
 * new colour. One visual language across both panels: bright = running now, dim
 * = suspended, waiting to resume. See AUTHORING.md "Line highlight — active line
 * vs. parked caller lines". */
.pac-code-line.is-parked { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); opacity: .5; }
.pac-code-num { color: var(--text-dim); width: 2.2em; text-align: right; margin-right: 12px; user-select: none; }

/* ---- STREAM panel ---- */
/* The STREAM accumulates output as steps advance. As a bookkeeping panel it is
 * reserved by the engine (layoutStage) to its per-run MAXIMUM number of lines
 * (with a 2-row floor), so an empty STREAM at step 0 is already a box of that
 * final size and nothing below it shifts as lines arrive. stream.js keeps the
 * newest line scrolled into view. See AUTHORING.md "bookkeeping 2-row floor". */
.pac-stream { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; }
.pac-stream-line { white-space: pre; }
.pac-stream-line.dir-in   { color: var(--warn); }
.pac-stream-line.dir-out  { color: var(--text); }
.pac-stream-line.is-new   { background: var(--accent-soft); border-radius: 3px; }
.pac-stream-cursor { color: var(--accent); animation: pac-blink 1s steps(2) infinite; }
@keyframes pac-blink { 50% { opacity: 0; } }

/* ---- CELLS panel ---- */
.pac-cells { display: flex; flex-wrap: wrap; gap: 6px; }
.pac-cells[data-render="row"] { flex-direction: column; gap: 3px; }
.pac-cell {
  border: 1px solid var(--border); border-radius: 4px;
  padding: 5px 9px; font-family: var(--mono); font-size: 12.5px;
  min-width: 40px; text-align: center; background: var(--bg);
}
.pac-cell-label { display: block; font-size: 10px; color: var(--text-dim); }
/* The value always reserves one line of height, so a cell with no value (an
 * `empty` cell) keeps the SAME dimensions as a filled one -- the X then spans a
 * full box rather than a squashed strip. */
.pac-cell-value { display: block; min-height: 1.25em; }
.pac-cell[data-role="active"]   { border-color: var(--accent); background: var(--accent-soft); }
.pac-cell[data-role="compared"] { border-color: var(--highlight); }
.pac-cell[data-role="ok"]       { border-color: var(--ok); }
.pac-cell[data-role="error"]    { border-color: var(--error); color: var(--error); }
/* empty: indeterminate storage -- an unwritten array cell OR an unassigned
 * standalone variable (one glyph for both). Same box and dimensions as a member,
 * but a DASHED dimmed border, a dim em-dash "—" value (added by the renderer),
 * and a thin, low-opacity X drawn corner to corner across the interior (an SVG
 * stretched to the cell). Together they read as "holds no meaningful value" --
 * impossible to mistake for a space character or a rendering failure, and a
 * different SHAPE from `stale`'s greyed character. (A real stored value such as
 * the -1 sentinel is NOT empty and renders normally.) */
.pac-cell[data-role="empty"] {
  border-style: dashed;
  border-color: var(--border);
  color: var(--text-dim);
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20preserveAspectRatio='none'%20viewBox='0%200%20100%20100'%3E%3Cg%20stroke='%238b93a7'%20stroke-width='2'%20stroke-opacity='0.3'%3E%3Cline%20x1='9'%20y1='9'%20x2='91'%20y2='91'/%3E%3Cline%20x1='91'%20y1='9'%20x2='9'%20y2='91'/%3E%3C/g%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 100% 100%;
}
/* stale: a cell whose value is no longer a queue member. The value is STILL
 * shown, greyed (~40%), with NO member outline -- distinct from `empty` (a cell
 * that never held anything). Blanking it would wrongly imply the program can see
 * emptiness by looking at the array; the character is still in memory, only the
 * index moved. See AUTHORING.md / panel-inventory §2 and queues-count-vs-rear. */
.pac-cell[data-role="stale"]    { opacity: .4; border-color: transparent; }

.pac-cells[data-render="row"] .pac-cell {
  display: flex; justify-content: space-between; text-align: left; min-width: 0;
}
.pac-cells[data-render="row"] .pac-cell-label { display: inline; }

/* ---- index-pointer markers (AUTHORING.md "Planned primitive — the index
 * pointer") ----
 * A labeled caret that points at an array cell and moves as its index changes --
 * the array-world analog of the linked-list pointer arrow. When a `box` CELLS
 * panel carries `markers`, each cell is rendered as a COLUMN: the box, an index
 * label beneath it, then a marker track. A marker's caret sits under the cell at
 * its index, its label below the caret; two markers on the SAME cell render side
 * by side (flex row) rather than overlapping. All markers are solid/stored --
 * there is no "derived" marker style. */
/* A marked index array never WRAPS: [0][1][2][3] is one row, always -- a wrapped
 * index array is the index-vs-position confusion rendered as a layout. If the row
 * is wider than its panel it scrolls horizontally rather than folding. This also
 * gives the panel a natural single-row width, so a structure pane holding it is
 * sized to fit all its cells side by side. */
.pac-cells[data-marked] { align-items: start; gap: 8px; flex-wrap: nowrap; }
/* Columns are wide enough that TWO labelled markers (front + rear on the same
 * cell) sit side by side without overlapping each other or the neighbouring
 * cells' labels. */
.pac-cell-col { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 72px; }
.pac-cell-col .pac-cell { min-width: 44px; padding: 3px 9px; }
/* A single-marker array needs no room for a second caret under a cell, so its
 * columns are narrower -- letting a short array (e.g. the expression) sit beside
 * another structure panel. */
.pac-cells[data-marked][data-single] .pac-cell-col { min-width: 52px; }
/* The row's name (e.g. "contents"), once at the left, aligned with the cell
 * boxes so it reads as the array's label. */
.pac-cells-name {
  align-self: start; margin-top: 6px; margin-right: 2px;
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
}
/* Bracketed index labels: [0] [1] … mark position as an INDEX, not a value. */
.pac-cell-index { font-size: 10.5px; color: var(--text-dim); font-family: var(--mono); }
.pac-cell-markers {
  display: flex; justify-content: center; gap: 6px;
  margin-top: 2px; white-space: nowrap;
}
.pac-marker { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.pac-marker-caret { color: var(--accent); font-size: 11px; }
.pac-marker-label {
  font-family: var(--mono); font-size: 10.5px; color: var(--accent); font-weight: 600;
}

/* Parked markers (index < 0): a cell column to the left of cell [0] whose box and
 * index bands are INVISIBLE (they only reserve height), so its marker track lines
 * up with every cell's marker track. The markers are dimmed so they read as
 * "pointing at nothing yet" rather than missing. */
.pac-cell-parked { min-width: auto; margin-right: 2px; }
.pac-cell-parked .pac-cell { min-width: 0; }
.pac-cell-parked .pac-cell,
.pac-cell-parked .pac-cell-index { visibility: hidden; }
.pac-cell-parked .pac-marker { opacity: .5; }

/* ---- vertical stack column (render: 'column') ----
 * The vertical analogue of the marked box row, for a stack (AUTHORING.md "The
 * one new capability"). Cell [0] is at the BOTTOM; the column grows UPWARD. Each
 * cell is a row of three fixed-width bands: a LEFT marker lane, the box, and a
 * RIGHT bracketed index label. Every band keeps a constant width, so the box
 * column and both label bands never shift as cells fill/empty/go stale or as the
 * marker moves -- and a marker leaving the parked lane travels purely vertically
 * (the left lane holds the same x on every row, including the parked one). */
.pac-cells[data-render="column"] {
  flex-direction: column;
  flex-wrap: nowrap;
  align-items: center;      /* centre the fixed-width rows in the panel */
  gap: 3px;
}
.pac-col-row { display: flex; flex-direction: row; align-items: center; gap: 8px; }
/* LEFT marker lane: fixed width, markers right-aligned so the caret hugs the box.
 * Wide enough for the longest label ("stack_ix ▶") without touching the box. */
.pac-col-markers {
  min-width: 92px;
  display: flex; flex-direction: row; justify-content: flex-end; align-items: center;
  gap: 8px; white-space: nowrap;
}
.pac-col-row .pac-cell { min-width: 46px; padding: 2px 10px; }
/* RIGHT index band: fixed width, bracketed [0].. labels mark position as an
 * INDEX, not a value -- the vertical analogue of the fixed-height index band. */
.pac-col-index {
  min-width: 34px; text-align: left;
  font-family: var(--mono); font-size: 10.5px; color: var(--text-dim);
}
/* A column marker: label left, right-pointing caret (▶) hugging the box. */
.pac-col-marker { display: flex; flex-direction: row; align-items: center; gap: 4px; }
.pac-col-marker .pac-marker-caret { color: var(--accent); font-size: 12px; line-height: 1; }
.pac-col-marker .pac-marker-label {
  font-family: var(--mono); font-size: 10.5px; color: var(--accent); font-weight: 600;
}
/* Parked lane (a negative-index sentinel): the row BELOW cell [0]. Its box and
 * index label are INVISIBLE -- they only reserve the row's height so the cells
 * above never shift -- and the marker is dimmed so it reads as "pointing at
 * nothing yet" rather than missing. */
.pac-col-parked .pac-cell,
.pac-col-parked .pac-col-index { visibility: hidden; }
.pac-col-parked .pac-col-marker { opacity: .5; }

/* Compact strip (e.g. "A stores"): a HORIZONTAL row of uniform-width labelled

 * top-align within it and the pane scrolls internally if the stack ever grows

 * the opposite of what the width rules are for. The frame is measured to fit the
 * value's full width. A genuinely long value truncates with an ellipsis instead
 * of driving the whole panel wide -- the cap bounds the natural width the engine
 * measures, so it never collapses narrower. */

.pac-arg[data-role="active"] .pac-arg-name { color: var(--text); }

.pac-frame-locals { display: flex; flex-direction: column; gap: 2px; margin-top: 3px; }
.pac-frame-var {
  display: flex; justify-content: space-between; gap: 14px;
  font-family: var(--mono); font-size: 12px;
  padding: 1px 6px; border-radius: 3px;
  border: 1px solid transparent;
}
.pac-frame-var-name { color: var(--text-dim); white-space: nowrap; }
.pac-frame-var-val {
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

}
.pac-frame-var[data-role="active"] .pac-frame-var-name { color: var(--text); }

 * the function returns -- it does not vanish mid-frame. */

 * the panel takes the width the structure needs (AUTHORING.md "Width rules"),
 * capped at the column so it never overflows. */

.pac-node[data-state="active"]   .pac-node-box { stroke: var(--accent); fill: var(--accent-soft); }
.pac-node[data-state="exited"]   .pac-node-box { stroke: var(--ok); }

 * present yet visibly not settled, and distinct from the dimmed `pending`

.pac-node-meta  { fill: var(--text-dim); font-family: var(--mono); font-size: 9.5px; text-anchor: middle; }
.pac-node[data-state="pending"] .pac-node-label { fill: var(--text-dim); }
.pac-edge { stroke: var(--border); stroke-width: 1.2; fill: none; }
.pac-edge[data-state="taken"] { stroke: var(--accent); }

/* ---- CHART panel ---- */
.pac-chart-axis { stroke: var(--border); }
.pac-chart-tick { fill: var(--text-dim); font-size: 9px; }
.pac-chart-series { fill: none; stroke-width: 1.8; }

/* ---- arrow overlay ---- */

.pac-arrow { stroke: var(--accent); stroke-width: 1.6; fill: none; }

.pac-metrics b { color: var(--text); font-weight: 600; font-family: var(--mono); }

.pac-root[data-profile="beginner"] .pac-addresses { display: none; }

<script type="module">
const codePanel = (() => { /* CODE panel — listings with per-language variants.
 *
 * Step data: { line: 7 }  or  { line: {pseudo: 5, java: 7, cpp: 7} }
 *
 * Because each trace addresses its OWN listing's line numbers, the listings
 * never need to stay line-aligned with each other. That constraint would have
 * been unmaintainable across ~64 files and five years. */

function mount(body, spec, ctx, tools) {
  spec._langs = Object.keys(spec.listings);
  if (spec._langs.length > 1) {
    tools.innerHTML = `<span class="pac-lang-tabs">${spec._langs.map(l =>
      `<button class="pac-lang-tab" data-lang="${l}">${spec.labels?.[l] ?? l}</button>`
    ).join('')}</span>`;
    tools.addEventListener('click', e => {
      const l = e.target.dataset?.lang;
      if (l) ctx.engine.setLanguage(l);
    });
  }
  body.innerHTML = '<div class="pac-code"></div>';
}

function render(body, data, ctx, { lang }) {
  const spec = ctx.spec;
  const use = spec.listings[lang] ? lang : spec._langs[0];

  ctx.engine.root.querySelectorAll('.pac-lang-tab').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.lang === use)));

  const active = (data?.line && typeof data.line === 'object') ? data.line[use] : data?.line;
  // When the code line itself is the memory-integrity culprit, the step sets
  // `dangerLine: true` and the active line is tinted red instead of blue.
  const danger = !!data?.dangerLine;

  // DIMMED so the student keeps sight of where the call came from and where it
  // returns (AUTHORING.md "Line highlight — active line vs. parked caller lines").
  // Each entry is a plain number or a per-language {pseudo,java,cpp} object;
  // resolve to THIS language. The active line always wins if they coincide
  // (bright beats dim), so drop it from the parked set.
  const parked = new Set((data?.parked ?? [])
    .map(p => (p && typeof p === 'object') ? p[use] : p)
    .filter(n => n != null && n !== active));

  body.querySelector('.pac-code').innerHTML = spec.listings[use].map((src, k) => {
    const n = k + 1;
    const cls = n === active ? (danger ? ' is-active is-danger' : ' is-active')
              : parked.has(n) ? ' is-parked' : '';
    return `<div class="pac-code-line${cls}">` +
           `<span class="pac-code-num">${n}</span><span>${esc(src)}</span></div>`;
  }).join('');

  // Follow the highlight, with context. The CODE panel is a fixed 15-line
  // viewport (see styles.css) that scrolls internally, and this listing's main()
  // is far from ADD/DELETE, so every call and return jumps the highlight across a
  // wide gap. Rules:
  //   - the highlighted line is ALWAYS visible (never let it scroll off);
  //   - keep context around it -- when we do scroll, centre it so the student
  //     sees what comes before and after, not pinned to an edge;
  //   - do NOT scroll when it is already comfortably in view -- moving on every
  //     step is as disorienting as never moving. Only scroll when the line would
  //     otherwise sit within MARGIN lines of the top or bottom edge.
  // Only the listing's scrollTop changes -- the panel's height and the rest of
  // the page never move. The scroll container is `.pac-code` (clipped to a whole
  // number of lines by the engine), not the body.
  const scroller = body.querySelector('.pac-code');
  const activeEl = scroller?.querySelector('.pac-code-line.is-active');
  if (scroller && activeEl) {
    const viewRect = scroller.getBoundingClientRect();
    const lineRect = activeEl.getBoundingClientRect();
    const lineH  = lineRect.height || 1;
    const offset = lineRect.top - viewRect.top;      // active line's position in the viewport
    const viewH  = scroller.clientHeight;
    const MARGIN = 3 * lineH;                          // keep >= 3 lines of context each side
    if (offset < MARGIN || offset > viewH - MARGIN - lineH) {
      // Bring it to roughly the middle, then SNAP scrollTop to a whole-line
      // boundary: an unsnapped scrollTop leaves the top line half-scrolled (a
      // sliver of the line above bleeding in, the bottom line clipped), which is
      // the same partial-line defect the viewport height guards against. Rounding
      // the target to a multiple of the line height keeps every visible line whole.
      const target = scroller.scrollTop + offset - (viewH - lineH) / 2;
      scroller.scrollTop = Math.round(target / lineH) * lineH;
    }
  }

 * labels sit to the RIGHT of the column in a fixed-WIDTH band; index-pointer
 * markers sit to the LEFT, each a right-pointing caret (▶) with its variable
 * name to the LEFT of the caret ("stack_ix ▶"). A marker at a negative sentinel
 * parks BELOW cell [0] (the vertical analogue of parking left of it), dimmed,
 * label still visible; leaving the sentinel is a purely VERTICAL move. The
 * parked lane is ALWAYS rendered so nothing shifts as the marker enters or
 * leaves it. Column width and row heights are fixed for every role — a member,
 * a stale cell, and an empty cell are the same size (master invariant).
 *
 * The bracketed index labels are a project-wide rule: `[0]` marks a cell's
 * position as an INDEX, not a value (a naked `1` under a cell holding `b` is the
 * index-vs-value confusion). An optional `rowLabel` names the row once, at the
 * left, so the array's name is present without repeating it under every cell.

 * cell whose value varies in length (e.g. an error name) never resizes the strip
 * as the value changes — the width analogue of the engine's reserved heights. */

function render(body, data, ctx) {

  const mode = data?.render ?? 'box';
  wrap.dataset.render = mode;

  // modes, so it is rendered by its own path (see renderColumn below).

  // cell therefore travels laterally only, never vertically.

    index.className = 'pac-cell-index';
    index.textContent = '[0]';                                 // reserves the index band height

    // value is the dot, so a cross-panel arrow starts from the dot itself --
    // matching the record-field pointers in the NODES panel.
    if (c.anchor) ctx.anchor(`${ctx.spec.id}.${c.anchor}`, cell.querySelector('.pac-cell-value'));

    if (!markers) { wrap.appendChild(cell); return; }

    // Marked mode: wrap the box in a column with a bracketed index label and a
    // marker track. The index label sits BELOW the box; markers whose index
    // equals this cell's position sit side by side beneath it, each caret over
    // its own labelled variable name.
    const col = document.createElement('div');
    col.className = 'pac-cell-col';
    col.appendChild(cell);

    const index = document.createElement('div');
    index.className = 'pac-cell-index';
    index.textContent = `[${c.label != null ? c.label : idx}]`;
    col.appendChild(index);

    const track = document.createElement('div');
    track.className = 'pac-cell-markers';
    for (const m of markers) {
      if (m.index === idx) track.appendChild(marker(m));
    }
    col.appendChild(track);
    wrap.appendChild(col);
  });

  const mk = document.createElement('span');
  mk.className = 'pac-marker';
  mk.innerHTML = `<span class="pac-marker-caret">&#9650;</span>` +

  const cells = data?.cells ?? [];
  const markers = data?.markers ?? [];

    const name = document.createElement('div');
    name.className = 'pac-cells-name';
    name.textContent = data.rowLabel;
    wrap.appendChild(name);

    const r = document.createElement('div');
    r.className = 'pac-col-row' + (parked ? ' pac-col-parked' : '');

    left.className = 'pac-col-markers';

    const cell = document.createElement('div');
    cell.className = 'pac-cell';
    if (c?.role) cell.dataset.role = c.role;
    const value = c == null ? '' : (c.role === 'empty' ? PLACEHOLDER : c.value);

    index.className = 'pac-col-index';
    index.textContent = `[${c && c.label != null ? c.label : idx}]`;

    return r;

  const parked = markers.filter(m => m.index == null || m.index < 0);

  const mk = document.createElement('span');
  mk.className = 'pac-marker pac-col-marker';
  mk.innerHTML = `<span class="pac-marker-label">${esc(m.label)}</span>` +

 *   - `active` -> the FILL (activity): a truthy `active` flags "this node is
 *                 being modified on THIS step" and paints a blue interior,
 *                 orthogonal to `state`. An unlinked node can be amber-outline
 *                 + blue-fill at once; a settled member, green-outline +

const NW = 74, HGAP = 16, VGAP = 62, PAD = 20;

    // Race: { racers: {name: genFn}, merge(frames) -> step }
    const gens = Object.entries(t.racers).map(([k, g]) => [k, g()]);
    const out = [];
    while (out.length < MAX_STEPS) {
      const frame = {};
      let live = 0;
      for (const [k, g] of gens) {
        const r = g.next();
        if (!r.done) { frame[k] = r.value; live++; }
      }
      if (!live) break;
      out.push(t.merge(frame, out.length));
    }
    return out;
  }

  loadTrace(name) {
    this.stop();
    this.trace = name;
    this.steps = this.materialise(name);
    this.i = 0;
    this.layoutStage();
    this.render();
  }

  /**
   * THE LAYOUT PASS. Resolves every panel's size AND its column ONCE -- on load
   * and on a real window resize -- then holds. This is the master invariant:
   * nothing on screen moves because a step advanced. See AUTHORING.md "Panels
   * flow across both columns", "The structure region has a ceiling",
   * "Bookkeeping panels get a 2-row floor".
   *
   * Resolution order (this is what makes the ceiling bite):
   *   1. Bookkeeping panels (callstack, stream, compact strips) size to content
   *      with a 2-row FLOOR so none collapses to a sliver.
   *   2. The structure region (the CELLS/NODES panels showing the data structure)
   *      takes what it needs up to a CEILING of half the stage height, its panes
   *      side by side; a pane that overflows scrolls and follows its active cell.
   *   3. The code panel takes a 15-line FLOOR in the left column.
   *   4. Any leftover slack goes to the CODE panel -- the only panel that always
   *      has more listing it could usefully show.
   *
   * Placement: the code panel anchors the top of the LEFT column; the structure
   * region sits at the top of the RIGHT column; bookkeeping panels flow down the
   * right column and the balancing overflow continues beneath the code panel in
   * the left, keeping declaration (reading) order within each column.
   */
  layoutStage() {
    const cs = getComputedStyle(this.root);
    const gap     = parseFloat(cs.getPropertyValue('--gap')) || 14;
    const lineH   = parseFloat(cs.getPropertyValue('--code-line-h')) || 20.6;
    const floorL  = parseFloat(cs.getPropertyValue('--code-lines')) || 15;
    const bodyPad = parseFloat(cs.getPropertyValue('--body-pad')) || 22;
    const BORDER  = 2;                          // a panel's 1px top + bottom border

    const items     = [...this.panels.values()];
    const code      = items.find(p => p.kind === 'code');
    const structure = items.filter(p => p.kind === 'structure');
    const book      = items.filter(p => p.kind === 'book');

    const H = this._availableStageHeight();
    const stageW = this.stage.clientWidth;

    // Reserve each panel's per-step MAXIMUM content HEIGHT and its natural WIDTH,
    // so neither changes as steps advance (the master invariant, both axes). The
    // natural width is read with the panel forced to `max-content` -- as wide as
    // the content wants, with nothing wrapping.
    const measure = p => {
      const body = p.el.querySelector('.pac-panel-body');
      body.style.minHeight = ''; body.style.height = ''; p.el.style.width = '';
      const codeEl = body.querySelector('.pac-code');
      if (codeEl) codeEl.style.maxHeight = '';
      const id = p.spec.id ?? p.spec.type;
      let mH = 0, mW = 0;
      for (const step of this.steps) {
        p.ctx.anchors.clear();
        p.el.style.width = 'max-content';
        p.renderer.render(body, step.panels?.[id], p.ctx, { lang: this.lang, step });
        mW = Math.max(mW, p.el.offsetWidth);
        mH = Math.max(mH, this._panelContentH(p, body));
      }
      p.el.style.width = '';
      p.headerH  = p.el.querySelector('.pac-panel-head').offsetHeight;
      p.contentH = mH;
      p.contentW = mW;
    };
    for (const p of [...structure, ...book]) measure(p);
    if (code) code.headerH = code.el.querySelector('.pac-panel-head').offsetHeight;

    // The code panel's WIDEST line (across every language tab) is its minimum
    // width -- a long line must never wrap or scroll horizontally (rule 4). While
    // it is rendered, capture the ACTUAL rendered line height: font-size x
    // line-height resolves to a sub-pixel value (12.5 x 1.65 = 20.625) that the
    // --code-line-h token (20.6) only approximates, and that 0.025px-per-line
    // drift is exactly what clips the last line once the panel is a dozen lines
    // tall. Sizing off the measured height keeps the viewport an INTEGER number of
    // whole lines, so no line is ever a sliver (AUTHORING.md "whole lines only").
    let codeMinW = 0, codeLineH = lineH;
    if (code) {
      const codeEl = code.el.querySelector('.pac-panel-body .pac-code');
      for (const lang of Object.keys(code.spec.listings ?? {})) {
        code.ctx.anchors.clear();
        code.renderer.render(code.el.querySelector('.pac-panel-body'), { line: null }, code.ctx, { lang, step: this.steps[0] });
        if (codeEl) codeMinW = Math.max(codeMinW, codeEl.scrollWidth);
      }
      codeMinW += bodyPad + BORDER;
      const lineEl = codeEl?.querySelector('.pac-code-line');
      if (lineEl) codeLineH = lineEl.getBoundingClientRect().height || lineH;
    }

    const outer = (p, bodyH) => p.headerH + bodyH + BORDER;
    const sum   = a => a.reduce((s, h) => s + h, 0);

    // Structure region orientation (rule 5): panes sit side by side unless that
    // would leave the code panel narrower than its widest line; then they stack
    // vertically. Resolved once, here -- it never changes as steps advance.
    const structW = structure.length ? sum(structure.map(p => p.contentW)) + gap * (structure.length - 1) : 0;
    const stacked = structure.length > 1 && (structW + gap + codeMinW > stageW);

    // (2) structure region -- each pane capped at half the stage height.
    const ceiling = Math.max(140, Math.floor(H / 2));
    const paneH   = p => Math.min(outer(p, p.contentH), ceiling);
    let regionH = 0;
    if (structure.length) {
      regionH = stacked
        ? sum(structure.map(paneH)) + gap * (structure.length - 1)
        : Math.max(...structure.map(paneH));
    }

    // (1) bookkeeping floors -- 2 content rows minimum.
    const bookFloor = 2 * lineH + bodyPad;
    for (const p of book) p.outerH = outer(p, Math.max(p.contentH, bookFloor));

    // (3) code 15-line floor -- an INTEGER 15 whole lines, measured (ceil so the
    // last line's sub-pixel remainder is inside the box, never clipped).
    const codeFloor = code ? outer(code, Math.ceil(floorL * codeLineH) + bodyPad) : 0;

    // Balance HEIGHT: right column = [region, book[0..k)], left = [code,
    // book[k..)]. Pick the split k (keeping declaration order) that minimises the
    // taller column, so the stage is as short as the content allows.
    const bh = book.map(p => p.outerH);
    const colH = (base, arr, hasBase) => {
      const n = (hasBase ? 1 : 0) + arr.length;
      return base + sum(arr) + gap * Math.max(0, n - 1);
    };
    let bestK = 0, bestStage = Infinity;
    for (let k = 0; k <= book.length; k++) {
      const right = colH(regionH, bh.slice(0, k), regionH > 0);
      const left  = colH(codeFloor, bh.slice(k), !!code);
      const stage = Math.max(right, left);
      if (stage < bestStage) { bestStage = stage; bestK = k; }
    }
    const stageH = Math.min(bestStage, H);

    // Place bookkeeping panels into their columns (structure stays in the region,
    // code stays at the top of the left column).
    for (const p of book.slice(0, bestK)) this.colRight.appendChild(p.el);
    for (const p of book.slice(bestK))    this.colLeft.appendChild(p.el);

    // Bottom alignment. The stage is a fixed box and BOTH columns fill it, so the
    // shorter column would otherwise leave a ragged gap below its last panel. The
    // left column already fills via the code panel (below); the right column fills
    // the same way through its structure region -- it grows to swallow the slack
    // below the last right-column panel, so its bottom edge lands on the left
    // column's (AUTHORING.md "Bottom alignment"). Capped at the region ceiling, so
    // structure still never dominates; any residual is left as space. Side-by-side
    // regions only -- a stacked (narrow) region is its own vertical flow.
    let regionFillH = regionH;
    if (structure.length && !stacked) {
      const rightContent = colH(regionH, bh.slice(0, bestK), regionH > 0);
      const deficit = stageH - rightContent;
      if (deficit > 0) regionFillH = Math.min(regionH + deficit, ceiling);
    }

    // ---- apply HEIGHTS ----
    this.stage.style.height = `${Math.round(stageH)}px`;
    if (structure.length) {
      this.structureRegion.toggleAttribute('data-stacked', stacked);
      if (stacked) {
        this.structureRegion.style.height = '';
        for (const p of structure)
          p.el.querySelector('.pac-panel-body').style.minHeight = `${Math.round(paneH(p) - p.headerH - BORDER)}px`;
      } else {
        this.structureRegion.style.height = `${Math.round(regionFillH)}px`;
        for (const p of structure) p.el.querySelector('.pac-panel-body').style.minHeight = '';
      }
    }
    for (const p of book) {
      const body = p.el.querySelector('.pac-panel-body');
      const bodyH = `${Math.round(p.outerH - p.headerH - BORDER)}px`;
      // The CALLSTACK is capped: a FIXED height (with flex:none, or flex-basis:0
      // would ignore it) so a stack past the ceiling scrolls rather than growing
      // the panel. Other bookkeeping has a bounded maximum, so a min-height
      // reservation is enough.
      if (p.spec.type === 'callstack') { body.style.height = bodyH; body.style.flex = 'none'; body.style.minHeight = ''; }
      else { body.style.minHeight = bodyH; body.style.height = ''; body.style.flex = ''; }
    }

    // ---- apply WIDTHS (rules 1-3): every non-code panel takes its own natural
    // width and left-aligns. CODE and STREAM are the exceptions -- output has no
    // predictable width, so like the code it FILLS its column (via CSS), matching
    // the code's width when it sits below it. ----
    for (const p of [...structure, ...book]) {
      if (p.spec.type === 'stream') { p.el.style.width = ''; continue; }
      p.el.style.width = `${Math.round(p.contentW)}px`;
    }

    // (4) code absorbs the left column's leftover slack -- but only up to the
    // number of lines it actually HAS. It shows as many whole lines as fit the
    // available height, floored at 15 (the Canvas minimum) and never more than the
    // listing's length, so a short listing does not stretch into a tall panel of
    // empty rows. Any slack beyond that stays as empty column space below it.
    if (code) {
      const leftBook = book.slice(bestK);
      const leftUsed = sum(leftBook.map(p => p.outerH)) + gap * leftBook.length;
      const avail   = Math.max(codeFloor, Math.round(stageH - leftUsed));
      const maxLen  = Math.max(1, ...Object.values(code.spec.listings ?? {}).map(l => l.length));
      // The LISTING shows as many WHOLE lines as fit `avail`, floored at 15 and
      // capped at the listing length -- a short listing never gains empty rows
      // (AUTHORING.md "the code never stretches into blank rows"). viewH is that
      // whole-line height (ceil so no line is a sliver -- item "whole lines only").
      const fit     = Math.floor((avail - code.headerH - BORDER - bodyPad) / codeLineH);
      const lines   = Math.max(floorL, Math.min(maxLen, fit));
      const viewH   = Math.ceil(lines * codeLineH);
      const body    = code.el.querySelector('.pac-panel-body');
      // The BODY fills the left column so its bottom lines up with the right
      // column's (AUTHORING.md "Bottom alignment") -- the mirror of the structure
      // region filling the right column. The listing is clipped to viewH (whole
      // lines); any sub-line remainder falls as blank space BELOW the listing,
      // never a clipped line and never a ragged gap below the panel. When the code
      // is the taller column (avail == its floor) there is no slack and the body
      // is exactly the whole-line height -- so a small stack does not inflate it.
      const bodyH   = Math.max(viewH + bodyPad, avail - code.headerH - BORDER);
      body.style.height = `${Math.round(bodyH)}px`;
      const codeEl = body.querySelector('.pac-code');
      if (codeEl) codeEl.style.maxHeight = `${viewH}px`;
    }
  }

  /** Height the stage may occupy: the root's inner height minus the fixed footer
   *  chrome (title, subtitle, open-window link, controls, narration, note) and
   *  the stage's own margins. The ceiling for the layout; the stage usually hugs
   *  a shorter balanced height and only reaches this on a short viewport. */
  _availableStageHeight() {
    const root = this.root, rp = getComputedStyle(root);
    let avail = root.clientHeight - parseFloat(rp.paddingTop) - parseFloat(rp.paddingBottom);
    for (const el of root.children) {
      if (el === this.stage) continue;
      const c = getComputedStyle(el);
      if (c.display === 'none') continue;
      avail -= el.offsetHeight + parseFloat(c.marginTop) + parseFloat(c.marginBottom);
    }
    const sm = getComputedStyle(this.stage);
    avail -= parseFloat(sm.marginTop) + parseFloat(sm.marginBottom);
    return Math.max(200, avail);
  }

  /** The content height to RESERVE for a panel this step. Every panel reserves its
   *  full content -- EXCEPT the CALLSTACK, whose depth has no natural upper bound
   *  (a deep recursion could be ten frames), so it is capped at a ceiling of
   *  CALLSTACK_CEILING frames and scrolls to the newest ones instead (AUTHORING.md
   *  "CALLSTACK is a capped, scrolling panel"). Below the ceiling it sizes to the
   *  actual depth; there are never empty frame slots. */
  _panelContentH(p, body) {
    if (p.spec.type === 'callstack') {
      const frames = [...body.querySelectorAll('.pac-frame')];
      if (frames.length > CALLSTACK_CEILING) {
        const padB = parseFloat(getComputedStyle(body).paddingBottom) || 11;
        const top  = body.getBoundingClientRect().top;
        return Math.round(frames[CALLSTACK_CEILING - 1].getBoundingClientRect().bottom - top + padB);
      }
    }
    return body.scrollHeight;
  }

  /** A structure pane that overflows its capped region -- or a CALLSTACK past its
   *  frame ceiling -- scrolls to keep its ACTIVE element in view: the cell being
   *  modified, or the running (top) frame. The same "follow the highlight" the
   *  CODE panel has, so a student never hunts for it. A panel that fits does
   *  nothing. */
  _followActive() {
    for (const [, p] of this.panels) {
      if (p.kind !== 'structure' && p.spec.type !== 'callstack') continue;
      const body = p.el.querySelector('.pac-panel-body');
      if (!body || body.scrollHeight <= body.clientHeight + 1) continue;
      const target = body.querySelector('[data-role="active"], [data-role="compared"], [data-active="true"], .pac-marker');
      if (!target) continue;
      const br = body.getBoundingClientRect(), tr = target.getBoundingClientRect();
      const offset = tr.top - br.top, margin = 24;
      if (offset < margin || offset > body.clientHeight - margin - tr.height) {
        body.scrollTop += offset - (body.clientHeight - tr.height) / 2;
      }
    }
  }

  /* ---------- derived metrics ---------- */

  metrics(upTo = this.i) {
    const counts = {};
    for (let k = 0; k <= upTo && k < this.steps.length; k++) {
      const tag = this.steps[k].tag;
      if (tag) counts[tag] = (counts[tag] ?? 0) + 1;
    }
    return counts;
  }

  /* ---------- stepping ---------- */

  get step()   { return this.steps[this.i] ?? {}; }
  get atEnd()  { return this.i >= this.steps.length - 1; }

  next() {
    if (this.atEnd) return this.stop();
    this.i++;
    this.render();
  }

  prev() {
    this.stop();
    if (this.i > 0) { this.i--; this.render(); }
  }

  reset() {
    this.stop();
    this.i = 0;
    this.render();
  }

  play() {
    if (this.timer || this.atEnd) return;
    this.timer = setInterval(() => this.next(), AUTOPLAY_MS);
    this.render();
  }

  /** The single clearInterval in the codebase. Seven of the original
   *  thirteen files never called it at all. */
  stop() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.render();
  }

  /* ---------- construction ---------- */

  _build() {
    const s = this.spec;
    this.root.className = 'pac-root';
    this.root.dataset.profile = s.profile ?? 'standard';

    this.root.innerHTML = `
      <h1 class="pac-title"></h1>
      <p class="pac-sub"></p>
      <a class="pac-openwin" target="_blank" rel="noopener" hidden></a>
      <div class="pac-stage"></div>
      <div class="pac-controls">
        <button class="pac-btn" data-act="prev">&larr; Back</button>
        <button class="pac-btn pac-btn-primary" data-act="next">Next Step &rarr;</button>
        <button class="pac-btn" data-act="play">Play</button>
        <button class="pac-btn" data-act="reset">Reset</button>
        <span class="pac-metrics"></span>
        <span class="pac-progress"></span>
      </div>
      <div class="pac-narrate"></div>
      <div class="pac-note pac-note-empty" role="note"></div>`;

    this.root.querySelector('.pac-title').textContent = s.title ?? '';
    this.root.querySelector('.pac-sub').textContent = s.subtitle ?? '';
    this._buildOpenWindowLink();
    this.stage    = this.root.querySelector('.pac-stage');
    this.narrate  = this.root.querySelector('.pac-narrate');
    this.noteBox  = this.root.querySelector('.pac-note');
    this.metricsEl= this.root.querySelector('.pac-metrics');
    this.progress = this.root.querySelector('.pac-progress');

    // Two columns that panels FLOW across (AUTHORING.md "Panels flow across both
    // columns"). The code panel anchors the top of the LEFT column at its 15-line
    // floor; structure panels sit side by side in a height-capped region at the
    // top of the RIGHT column; bookkeeping panels flow down the right column and
    // the balancing overflow continues beneath the code panel in the left.
    // layoutStage() measures and places everything ONCE (the master invariant).
    // `columns`, `stageRows`, `tall`, and `full` are legacy grid hints, now
    // ignored -- placement is derived from each panel's kind.
    this.colLeft  = document.createElement('div');
    this.colRight = document.createElement('div');
    this.colLeft.className  = 'pac-col'; this.colLeft.dataset.side  = 'left';
    this.colRight.className = 'pac-col'; this.colRight.dataset.side = 'right';
    this.structureRegion = document.createElement('div');
    this.structureRegion.className = 'pac-structure';
    this.colRight.appendChild(this.structureRegion);
    this.stage.append(this.colLeft, this.colRight);

    // Beginner profile is enforced here, not left to authorial restraint.
    const panels = (s.panels ?? []).slice();
    if (s.profile === 'beginner' && panels.length > 3) {
      console.warn(`beginner profile caps panels at 3; dropping ${panels.length - 3}`);
      panels.length = 3;
    }
    // `standard` has a SOFT ceiling of 6 (AUTHORING.md "Panel count"): not
    // enforced, but a 7th panel should be justified -- try merging related state
    // into one panel or cutting one that isn't earning its place first.
    if ((s.profile ?? 'standard') === 'standard' && panels.length > 6) {
      console.warn(`standard profile: ${panels.length} panels exceeds the soft ceiling of 6 — consider merging or cutting a panel`);
    }

    for (const p of panels) {
      const el = document.createElement('section');
      el.className = 'pac-panel';
      el.dataset.type = p.type;
      if (p.compact) el.dataset.compact = '';
      const kind = panelKind(p);
      el.dataset.kind = kind;
      // Default DISPLAY title per renderer when a panel gives none. The internal
      // renderer name stays CALLSTACK; only the student-facing label reads
      // "Function calls" (so it is not confused with an actual stack data
      // structure in the stacks animations).
      const title = p.title ?? DEFAULT_TITLES[p.type] ?? p.type;
      el.innerHTML = `<div class="pac-panel-head"><span>${title}</span>
                        <span class="pac-panel-tools"></span></div>
                      <div class="pac-panel-body"></div>`;
      // Initial column by kind: code -> left, structure -> the shared region,
      // book -> right. layoutStage() moves the balancing overflow to the left.
      (kind === 'code' ? this.colLeft
        : kind === 'structure' ? this.structureRegion
        : this.colRight).appendChild(el);
      const r = RENDERERS[p.type];
      if (!r) throw new Error(`unknown panel type "${p.type}"`);
      const ctx = {
        engine: this,
        spec: p,
        anchors: new Map(),
        anchor: (name, node) => ctx.anchors.set(name, node),
      };
      r.mount?.(el.querySelector('.pac-panel-body'), p, ctx,
                el.querySelector('.pac-panel-tools'));
      this.panels.set(p.id ?? p.type, { spec: p, el, renderer: r, ctx, kind });
    }

    this.overlay = new Overlay(this.stage);

    this.root.querySelector('.pac-controls').addEventListener('click', e => {
      const act = e.target.dataset?.act;
      if (!act) return;
      if (act === 'play') this.timer ? this.stop() : this.play();
      else this[act]();
    });

    // Back-stepping via keyboard, because beginners miss steps.
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') this.next();
      if (e.key === 'ArrowLeft')  this.prev();
    });

    // The layout follows the VIEWPORT: re-resolve on a real window resize
    // (debounced), never on a content change. steps/frames/tabs leave it constant.
    window.addEventListener('resize', () => {
      clearTimeout(this._fitTimer);
      this._fitTimer = setTimeout(() => { this.layoutStage(); this.render(); }, 120);
    });
  }

  /**
   * The open-in-own-window escape hatch (AUTHORING.md "Open-in-own-window
   * link"). Canvas steals ~300px of chrome before an embedded animation even
   * begins; a self-link with target="_blank" opens the same page in a new tab
   * where it gets the whole window. It is iframe-aware: a lifeline shown
   * prominently when embedded, silent when the animation is already
   * full-window (standalone). Built into the engine, so every animation
   * inherits it -- no per-animation opt-in.
   */
  _buildOpenWindowLink() {
    const link = this.root.querySelector('.pac-openwin');
    if (!link) return;
    // The iframe's own URL, which is exactly what we want to open full-window.
    link.href = window.location.href;
    // window.self !== window.top is the embedding test. The identity comparison
    // is same-origin-safe: it never touches a cross-origin property, so it
    // cannot throw even when Canvas serves the page from another origin.
    const embedded = window.self !== window.top;
    if (embedded) {
      link.textContent = '⛶ Scrolling to see it all? Open in its own window';
      link.hidden = false;
    } else {
      // Already full-window -- the hint would just be noise, so stay silent.
      link.hidden = true;
    }
  }

  setLanguage(lang) { this.lang = lang; this.render(); }

  /* ---------- render ---------- */

  render() {
    const step = this.step;

    for (const [id, p] of this.panels) {
      let data = step.panels?.[id];
      // A step carries its active source line at the TOP level (`step.line`),
      // not inside `panels.<codeId>` -- one line drives every code panel and
      // every language variant. Thread it in so the highlight actually moves.
      // Supports a plain number or a per-language {pseudo, java, cpp} object;
      // a null/absent line means "highlight nothing" (intro, note, final).
      // `dangerLine` rides alongside: when set, the highlighted line is tinted
      // red instead of blue -- the code itself is the memory-integrity culprit.
      // `parked` also rides alongside: the call-site line of every caller still
      // on the stack, dimmed so the student keeps sight of where the call came
      // from (AUTHORING.md "Line highlight -- active line vs. parked caller
      // lines"). Bright = running now, dim = suspended.
      //
      // Race mode has TWO code panels that highlight DIFFERENT lines on the same
      // step (and one may highlight nothing while it idles). So a code panel
      // prefers a `line` supplied inside its own panel data (`panels.<codeId>`)
      // and only falls back to the single top-level `step.line` when it declares
      // none -- keeping the single-listing animations unchanged.
      if (p.spec.type === 'code') {
        const pLine = (data && 'line' in data) ? data.line : step.line;
        data = { ...data, line: pLine, dangerLine: step.dangerLine, parked: step.parked };
      }
      p.ctx.anchors.clear();
      p.renderer.render(p.el.querySelector('.pac-panel-body'),
                        data, p.ctx, { lang: this.lang, step });
    }

    this._followActive();
    this.overlay.draw(step.arrows ?? [], this.panels);

    // Narration and notes are both SEGMENTED content: a plain string, or an
    // array of segments where {danger:true, text} renders a leading red warning
    // triangle in --error. renderSegments handles both and returns whether any
    // content was written.
    renderSegments(this.narrate, step.narrate);

    // The teaching-note box holds non-execution commentary (setup, a common-
    // mistake aside, a post-watch challenge). A note attaches to a step and
    // shows only while that step is current; on steps without one the box
    // collapses to zero height (pac-note-empty -> display:none) and the layout
    // reflows. See AUTHORING.md "Steps vs. notes".
    const hasNote = renderSegments(this.noteBox, step.note);
    this.noteBox.classList.toggle('pac-note-empty', !hasNote);

    // Pulse narration (and a present note) only when the step index actually
    // changes, so a new explanation catches the eye but pausing/stopping in
    // place does not reflash. A note appearing should feel like the animation
    // saying "pay attention to this."
    if (this.i !== this._flashedAt) {
      this._flashedAt = this.i;
      flash(this.narrate, 'pac-narrate-flash');
      if (hasNote) flash(this.noteBox, 'pac-note-flash');
    }
    this.progress.textContent = `${Math.min(this.i + 1, this.steps.length)} / ${this.steps.length}`;

    // Metrics are HIDDEN BY DEFAULT (see AUTHORING.md "Metrics readout").
    // The tag-derived counter is an internal mechanism; the raw tag name
    // (`assign`) is engine jargon, not student-facing. An animation opts in
    // via `spec.metrics`, a map from tag -> plain student-facing label. Only
    // listed tags render, and always with the label, never the raw tag. No
    // opt-in -> no readout (an insertion or single walk-through shows none).
    const labels = this.spec.metrics ?? {};
    const counts = this.metrics();
    this.metricsEl.innerHTML = Object.entries(labels)
      .filter(([tag]) => counts[tag] != null)
      .map(([tag, label]) => `${label} <b>${counts[tag]}</b>`).join('');

    this.root.querySelector('[data-act="prev"]').disabled = this.i === 0;
    this.root.querySelector('[data-act="next"]').disabled = this.atEnd;
    this.root.querySelector('[data-act="play"]').textContent = this.timer ? 'Pause' : 'Play';
    this.root.querySelector('[data-act="play"]').disabled = this.atEnd;
  }
}

function take(gen, max) {
  const out = [];
  for (const v of gen) { out.push(v); if (out.length >= max) break; }
  return out;
}

/**
 * How a panel is placed and sized by layoutStage (AUTHORING.md "Panels flow
 * across both columns"):
 *   - 'code'      -- the listing; anchors the top of the left column, 15-line floor.
 *   - 'structure' -- a CELLS/NODES/CHART view of the data structure being watched;
 *                    shares the height-capped region, side by side, follows active.
 *   - 'book'      -- bookkeeping (callstack, stream, a compact strip): known-max
 *                    content, 2-row floor, flows and balances across the columns.
 * A panel may force its class with `structure: true|false`; otherwise a non-compact
 * CELLS/NODES/CHART panel is structure and everything else is bookkeeping.
 */
function panelKind(p) {
  if (p.type === 'code') return 'code';
  if (p.structure === true)  return 'structure';
  if (p.structure === false) return 'book';
  if (p.type === 'callstack' || p.type === 'stream' || p.compact) return 'book';
  // NODES/CHART draw the whole structure and default to structure; a CELLS panel
  // is more often an auxiliary strip (pointer variables, an invariant readout)
  // than the structure itself, so it defaults to bookkeeping and opts in with
  // `structure: true` (the array/stack it IS the structure of).
  if (p.type === 'nodes' || p.type === 'chart') return 'structure';
  return 'book';
}

/** Restart a one-shot CSS pulse: drop the class, force reflow, re-add. */
function flash(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;               // force reflow so the animation restarts
  el.classList.add(cls);
}

/* The red warning triangle for a memory-integrity violation. Project-wide,
 * cross-course convention -- red ⚠ always means "memory just went wrong". */
const DANGER_MARK = '⚠';

/**
 * Render segmented content (narration or a note) into `el`.
 *
 * `content` is either a plain string (the common case -- nearly every step),
 * or an array of segments. A segment is a string, or an object; an object with
 * `danger: true` renders a leading red ⚠ and the danger-red colour (--error),
 * naming a memory-integrity violation. Returns true iff anything was written,
 * so the caller can collapse an empty note box.
 */
function renderSegments(el, content) {
  el.textContent = '';
  if (content == null || content === '') return false;
  const segs = Array.isArray(content) ? content : [content];
  let wrote = false;
  for (const seg of segs) {
    if (seg == null || seg === '') continue;
    if (typeof seg === 'string') {
      el.appendChild(document.createTextNode(seg));
      wrote = true;
    } else if (seg.danger) {
      const span = document.createElement('span');
      span.className = 'pac-danger';
      span.textContent = `${DANGER_MARK} ${seg.text ?? ''}`;
      el.appendChild(span);
      wrote = true;
    } else if (typeof seg.text === 'string') {
      el.appendChild(document.createTextNode(seg.text));
      wrote = true;
    }
  }
  return wrote;
}

/** Mount an animation from its content module. */
function mountAnimation(spec, el = document.getElementById('pac')) {
  return new Engine(el, spec);
}

/* ds — A3 "Checking parentheses with a stack"
 *
 * A parenthesis scanner, built on a stack, in one continuous trace driven by
 * main() over three short expressions -- each isolating one error:
 *
 *   scan("a)(b")  -> TOO_MANY_RIGHT  (a stray ')' while the stack is empty)
 *   scan("[a)")   -> MISMATCH        (popped '[' is not the type ')' closes)
 *   scan("((a)")  -> TOO_MANY_LEFT   (a '(' left on the stack when the loop ends)
 *
 * The lesson is error DETECTION, not evaluation. The payoff is the third scan:
 * the loop ends with error still NONE, and the error is found only by looking at
 * the stack AFTER the loop -- the one error no in-loop event can catch.
 *
 * The stack starts EMPTY: step 0 is four empty cells, stack_ix at -1 with its
 * marker parked below cell [0]. push and pop are STEPPED INTO everywhere (never
 * summarized) -- every call shows its body (the call line, then lines 2-3 for
 * push or 6-7 for pop), with a push/pop frame on Function calls and BOTH callers
 * (main and scan) dimmed while it runs. Five stepped-into calls in all.
 *
 * The NEW capability this animation introduced is the vertical CELLS `column`
 * (the stack): cell [0] at the bottom, growing upward, index labels [0]..[3] in a
 * fixed band on the RIGHT, and the stack_ix marker on the LEFT (caret ▶), parking
 * BELOW cell [0] at the -1 sentinel. The expression and the stack are the two
 * structure panels; the engine places them side by side (structure region).
 *
 * A stale cell is HEALTHY: after scan 2 pops the '[', it stays greyed in the
 * array until scan 3 writes over it. Nothing corrupts memory; every error is a
 * syntax error in the student's input. NO memory-danger marker anywhere. WATCH
 * only: one trace, no gates; the insight is all narration and notes.
 *
 * matches() is NEVER stepped into -- its result is narrated. Line 13's three
 * initialisations run as ONE step. Lines 16 and 21 are isFull and isEmpty,
 * inlined; the narration names them as such (the lecture's vocabulary). Only two
 * symbol types, ( ) and [ ]; the { } case and the TOO_DEEP error are left to the
 * post-watch challenge. */

const MAX = 4;

/* One listing, three ds languages, line-aligned to a single 35-line grid, so
 * `line` is a plain number that resolves the same in every language. */
const LISTINGS = {
  pseudo: [
    'push(c)',                                       //  1
    '    stack_ix = stack_ix + 1',                   //  2
    '    stack[stack_ix] = c',                       //  3
    '',                                              //  4
    'pop()',                                         //  5
    '    popped = stack[stack_ix]',                  //  6
    '    stack_ix = stack_ix - 1',                   //  7
    '',                                              //  8
    'matches(open, close)',                          //  9
    '    return open and close are the same type',   // 10
    '',                                              // 11
    'scan(expr)',                                    // 12
    '    ix = 0,  stack_ix = -1,  error = NONE',     // 13
    '    while ix < length(expr) and error = NONE',  // 14
    '        if expr[ix] is one of  (  [',           // 15
    '            if stack_ix = MAX - 1',             // 16
    '                error = TOO_DEEP',              // 17
    '            else',                              // 18
    '                push(expr[ix])',                // 19
    '        else if expr[ix] is one of  )  ]',      // 20
    '            if stack_ix = -1',                  // 21
    '                error = TOO_MANY_RIGHT',        // 22
    '            else',                              // 23
    '                pop()',                         // 24
    '                if not matches(popped, expr[ix])', // 25
    '                    error = MISMATCH',          // 26
    '        ix = ix + 1',                           // 27
    '    if error = NONE and stack_ix > -1',         // 28
    '        error = TOO_MANY_LEFT',                 // 29
    '    report(error)',                             // 30
    '',                                              // 31
    'main()',                                        // 32
    '    scan("a)(b")',                              // 33
    '    scan("[a)")',                               // 34
    '    scan("((a)")',                              // 35
  ],
  java: [
    'void push(char c) {',                           //  1
    '    stack_ix = stack_ix + 1;',                  //  2
    '    stack[stack_ix] = c; }',                    //  3
    '',                                              //  4
    'char pop() {',                                  //  5
    '    popped = stack[stack_ix];',                 //  6
    '    stack_ix = stack_ix - 1; }',                //  7

    'boolean matches(char open, char close) {',      //  9
    '    return sameType(open, close); }',           // 10
