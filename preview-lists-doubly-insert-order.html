<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lists-doubly-insert-order — preview</title>
<style>/* pac-animations — design system
   15 tokens replacing the 188 distinct color values found across the
   original 25 animation files. */

:root {
  /* surfaces */
  --bg:            #0f1117;
  --panel:         #171a23;
  --panel-header:  #1e222d;
  --border:        #2b3040;

  /* text */
  --text:          #d8dce6;
  --text-dim:      #8b93a7;

  /* accents — one blue, not four */
  --accent:        #4a90e2;
  --accent-soft:   rgba(74, 144, 226, 0.18);

  /* semantic state */
  --ok:            #4caf82;
  --warn:          #e0a33a;
  --error:         #e2564a;
  --highlight:     #d4a13c;

  /* structural */
  --radius:        6px;
  --gap:           14px;
  --mono:          "SF Mono", "Cascadia Code", Consolas, monospace;

  /* ---- stable layout (see AUTHORING.md "Stable layout") ----
   * The stage (panel grid) is BOUNDED: it never grows past --stage-max-h no
   * matter how much content a panel holds. Panels scroll internally within
   * their grid cell; the controls, narration bar, and note box are pinned
   * below the stage and stay on screen at any viewport height.
   *
   * The bound is derived, not hardcoded to a resolution: start from "~15 code
   * lines visible" and the current 2-row grid, and tune these values. All
   * values below are tunable. Design target: a 1920x1080 window at 100%.
   *
   * The two grid rows are sized to their content, NOT equally: the top row
   * (code + array) gets ~15 code lines; the bottom row (call stack +
   * count/capacity) holds a shallow call stack -- main -> ADD -> INSERT is the
   * maximum, 3 frames -- and a two-value strip, so it is sized to about 2
   * call-stack frames rather than a large reserve. Both rows are FIXED, so row
   * heights stay stable across steps; a deeper stack scrolls internally instead
   * of resizing the row. */
  --code-line-h:   20.6px;   /* code font-size 12.5px x line-height 1.65 */
  --code-lines:    15;       /* code lines visible before the CODE panel scrolls */
  --panel-chrome:  54px;     /* a panel's header + body vertical padding (non-content) */
  --body-pad:      22px;     /* a panel body's vertical padding alone */
  --frame-h:       88px;     /* a representative call-stack frame (fn + ~1-2 vars) */
  --callstack-frames: 2;     /* call-stack frames shown before the pane scrolls */

  --callstack-stack-h: calc(var(--callstack-frames) * var(--frame-h) + (var(--callstack-frames) - 1) * 6px);
  --stage-row-top:     calc(var(--code-lines) * var(--code-line-h) + var(--panel-chrome));
  --stage-row-bottom:  calc(var(--callstack-stack-h) + var(--panel-chrome));
  --stage-max-h:       calc(var(--stage-row-top) + var(--stage-row-bottom) + var(--gap));

  /* ---- fixed footer heights (see AUTHORING.md "Stable layout") ----
   * The narration bar and note box are RESERVED at a constant height so their
   * content changing step-to-step (longer narration, a note appearing or
   * disappearing) never changes the height of anything below the controls. The
   * stage stays the viewport absorber -- it shrinks on a short viewport so the
   * note is never pushed off the fold -- but because the footer below it is now
   * a constant height, the stage no longer resizes step-to-step, so the
   * controls / narration / note never move as steps advance. Longer content
   * scrolls internally within these fixed boxes. Sized to the measured maxima
   * (~2-line narration, ~4-line note) with headroom; tunable. */
  --narrate-h:     72px;
  --note-h:        104px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* The whole animation is a full-viewport flex column: the stage flexes to fill
 * the space that is left after the pinned chrome (title, controls, narration,
 * note), and the stage — never the page — is what shrinks on a short viewport.
 * This is the safety net that keeps the note on screen at any viewport height. */
.pac-root {
  padding: var(--gap);
  max-width: 1200px;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow: hidden;            /* the page itself never scrolls; panels do */
}
/* Everything except the stage keeps its natural height and is always visible;
 * only the stage (below) flexes and yields space on a short viewport. */
.pac-root > *:not(.pac-stage) { flex: 0 0 auto; }

.pac-title { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
.pac-sub   { color: var(--text-dim); font-size: 13px; margin: 0 0 var(--gap); }

/* ---- open-in-own-window link (see AUTHORING.md "Open-in-own-window link") ----
 * The escape hatch every animation carries: a self-link (target="_blank") that
 * opens the page full-window, where there's no Canvas chrome. The engine shows
 * it prominently only when embedded (window.self !== window.top) and hides it
 * standalone. Colour is --warn amber-orange so it stands out from body text
 * without reading as the --error danger red; styled as a plain link (icon +
 * underline on hover) so it reads as a helpful hint, not a content warning. */
.pac-openwin {
  display: inline-block;
  margin: -6px 0 var(--gap);
  color: var(--warn);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
}
.pac-openwin:hover  { text-decoration: underline; }
.pac-openwin:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
.pac-openwin[hidden] { display: none; }

/* ---- layout: the bounded stage ----
 * A grid of panels, bounded to --stage-max-h so it never grows the page. It
 * flexes to fill the space above the pinned chrome but is capped at the bound.
 * The two rows are sized to their content (tall top for code, short bottom for
 * the shallow call stack + count/capacity strip) rather than split equally;
 * both are FIXED so panels scroll internally instead of reflowing. Any extra
 * rows (an animation with >4 panels) fall back to sharing leftover space.
 * See AUTHORING.md. */
.pac-stage {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  grid-template-rows: var(--stage-row-top) var(--stage-row-bottom);
  grid-auto-rows: minmax(0, 1fr);
  gap: var(--gap);
  position: relative;          /* anchor origin for the arrow overlay */
  flex: 1 1 auto;
  min-height: 0;               /* allow the grid to shrink below content size */
  max-height: var(--stage-max-h);
  overflow: hidden;            /* the bound is hard; panels scroll, not the stage */
}
.pac-stage[data-cols="1"] { grid-template-columns: 1fr; }
.pac-stage[data-cols="2"] { grid-template-columns: 1fr 1fr; }

/* A multi-row layout (spec.stageRows) supplies its own grid-template-rows inline
 * and opts out of the two-row bound: the stage instead fills the space above the
 * pinned footer and shrinks on a short viewport, so the note is never pushed off
 * screen. The footer (controls + narration + note) stays a constant height, so
 * this still satisfies "the controls never move as steps advance". Design target
 * 1920x1080; the open-in-own-window link is the escape hatch on very short
 * viewports. See AUTHORING.md "Stable layout". */
/* A multi-row stage is capped so a tall code column beside a short stack of
 * small panels scrolls the code (the legitimate scrolling case) rather than
 * stretching the small panels' rows apart. It still shrinks on a short viewport
 * (flex-shrink) so the note is never pushed off screen. */
.pac-stage[data-multirow] { flex: 0 1 auto; max-height: min(560px, calc(100vh - 300px)); }

/* A full-width panel spans every column -- a shared preamble above a two-column
 * comparison. It sits on its own grid row (the first `auto` row when the row
 * template leads with one). */
.pac-panel[data-full] { grid-column: 1 / -1; }

/* A tall panel occupies the whole first column, spanning every row -- e.g. a
 * code listing beside a stack of smaller panels stacked in the second column. */
.pac-panel[data-tall] { grid-column: 1; grid-row: 1 / -1; }

/* A panel that holds very little (e.g. a two-value count/capacity strip) opts
 * out of stretching to fill its tall grid cell: it top-aligns and sizes to its
 * content, so it reads as a compact strip rather than a tall box with a void.
 * See AUTHORING.md "Panels fill their grid cells; don't oversize a cell". */
.pac-panel[data-compact] { align-self: start; max-height: 100%; }

/* The CALLSTACK panel hugs its content the same way (top-aligned, no reserve
 * for the maximum depth), but its body is capped at ~2 frames: a shallow stack
 * (1-2 frames) shows with no void, and a deeper one (up to main -> ADD ->
 * INSERT) scrolls internally with the running frame kept in view. The cap keeps
 * the box from ever exceeding its (already short) grid row. See AUTHORING.md. */
.pac-panel[data-type="callstack"] { align-self: start; max-height: 100%; }
.pac-panel[data-type="callstack"] .pac-panel-body {
  max-height: calc(var(--callstack-stack-h) + var(--body-pad));
}

/* ---- panel chrome ---- */
.pac-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.pac-panel-head {
  background: var(--panel-header);
  padding: 7px 11px;
  font-size: 12px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.pac-panel-body { padding: 11px; overflow: auto; flex: 1; min-height: 0; }

/* ---- controls ---- */
.pac-controls {
  display: flex; gap: 8px; align-items: center;
  margin: var(--gap) 0; flex-wrap: wrap;
}
.pac-btn {
  background: var(--panel-header);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 14px;
  font-size: 13px;
  cursor: pointer;
}
.pac-btn:hover:not(:disabled) { border-color: var(--accent); }
.pac-btn:disabled { opacity: .38; cursor: default; }
.pac-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.pac-progress { color: var(--text-dim); font-size: 12px; margin-left: auto; }

.pac-narrate {
  background: var(--accent-soft);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px 14px 12px 16px;
  margin-top: var(--gap);
  /* Fixed height (not min-height): longer narration scrolls internally so the
   * note below never shifts and the controls above never move. */
  height: var(--narrate-h);
  overflow: auto;
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
}
/* A brief in-scheme pulse when the step changes, so a new explanation
 * actively pulls the eye instead of being missed. Retriggered per step
 * by the engine (see render()). */
@keyframes pac-narrate-flash {
  0%   { background: var(--accent-soft); box-shadow: 0 0 0 0 rgba(74, 144, 226, 0); }
  18%  { background: rgba(74, 144, 226, 0.34); box-shadow: 0 0 0 3px var(--accent-soft); }
  100% { background: var(--accent-soft); box-shadow: 0 0 0 0 rgba(74, 144, 226, 0); }
}
.pac-narrate-flash { animation: pac-narrate-flash 0.55s ease-out; }

/* ---- teaching-note box ----
 * Non-execution commentary (setup, common-mistake asides, post-watch
 * challenge). A note attaches to a step and shows only while that step is
 * current; on steps without one the box collapses to nothing (below) so the
 * layout reflows. Amber-keyed so it reads as an aside, distinct from the blue
 * narration bar. See AUTHORING.md "Steps vs. notes". */
.pac-note {
  background: rgba(212, 161, 60, 0.10);
  border: 1px solid var(--border);
  border-left: 4px solid var(--highlight);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-top: 8px;
  /* Reserved at a constant height so a note appearing or disappearing never
   * moves anything above it (the controls) -- see the footer note in :root. A
   * longer note scrolls internally rather than growing the box. */
  height: var(--note-h);
  overflow: auto;
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.55;
}
.pac-note::before {
  content: "note";
  display: block;
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--highlight);
  margin-bottom: 3px;
}
/* No note on this step: the box is rendered invisible (nothing painted -- no
 * border, background, or "note" label) but KEEPS its reserved --note-h height,
 * so a note appearing or disappearing never shifts the controls above it. A
 * note-less step therefore reads as blank space, not an empty amber box. On the
 * design viewport this simply fills space that was previously bottom slack, so
 * it costs nothing there; on a short viewport it trades stage height for the
 * guarantee that Back/Next never move (AUTHORING.md "Stable layout"). */
.pac-note-empty { visibility: hidden; }
@keyframes pac-note-flash {
  0%   { background: rgba(212, 161, 60, 0.10); box-shadow: 0 0 0 0 rgba(212, 161, 60, 0); }
  18%  { background: rgba(212, 161, 60, 0.26); box-shadow: 0 0 0 3px rgba(212, 161, 60, 0.16); }
  100% { background: rgba(212, 161, 60, 0.10); box-shadow: 0 0 0 0 rgba(212, 161, 60, 0); }
}
.pac-note-flash { animation: pac-note-flash 0.55s ease-out; }

/* ---- memory-danger marker ----
 * A red warning triangle (⚠) + --error on any narration or note segment that
 * names a memory-integrity violation. Project-wide, cross-course convention.
 * See AUTHORING.md "Memory-danger marker". */
.pac-danger { color: var(--error); font-weight: 600; }

/* ---- CODE panel ----
 * FIXED VIEWPORT of exactly --code-lines (15) lines, at all times. The body is a
 * fixed height (15 lines + its own padding) and scrolls internally beyond that,
 * so a long listing scrolls while a short one pads to the same height. The height
 * never changes between steps or language tabs. `align-self: start` pins the panel
 * to the top of its grid area (rather than stretching to fill a taller cell), so
 * the viewport is genuinely 15 lines even where the code column is tall. This is
 * the project standard -- every animation inherits it. See AUTHORING.md
 * "Stable layout" and code.js for the follow-the-highlight scrolling. */
.pac-panel[data-type="code"] { align-self: start; }
.pac-panel[data-type="code"] .pac-panel-body {
  height: calc(var(--code-lines) * var(--code-line-h) + var(--body-pad));
  flex: none;
}

.pac-lang-tabs { display: flex; gap: 4px; }
.pac-lang-tab {
  background: none; border: 1px solid transparent; color: var(--text-dim);
  font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
}
.pac-lang-tab[aria-selected="true"] {
  color: var(--text); border-color: var(--border); background: var(--panel);
}
.pac-code { font-family: var(--mono); font-size: 12.5px; line-height: 1.65; }
.pac-code-line { display: flex; padding: 0 4px; border-radius: 3px; white-space: pre; }
.pac-code-line.is-active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.pac-code-line.is-active.is-danger { background: rgba(226, 86, 74, 0.16); box-shadow: inset 2px 0 0 var(--error); color: var(--error); }
/* Parked caller line: the call site of a caller still on the stack, suspended
 * while the callee runs. The same highlight as the active line, greyed with the
 * SAME opacity token the CALLSTACK uses for its inactive (caller) frames -- not a
 * new colour. One visual language across both panels: bright = running now, dim
 * = suspended, waiting to resume. See AUTHORING.md "Line highlight — active line
 * vs. parked caller lines". */
.pac-code-line.is-parked { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); opacity: .5; }
.pac-code-num { color: var(--text-dim); width: 2.2em; text-align: right; margin-right: 12px; user-select: none; }

/* ---- STREAM panel ---- */
/* Stable layout: the STREAM panel accumulates output as steps advance. The
 * bounded stage gives it a fixed grid cell, so it scrolls internally (stream.js
 * auto-scrolls to the newest line at the bottom) rather than growing the page
 * and pushing the controls/narration/note down. The default panel body already
 * does flex:1 + overflow:auto; nothing extra is needed. See AUTHORING.md
 * "Stable layout". Any other accumulating panel type gets the same treatment. */
.pac-stream { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; }
.pac-stream-line { white-space: pre; }
.pac-stream-line.dir-in   { color: var(--warn); }
.pac-stream-line.dir-out  { color: var(--text); }
.pac-stream-line.is-new   { background: var(--accent-soft); border-radius: 3px; }
.pac-stream-cursor { color: var(--accent); animation: pac-blink 1s steps(2) infinite; }
@keyframes pac-blink { 50% { opacity: 0; } }

/* ---- CELLS panel ---- */
.pac-cells { display: flex; flex-wrap: wrap; gap: 6px; }
.pac-cells[data-render="row"] { flex-direction: column; gap: 3px; }
.pac-cell {
  border: 1px solid var(--border); border-radius: 4px;
  padding: 5px 9px; font-family: var(--mono); font-size: 12.5px;
  min-width: 40px; text-align: center; background: var(--bg);
}
.pac-cell-label { display: block; font-size: 10px; color: var(--text-dim); }
/* The value always reserves one line of height, so a cell with no value (an
 * `empty` cell) keeps the SAME dimensions as a filled one -- the X then spans a
 * full box rather than a squashed strip. */
.pac-cell-value { display: block; min-height: 1.25em; }
.pac-cell[data-role="active"]   { border-color: var(--accent); background: var(--accent-soft); }
.pac-cell[data-role="compared"] { border-color: var(--highlight); }
.pac-cell[data-role="ok"]       { border-color: var(--ok); }
.pac-cell[data-role="error"]    { border-color: var(--error); color: var(--error); }
/* empty: indeterminate storage -- an unwritten array cell OR an unassigned
 * standalone variable (one glyph for both). Same box and dimensions as a member,
 * but a DASHED dimmed border, a dim em-dash "—" value (added by the renderer),
 * and a thin, low-opacity X drawn corner to corner across the interior (an SVG
 * stretched to the cell). Together they read as "holds no meaningful value" --
 * impossible to mistake for a space character or a rendering failure, and a
 * different SHAPE from `stale`'s greyed character. (A real stored value such as
 * the -1 sentinel is NOT empty and renders normally.) */
.pac-cell[data-role="empty"] {
  border-style: dashed;
  border-color: var(--border);
  color: var(--text-dim);
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20preserveAspectRatio='none'%20viewBox='0%200%20100%20100'%3E%3Cg%20stroke='%238b93a7'%20stroke-width='2'%20stroke-opacity='0.3'%3E%3Cline%20x1='9'%20y1='9'%20x2='91'%20y2='91'/%3E%3Cline%20x1='91'%20y1='9'%20x2='9'%20y2='91'/%3E%3C/g%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 100% 100%;
}
/* stale: a cell whose value is no longer a queue member. The value is STILL
 * shown, greyed (~40%), with NO member outline -- distinct from `empty` (a cell
 * that never held anything). Blanking it would wrongly imply the program can see
 * emptiness by looking at the array; the character is still in memory, only the
 * index moved. See AUTHORING.md / panel-inventory §2 and queues-count-vs-rear. */
.pac-cell[data-role="stale"]    { opacity: .4; border-color: transparent; }

.pac-cells[data-render="row"] .pac-cell {
  display: flex; justify-content: space-between; text-align: left; min-width: 0;
}
.pac-cells[data-render="row"] .pac-cell-label { display: inline; }

/* ---- index-pointer markers (AUTHORING.md "Planned primitive — the index
 * pointer") ----
 * A labeled caret that points at an array cell and moves as its index changes --
 * the array-world analog of the linked-list pointer arrow. When a `box` CELLS
 * panel carries `markers`, each cell is rendered as a COLUMN: the box, an index
 * label beneath it, then a marker track. A marker's caret sits under the cell at
 * its index, its label below the caret; two markers on the SAME cell render side
 * by side (flex row) rather than overlapping. All markers are solid/stored --
 * there is no "derived" marker style. */
.pac-cells[data-marked] { align-items: start; gap: 8px; }
/* Columns are wide enough that TWO labelled markers (front + rear on the same
 * cell) sit side by side without overlapping each other or the neighbouring
 * cells' labels. */
.pac-cell-col { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; }
.pac-cell-col .pac-cell { min-width: 44px; padding: 4px 9px; }
/* The row's name (e.g. "contents"), once at the left, aligned with the cell
 * boxes so it reads as the array's label. */
.pac-cells-name {
  align-self: start; margin-top: 6px; margin-right: 2px;
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
}
/* Bracketed index labels: [0] [1] … mark position as an INDEX, not a value. */
.pac-cell-index { font-size: 10.5px; color: var(--text-dim); font-family: var(--mono); }
.pac-cell-markers {
  display: flex; justify-content: center; gap: 6px;
  margin-top: 2px; white-space: nowrap;
}
.pac-marker { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.pac-marker-caret { color: var(--accent); font-size: 11px; }
.pac-marker-label {
  font-family: var(--mono); font-size: 10.5px; color: var(--accent); font-weight: 600;
}

/* Parked markers (index < 0): a cell column to the left of cell [0] whose box and
 * index bands are INVISIBLE (they only reserve height), so its marker track lines
 * up with every cell's marker track. The markers are dimmed so they read as
 * "pointing at nothing yet" rather than missing. */
.pac-cell-parked { min-width: auto; margin-right: 2px; }
.pac-cell-parked .pac-cell { min-width: 0; }
.pac-cell-parked .pac-cell,
.pac-cell-parked .pac-cell-index { visibility: hidden; }
.pac-cell-parked .pac-marker { opacity: .5; }

/* Compact strip (e.g. "A stores"): a HORIZONTAL row of uniform-width labelled
 * boxes, all visible at once with no scrollbar. Two strips compared side by side
 * stay identical in width and styling; only the differing box's value changes. */
.pac-panel[data-compact] .pac-cells[data-render="box"] { gap: 8px; }
.pac-panel[data-compact] .pac-cells[data-render="box"] .pac-cell {
  min-width: 62px; padding: 6px 10px;
}

/* ---- CALLSTACK panel ----
 * A debugger's locals/stack pane. Frames push on call / pop on return; the top
 * (running) frame is emphasized and rendered first (newest on top), callers
 * below are greyed but present, and `main` is the last (bottom) frame. Stable
 * layout: the bounded stage gives the pane a fixed grid cell, so frames
 * top-align within it and the pane scrolls internally if the stack ever grows
 * past the cell -- the running frame stays visible at the top and nothing below
 * the stage shifts. See AUTHORING.md "CALLSTACK panel" and "Stable layout". */
.pac-callstack {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;    /* frames top-align; no empty void above them */
  gap: 6px;
}
.pac-frame {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  padding: 6px 9px;
  opacity: .5;                    /* caller frames are greyed but present */
  transition: opacity .15s, border-color .15s;
}
/* The running (top) frame: full opacity + a blue outline, so "where are we
 * executing" reads at a glance and matches the highlighted code line. */
.pac-frame[data-active="true"] {
  opacity: 1;
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent-soft);
}
.pac-frame-fn {
  font-family: var(--mono); font-size: 12.5px; font-weight: 600;
  color: var(--text); margin-bottom: 5px;
}
.pac-frame-vars { display: flex; flex-direction: column; gap: 3px; }
.pac-frame-var {
  display: flex; justify-content: space-between; gap: 14px;
  font-family: var(--mono); font-size: 12px;
  padding: 2px 6px; border-radius: 3px;
  border: 1px solid transparent;
}
.pac-frame-var-name { color: var(--text-dim); }
.pac-frame-var-val  { color: var(--text); }
/* Activity channel (FILL) -- a local changing THIS step gets the blue fill, the
 * same rule as nodes/cells. */

}
.pac-frame-var[data-role="active"] .pac-frame-var-name { color: var(--text); }
/* A finished local (e.g. loop i after the loop) stays visible but greyed until
 * the function returns -- it does not vanish mid-frame. */
.pac-frame-var[data-role="done"] { opacity: .45; }
.pac-frame-empty { color: var(--text-dim); font-family: var(--mono); font-size: 11.5px; opacity: .6; }

/* ---- NODES panel ---- */

.pac-node[data-state="active"]   .pac-node-box { stroke: var(--accent); fill: var(--accent-soft); }
.pac-node[data-state="exited"]   .pac-node-box { stroke: var(--ok); }

<body><div id="pac"></div>
<script type="module">
const codePanel = (() => { /* CODE panel — listings with per-language variants.
 *
 * Step data: { line: 7 }  or  { line: {pseudo: 5, java: 7, cpp: 7} }
 *
 * Because each trace addresses its OWN listing's line numbers, the listings
 * never need to stay line-aligned with each other. That constraint would have
 * been unmaintainable across ~64 files and five years. */

function mount(body, spec, ctx, tools) {
  spec._langs = Object.keys(spec.listings);
  if (spec._langs.length > 1) {
    tools.innerHTML = `<span class="pac-lang-tabs">${spec._langs.map(l =>
      `<button class="pac-lang-tab" data-lang="${l}">${spec.labels?.[l] ?? l}</button>`
    ).join('')}</span>`;
    tools.addEventListener('click', e => {
      const l = e.target.dataset?.lang;
      if (l) ctx.engine.setLanguage(l);
    });
  }
  body.innerHTML = '<div class="pac-code"></div>';
}

function render(body, data, ctx, { lang }) {
  const spec = ctx.spec;
  const use = spec.listings[lang] ? lang : spec._langs[0];

  ctx.engine.root.querySelectorAll('.pac-lang-tab').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.lang === use)));

  const active = (data?.line && typeof data.line === 'object') ? data.line[use] : data?.line;
  // When the code line itself is the memory-integrity culprit, the step sets
  // `dangerLine: true` and the active line is tinted red instead of blue.
  const danger = !!data?.dangerLine;
  // Parked caller lines: the call site of every caller still on the stack, shown
  // DIMMED so the student keeps sight of where the call came from and where it
  // returns (AUTHORING.md "Line highlight — active line vs. parked caller lines").
  // Each entry is a plain number or a per-language {pseudo,java,cpp} object;
  // resolve to THIS language. The active line always wins if they coincide
  // (bright beats dim), so drop it from the parked set.
  const parked = new Set((data?.parked ?? [])
    .map(p => (p && typeof p === 'object') ? p[use] : p)
    .filter(n => n != null && n !== active));

  body.querySelector('.pac-code').innerHTML = spec.listings[use].map((src, k) => {
    const n = k + 1;
    const cls = n === active ? (danger ? ' is-active is-danger' : ' is-active')
              : parked.has(n) ? ' is-parked' : '';
    return `<div class="pac-code-line${cls}">` +
           `<span class="pac-code-num">${n}</span><span>${esc(src)}</span></div>`;
  }).join('');

  // Follow the highlight, with context. The CODE panel is a fixed 15-line
  // viewport (see styles.css) that scrolls internally, and this listing's main()
  // is far from ADD/DELETE, so every call and return jumps the highlight across a
  // wide gap. Rules:
  //   - the highlighted line is ALWAYS visible (never let it scroll off);
  //   - keep context around it -- when we do scroll, centre it so the student
  //     sees what comes before and after, not pinned to an edge;
  //   - do NOT scroll when it is already comfortably in view -- moving on every
  //     step is as disorienting as never moving. Only scroll when the line would
  //     otherwise sit within MARGIN lines of the top or bottom edge.
  // Only body.scrollTop changes -- the panel's height and the rest of the page
  // never move.
  const activeEl = body.querySelector('.pac-code-line.is-active');
  if (activeEl) {
    const bodyRect = body.getBoundingClientRect();
    const lineRect = activeEl.getBoundingClientRect();
    const lineH  = lineRect.height || 1;
    const offset = lineRect.top - bodyRect.top;      // active line's position in the viewport
    const viewH  = body.clientHeight;
    const MARGIN = 3 * lineH;                          // keep >= 3 lines of context each side
    if (offset < MARGIN || offset > viewH - MARGIN - lineH) {
      body.scrollTop += offset - (viewH - lineH) / 2; // bring it to roughly the middle
    }
  }
}

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

 return { mount, render }; })();
const cellsPanel = (() => { /* CELLS panel — 1D/2D grid. Absorbs arrays, sorting bars, hash buckets,
 * matrices, memory blocks, variable tables, stack frames, vtables.
 * Step data: { render: 'box'|'bar'|'row', cells: [{value,label,role,anchor}] }
 *
 * A `box` grid may also carry index-pointer markers (AUTHORING.md "Planned
 * primitive — the index pointer"):
 *   { render: 'box', cells: [...], markers: [{label, index}], rowLabel? }
 * When `markers` is present each cell is rendered as a column — the box, its
 * bracketed index label beneath it ([0], [1], …; the cell's own `label`, or its
 * position), then a marker track holding any carets whose `index` points at this
 * cell. Each marker is a caret with its variable name LABELLED directly beneath
 * it. Two markers on the same cell sit side by side, neither overlapping the
 * other nor the neighbouring cells' labels.
 *
 * A marker whose `index` is negative (e.g. -1, "points at nothing yet") is
 * PARKED to the left of cell [0], dimmed, still showing its label — so it reads
 * as "not pointing at anything," not as missing. This is a general rule.
 *
 * The bracketed index labels are a project-wide rule: `[0]` marks a cell's
 * position as an INDEX, not a value (a naked `1` under a cell holding `b` is the
 * index-vs-value confusion). An optional `rowLabel` names the row once, at the
 * left, so the array's name is present without repeating it under every cell. */

const PLACEHOLDER = '—';   // em-dash: the value of indeterminate storage

function mount(body) { body.innerHTML = '<div class="pac-cells"></div>'; }

function render(body, data, ctx) {
  const wrap = body.querySelector('.pac-cells');
  const mode = data?.render ?? 'box';
  wrap.dataset.render = mode;
  wrap.innerHTML = '';
  const cells = data?.cells ?? [];
  const max = Math.max(1, ...cells.map(c => +c.value || 0));

  // Marked mode: a `box` grid with index-pointer markers below the cell row.
  const markers = mode === 'box' && data?.markers ? data.markers : null;
  if (markers) { wrap.dataset.marked = ''; } else { delete wrap.dataset.marked; }

  // A row label names the whole row once, to the LEFT of the cells (marked mode).
  if (markers && data.rowLabel) {
    const name = document.createElement('div');
    name.className = 'pac-cells-name';
    name.textContent = data.rowLabel;
    wrap.appendChild(name);
  }

  // Parked markers (index < 0): they point at nothing yet, so they sit to the
  // left of cell [0], dimmed, still labelled. The parked zone is a full cell
  // column with an INVISIBLE box and index band above its marker track, so those
  // bands reserve the exact same heights as a real cell -- the marker lane then
  // begins at the same y here as over any cell. A marker moving from -1 onto a
  // cell therefore travels laterally only, never vertically.
  const parked = markers ? markers.filter(m => m.index == null || m.index < 0) : [];
  if (parked.length) {
    const col = document.createElement('div');
    col.className = 'pac-cell-col pac-cell-parked';
    const box = document.createElement('div');
    box.className = 'pac-cell';
    box.innerHTML = '<span class="pac-cell-value">—</span>';   // reserves the box band height
    const index = document.createElement('div');
    index.className = 'pac-cell-index';
    index.textContent = '[0]';                                 // reserves the index band height
    const track = document.createElement('div');
    track.className = 'pac-cell-markers';
    for (const m of parked) track.appendChild(marker(m));
    col.append(box, index, track);
    wrap.appendChild(col);
  }

  cells.forEach((c, idx) => {
    const cell = document.createElement('div');
    cell.className = 'pac-cell';
    if (c.role) cell.dataset.role = c.role;
    if (mode === 'bar') cell.style.height = `${20 + 70 * (+c.value / max)}px`;
    // ONE placeholder glyph for indeterminate storage — an unwritten array cell
    // and an unassigned standalone variable are the same thing. An `empty` cell
    // always shows the em-dash "—" (over the dashed box + faint X from CSS),
    // never a real value. A real stored value (including a sentinel like -1) is
    // NOT `empty` and renders normally.
    const value = c.role === 'empty' ? PLACEHOLDER : c.value;
    cell.innerHTML = (!markers && c.label ? `<span class="pac-cell-label">${esc(c.label)}</span>` : '') +
                     `<span class="pac-cell-value">${esc(value)}</span>`;
    // Anchor the value glyph, not the whole cell: for a pointer variable that
    // value is the dot, so a cross-panel arrow starts from the dot itself --
    // matching the record-field pointers in the NODES panel.
    if (c.anchor) ctx.anchor(`${ctx.spec.id}.${c.anchor}`, cell.querySelector('.pac-cell-value'));

    if (!markers) { wrap.appendChild(cell); return; }

    // Marked mode: wrap the box in a column with a bracketed index label and a
    // marker track. The index label sits BELOW the box; markers whose index
    // equals this cell's position sit side by side beneath it, each caret over
    // its own labelled variable name.
    const col = document.createElement('div');
    col.className = 'pac-cell-col';
    col.appendChild(cell);

    const index = document.createElement('div');
    index.className = 'pac-cell-index';
    index.textContent = `[${c.label != null ? c.label : idx}]`;
    col.appendChild(index);

    const track = document.createElement('div');
    track.className = 'pac-cell-markers';
    for (const m of markers) {
      if (m.index === idx) track.appendChild(marker(m));
    }
    col.appendChild(track);
    wrap.appendChild(col);
  });
}

/* One index-pointer marker: a caret with its variable name labelled beneath. */
function marker(m) {
  const mk = document.createElement('span');
  mk.className = 'pac-marker';
  mk.innerHTML = `<span class="pac-marker-caret">&#9650;</span>` +
                 `<span class="pac-marker-label">${esc(m.label)}</span>`;
  return mk;
}

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

 return { mount, render }; })();
const nodesPanel = (() => { /* NODES panel — nodes with typed edges.
 *
 * One renderer for: linked lists, doubly linked lists, BSTs, heaps-as-trees,
 * recursion call trees, class hierarchies, object graphs, GC reachability,
 * UML diagrams, flowcharts, adjacency lists. They differ in node template,
 * edge template, and layout -- and in nothing else.
 *
 * Step data:
 *   { layout:   'tree' | 'linear' | 'graph',
 *     template: 'plain' | 'record',
 *     nodes: [{id, parent, label, meta[], state, active, fields[], slot, row}],
 *     edges: [{from, to, state}] }       // implied by `parent` for trees
 *
 * Two INDEPENDENT color channels (AUTHORING.md "Node color channels"):
 *   - `state`  -> the OUTLINE (membership/traversal): green member, amber
 *                 `unlinked`, dim `pending`, blue traversal frontier.
 *   - `active` -> the FILL (activity): a truthy `active` flags "this node is
 *                 being modified on THIS step" and paints a blue interior,
 *                 orthogonal to `state`. An unlinked node can be amber-outline
 *                 + blue-fill at once; a settled member, green-outline +
 *                 blue-fill. Fill never changes the outline, and vice versa.
 *
 * Snapshots include not-yet-visited nodes as state 'pending', so layout is
 * computed over the whole structure and nodes never jump between steps.
 *

 *     list.n25.prev   list.n25.next   list.n25

const NW = 74, HGAP = 16, VGAP = 62, PAD = 20;
const RW = 112, RH = 38, RGAP = 46, RROW = 84;   // record geometry

/* Plain-node vertical metrics. The box height is DERIVED from how many `meta`
 * lines a node carries so the label + every meta line (e.g. "level 3" /
 * "depth 2") sit inside the box and are never clipped -- see AUTHORING.md
 * "Node sizing". LABEL_Y / META_Y0 are text baselines from the box top. */
const LABEL_Y = 17, META_Y0 = 30, META_LH = 11, META_PAD = 8, NH_MIN = 24;
const plainH = metaMax =>
  metaMax > 0 ? META_Y0 + (metaMax - 1) * META_LH + META_PAD : NH_MIN;

function mount(body) {
  body.innerHTML = `<svg class="pac-nodes" xmlns="http://www.w3.org/2000/svg"></svg>`;
}

function render(body, data, ctx) {
  const svg = body.querySelector('svg');
  if (!data?.nodes?.length) { svg.innerHTML = ''; return; }

  const record = data.template === 'record';
  // Box height fits the tallest node's meta stack, so meta text never clips.
  const metaMax = Math.max(0, ...data.nodes.map(n => n.meta?.length ?? 0));
  const w = record ? RW : NW, h = record ? RH : plainH(metaMax);
  const pos = layout(data, record);

  const xs = [...pos.values()].map(p => p.x), ys = [...pos.values()].map(p => p.y);

  svg.setAttribute('height', Math.min(H, 440));

  const edges = (data.edges ?? impliedEdges(data.nodes)).map(e => {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) return '';
    return `<path class="pac-edge" data-state="${e.state ?? ''}" d="M ${a.x} ${a.y + h} L ${b.x} ${b.y}"/>`;
  }).join('');

  svg.innerHTML = edges + data.nodes.map(n => {
    const p = pos.get(n.id);
    return record ? recordNode(n, p) : plainNode(n, p, h);
  }).join('');

function plainNode(n, p, h) {
  const meta = (n.meta ?? []).map((m, k) =>
    `<text class="pac-node-meta" x="${p.x}" y="${p.y + META_Y0 + k * META_LH}">${esc(m)}</text>`).join('');

/** [ prev | value | next ] — the shape of lists.9.gif, made addressable. */
function recordNode(n, p) {
  const fields = n.fields ?? ['prev', 'value', 'next'];
  const x0 = p.x - RW / 2;
  let cx = x0;
  const cells = fields.map(f => {
    const fw = (f === 'value' ? 0.42 : 0.29) * RW;
    const val = f === 'value' ? n.label : (n[f] == null ? '\u2205' : '\u25cf');
    const g = `<g data-anchor="${n.id}.${f}">
        <rect class="pac-node-box" x="${cx}" y="${p.y}" width="${fw}" height="${RH}"/>

    `<text class="pac-node-meta" x="${p.x}" y="${p.y + RH + 13 + k * 11}">${esc(m)}</text>`).join('');
  return `<g class="pac-node" data-state="${n.state ?? 'exited'}" data-active="${!!n.active}" data-anchor="${n.id}">${cells}${meta}</g>`;

/* ---- layout ---- */

function layout(data, record) {
  const mode = data.layout ?? 'tree';
  const pos = new Map();
  const w = record ? RW : NW;

  if (mode === 'linear') {
    const gap = record ? RGAP : 34;
    data.nodes.forEach((n, k) => pos.set(n.id, {
      x: PAD + w / 2 + (n.slot ?? k) * (w + gap),
      y: PAD + (n.row ?? 0) * RROW,
    }));
    return pos;
  }

  if (mode === 'graph') {
    const R = 30 + data.nodes.length * 13;
    data.nodes.forEach((n, k) => {
      const t = (k / data.nodes.length) * 2 * Math.PI - Math.PI / 2;
      pos.set(n.id, { x: R + PAD + R * Math.cos(t), y: R + PAD + R * Math.sin(t) });
    });
    return pos;
  }

  const kids = new Map();
  for (const n of data.nodes) {
    if (n.parent == null) continue;
    if (!kids.has(n.parent)) kids.set(n.parent, []);
    kids.get(n.parent).push(n.id);
  }
  let leaf = 0;
  const walk = (id, d) => {
    const cs = kids.get(id) ?? [];
    if (!cs.length) { pos.set(id, { x: PAD + NW / 2 + leaf++ * (NW + HGAP), y: PAD + d * VGAP }); return; }
    cs.forEach(c => walk(c, d + 1));
    const cx = cs.map(c => pos.get(c).x);
    pos.set(id, { x: (Math.min(...cx) + Math.max(...cx)) / 2, y: PAD + d * VGAP });
  };
  data.nodes.filter(n => n.parent == null).forEach(r => walk(r.id, 0));
  return pos;
}

function impliedEdges(nodes) {
  return nodes.filter(n => n.parent != null)
    .map(n => ({ from: n.parent, to: n.id, state: n.state === 'pending' ? '' : 'taken' }));
}

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

 return { mount, render }; })();
const streamPanel = (() => { /* STREAM panel — append-only text, two directions.
 * Step data: { lines: [{text, dir, indent, isNew}], cursor: bool }
 * `dir: 'in'` renders a prompt / visible pause / echoed input. No file in the
 * original 25 modelled input at all, yet every CS1 assignment is prompt-driven. */

function mount(body) { body.innerHTML = '<div class="pac-stream"></div>'; }

function render(body, data) {
  const lines = data?.lines ?? [];
  const html = lines.map(l =>
    `<div class="pac-stream-line dir-${l.dir ?? 'out'}${l.isNew ? ' is-new' : ''}">${
      ' '.repeat((l.indent ?? 0) * 4)}${esc(l.text)}</div>`).join('');
  const cur = data?.cursor ? '<div class="pac-stream-line dir-in"><span class="pac-stream-cursor">&#9608;</span></div>' : '';
  body.querySelector('.pac-stream').innerHTML = html + cur;

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

 return { mount, render }; })();
const chartPanel = (() => { /* CHART panel — series over n.

 * Step data: { series: [{name, color, points:[[x,y],..]}], xLabel, yLabel, marker: x } */

function mount(body) {
  body.innerHTML = `<svg class="pac-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200"></svg>`;
}

function render(body, data) {
  const svg = body.querySelector('svg');
  if (!data?.series?.length) { svg.innerHTML = ''; return; }
  const W = 320, H = 200, L = 34, B = 24;
  const pts = data.series.flatMap(s => s.points);
  const mx = Math.max(...pts.map(p => p[0]), 1), my = Math.max(...pts.map(p => p[1]), 1);
  const X = x => L + (x / mx) * (W - L - 8);

    `<path class="pac-chart-series" stroke="${s.color ?? 'var(--accent)'}"

       fill="${s.color ?? 'var(--accent)'}" text-anchor="end">${s.name}</text>`).join('');

    ? `<line class="pac-chart-axis" x1="${X(data.marker)}" y1="10" x2="${X(data.marker)}" y2="${H - B}"

    <line class="pac-chart-axis" x1="${L}" y1="10" x2="${L}" y2="${H - B}"/>
    <line class="pac-chart-axis" x1="${L}" y1="${H - B}" x2="${W - 8}" y2="${H - B}"/>
    <text class="pac-chart-tick" x="${W - 8}" y="${H - 8}" text-anchor="end">${data.xLabel ?? 'n'}</text>
    <text class="pac-chart-tick" x="4" y="14">${data.yLabel ?? ''}</text>
    ${marker}${paths}`;
}

function take(gen, max) {
  const out = [];
  for (const v of gen) { out.push(v); if (out.length >= max) break; }
  return out;
}

/** Restart a one-shot CSS pulse: drop the class, force reflow, re-add. */
function flash(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;               // force reflow so the animation restarts
  el.classList.add(cls);
}

/* The red warning triangle for a memory-integrity violation. Project-wide,
 * cross-course convention -- red ⚠ always means "memory just went wrong". */
const DANGER_MARK = '⚠';

/**
 * Render segmented content (narration or a note) into `el`.
 *
 * `content` is either a plain string (the common case -- nearly every step),
 * or an array of segments. A segment is a string, or an object; an object with
 * `danger: true` renders a leading red ⚠ and the danger-red colour (--error),
 * naming a memory-integrity violation. Returns true iff anything was written,
 * so the caller can collapse an empty note box.
 */
function renderSegments(el, content) {
  el.textContent = '';
  if (content == null || content === '') return false;
  const segs = Array.isArray(content) ? content : [content];
  let wrote = false;
  for (const seg of segs) {
    if (seg == null || seg === '') continue;
    if (typeof seg === 'string') {
      el.appendChild(document.createTextNode(seg));
      wrote = true;
    } else if (seg.danger) {
      const span = document.createElement('span');
      span.className = 'pac-danger';
      span.textContent = `${DANGER_MARK} ${seg.text ?? ''}`;
      el.appendChild(span);
      wrote = true;
    } else if (typeof seg.text === 'string') {
      el.appendChild(document.createTextNode(seg.text));
      wrote = true;
    }
  }
  return wrote;
}

/** Mount an animation from its content module. */
function mountAnimation(spec, el = document.getElementById('pac')) {
  return new Engine(el, spec);
}

/* ds — A10 "Doubly linked list operations"
 *
 * From lists2.html, the four lines that insert `ins` before `temp`:
 *
 *     ins.prev      = temp.prev
 *     ins.next      = temp
 *     ins.prev.next = ins          <- dereferences what line 1 set
 *     temp.prev     = ins
 *
 * Line 3 reads `ins.prev`, which line 1 wrote. Do line 4 first and line 1
 * reads a pointer that already points at `ins`, so `ins.prev` becomes `ins`
 * itself; line 3 then overwrites `ins.next` with `ins`. The new node points at
 * itself in both directions, the front of the list never learns it exists, and
 * -- in Neven's words -- simply "losing it" is not an option.
 *
 * Every arrow on screen is data resolved against a live DOM box. Nothing here
 * is a hand-placed curve. */

const HEAD = 'n12';

const LISTINGS = {
  pseudo: [
    '// insert node ins before node temp',
    'ins.prev = temp.prev',
    'ins.next = temp',
    'ins.prev.next = ins',
    'temp.prev = ins',
  ],
  java: [
    '// insert node ins before node temp',
    'ins.prev = temp.prev;',
    'ins.next = temp;',
    'ins.prev.next = ins;',
    'temp.prev = ins;',
  ],
  cpp: [
    '// insert node ins before node temp',
    'ins->prev = temp->prev;',
    'ins->next = temp;',
    'ins->prev->next = ins;',
    'temp->prev = ins;',
  ],
};

/* The four assignments, as data. Both orderings reuse them. */
const OPS = {
  A: { line: 2, name: 'ins.prev = temp.prev',
       apply: m => { m[m.ins].prev = m[m.temp].prev; return m.ins; },
       say:   m => `ins.prev now points where temp.prev points — to ${label(m, m[m.temp].prev)}.` },
  B: { line: 3, name: 'ins.next = temp',
       apply: m => { m[m.ins].next = m.temp; return m.ins; },
       say:   () => `ins.next points forward at temp. The new node is now linked in from its own side.` },
  C: { line: 4, name: 'ins.prev.next = ins',
       apply: m => { const p = m[m.ins].prev; if (p == null) return null; m[p].next = m.ins; return p; },
       say:   m => `Follow ins.prev to ${label(m, m[m.ins].prev)}, then set its next to ins. This line depends on line 2 having run.` },
  D: { line: 5, name: 'temp.prev = ins',
       apply: m => { m[m.temp].prev = m.ins; return m.temp; },
       say:   () => `temp.prev now points to ins. 25 ↔ 37 is now linked in both directions.` },
};

const ORDER = ['A', 'B', 'C', 'D'];

const label = (m, id) => (id == null ? 'null' : m[id].value);

/** A node is fully linked into the list only when the insertion is COMPLETE:
 *  it has both a prev and a next, AND both neighbours point back at it. Until
 *  then the inserted node is 'unlinked' (see AUTHORING.md "Node membership
 *  state"). This is stricter than mere forward reachability -- after
 *  ins.prev.next = ins the node is reachable, but temp.prev still points past
 *  it, so it is not yet a full member. */
function linkedIn(m, id) {
  const n = m[id];
  return n.prev != null && n.next != null &&
         m[n.prev].next === id && m[n.next].prev === id;
}

function fresh() {
  return {
    ins: 'n25', temp: 'n37', head: HEAD,
    n12: { value: 12, prev: null,  next: 'n37', slot: 0,   row: 0 },
    n37: { value: 37, prev: 'n12', next: 'n99', slot: 1,   row: 0 },
    n99: { value: 99, prev: 'n37', next: null,  slot: 2,   row: 0 },
    n25: { value: 25, prev: null,  next: null,  slot: 0.55, row: 1 },
  };
}

const NODE_IDS = ['n12', 'n37', 'n99', 'n25'];

/** Walk forward from head. Bounded, because a corrupted list contains a cycle. */
function walk(m) {
  const seen = [];
  let cur = m.head, guard = 0;
  while (cur != null && guard++ < 8) {
    if (seen.includes(m[cur].value)) { seen.push('\u21bb'); break; }
    seen.push(m[cur].value);
    cur = m[cur].next;
  }
  return seen;
}

function arrows(m) {
  const out = [];
  for (const id of NODE_IDS) {
    const n = m[id];
    if (n.next != null)
      out.push({ from: `list.${id}.next`, to: `list.${n.next}`, bend: 'up',
                 style: n.next === id ? 'stale' : 'pointer' });
    if (n.prev != null)
      out.push({ from: `list.${id}.prev`, to: `list.${n.prev}`, bend: 'down',
                 style: n.prev === id ? 'stale' : 'pointer' });
  }
  out.push({ from: 'vars.head', to: `list.${m.head}` });
  out.push({ from: 'vars.ins',  to: `list.${m.ins}` });
  out.push({ from: 'vars.temp', to: `list.${m.temp}` });
  return out;
}

function snap(m, { line, tag, narrate, note, touched }) {
  const reach = walk(m);
  return {
    tag, narrate, line, note,
    arrows: arrows(m),
    panels: {
      list: {
        layout: 'linear', template: 'record',
        nodes: NODE_IDS.map(id => ({
          id, label: String(m[id].value),
          prev: m[id].prev, next: m[id].next,
          slot: m[id].slot, row: m[id].row,
          // Two INDEPENDENT color channels (AUTHORING.md "Node color channels").
          //
          // OUTLINE = membership. The node being inserted (m.ins) is 'unlinked'
          // (amber) until the insertion is COMPLETE -- all four links set AND
          // both neighbours pointing back (see linkedIn) -- at which point, on
          // the final step, it becomes a 'member' (green). Every already-settled
          // list node is a 'member' throughout. Partial linking and activity
          // never flip the outline green early; node 25 is HEALTHY the whole
          // time, never danger (AUTHORING.md "Memory-danger marker").
          //
          // FILL = activity. `active` flags the node modified on THIS step (the
          // one op.apply touched), painting a blue interior orthogonal to the
          // outline. So node 25 is amber-outline + blue-fill while its own links
          // are being set, and a settled green member shows a blue fill on the
          // step it is rewired.
          state:  (id === m.ins && !linkedIn(m, id)) ? 'unlinked' : 'member',
          active: id === touched,
        })),
        edges: [],
      },
      vars: {
        render: 'row',
        cells: [
          { label: 'head', value: '\u25cf', anchor: 'head' },
          { label: 'ins',  value: '\u25cf', anchor: 'ins', role: 'active' },
          { label: 'temp', value: '\u25cf', anchor: 'temp' },
        ],
      },
      walk: {
        render: 'box',
        cells: reach.map(v => ({ value: v, role: v === 25 ? 'ok' : undefined })),
      },
    },
  };
}

/* Three teaching notes, kept out of the step flow (AUTHORING.md "Steps vs.
 * notes"): a setup note on the initial-state step, the ordering-pitfall warning
 * on the assignment it concerns, and the post-watch challenge on the last step. */
const SETUP =
  'A doubly linked list, 12 \u2194 37 \u2194 99, fully linked. A new node holding 25 has been ' +
  'allocated and ins points to it \u2014 and its own prev and next are still null, so it is ' +
  'not yet part of the list. We want it before 37 (temp); the four assignments below ' +
  'link it in.';

const PITFALL =
  'A common mistake is to run temp.prev = ins first: then ins.prev = temp.prev copies a ' +
  'pointer that already points back at ins, so ins.prev points to ins itself.';

const CHALLENGE =
  'What if line 4 (ins.prev.next = ins) had run before line 2 (ins.prev = temp.prev)? Trace it ' +
  'yourself: which node would ins.prev still point at, and what would line 4 then write through?';

/* A note per assignment, keyed by op letter. Only the ordering-critical first
 * assignment and the final one carry commentary. */
const NOTES = { A: PITFALL, D: CHALLENGE };

function makeTrace() {
  return function* () {
    const m = fresh();

    // Step 0 (required): the initial state, before anything executes -- no line
    // highlighted. The list is already linked 12 <-> 37 <-> 99; node 25 is
    // allocated and pointed to by ins (one arrow, ins -> 25) with its own prev
    // and next still null, so NO linking arrows join it to the list yet -- those
    // are exactly what the four assignments draw. The setup note lives here.
    yield snap(m, {
      line: null, tag: 'init', touched: null,
      narrate: 'The list before insertion. Node 25 is allocated and ins points to it, with its own prev and next still null.',
      note: SETUP,
    });

    // Every remaining step is a real execution: the four assignment lines, each
    // highlighted. The pitfall warning and the post-watch challenge are notes.
    for (const key of ORDER) {
      const op = OPS[key];
      const say = op.say(m);
      const touched = op.apply(m);
      yield snap(m, {
        line: op.line, tag: 'assign',
        narrate: `${op.name} \u2014 ${say}`,
        note: NOTES[key],
        touched,
      });
    }
  };
}

const SPEC = {
  title: 'Doubly linked insertion: why the order of four lines matters',
  subtitle: 'Inserting a node into a doubly linked list.',
  profile: 'standard',
  columns: 2,
  languages: ['pseudo', 'java', 'cpp'],

  panels: [
    { type: 'code',   id: 'code', title: 'insert ins before temp',
      listings: LISTINGS, labels: { pseudo: 'pseudocode', java: 'Java', cpp: 'C++' } },
    { type: 'nodes',  id: 'list', title: 'The list' },
    { type: 'cells',  id: 'vars', title: 'Pointer variables' },
    { type: 'cells',  id: 'walk', title: 'Walk forward from head' },
  ],

  initialTrace: 'correct',
  traces: {
    correct: makeTrace(),
  },
};

mountAnimation(SPEC);
</script></body></html>
